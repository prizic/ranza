    integrations: state.integrations.filter((i) => i.status === 'error').length,
  };
  const item = (i) => <button key={i} aria-current={(screen === 'profile' ? 'people' : screen) === i ? 'page' : undefined} onClick={() => go(i)}><Icon name={SCREEN_ICON[i] || i} /><span className="label">{t(i)}</span>{counts[i] ? <span className="count num" aria-label={`${counts[i]} need attention`}>{counts[i]}</span> : null}</button>;
  return (
    <nav className="side" aria-label="Main">
      <div className="brand">{role === 'prizic' ? <><span className="brand-mark" style={{ background: 'var(--surface-strong)' }}>P</span><span><b>Prizic</b><small>Ranza Control Plane</small></span></> : <><span className="brand-mark">{state.branding.initial}</span><span><b>{state.branding.name}</b><small>Powered by Ranza</small></span></>}</div>
      <div className="nav">
        {role === 'resident' ? <button aria-current="page" onClick={() => go('portal')}><Icon name="portal" /><span className="label">{t('portal')}</span></button>
          : role === 'prizic' ? CP_NAV.map(item)
          : NAV.map((g) => {
            const items = g.items.filter((i) => allowed.includes(i) && !state.disabledModules.includes(i)); if (!items.length) return null;
            return <Fragment key={g.group}><h6>{t(g.group)}</h6>{items.map(item)}</Fragment>;
          })}
      </div>
      <div className="side-foot">Interactive mockup. Changes last until you reload the page.</div>
    </nav>
  );
}

function TopBar({ role, onSignOut, onSwitch }) {
  const { state, propertyId, setPropertyId, lang, setLang, theme, setTheme, go, mutate } = useApp(); const t = useT(); const f = useFormat();
  const prop = state.properties.find((p) => p.id === propertyId);
  const me = ROLES.find((r) => r.id === role);
  const staffView = role !== 'resident' && role !== 'prizic';
  const [q, setQ] = useState(''); const [focus, setFocus] = useState(false); const [bell, setBell] = useState(false);
  const results = useMemo(() => {
    if (q.trim().length < 2) return [];
    const n = q.toLowerCase();
    const people = state.people.filter((p) => p.name.toLowerCase().includes(n)).slice(0, 5).map((p) => ({ label: p.name, sub: p.kind === 'resident' ? 'Resident' : 'Guest', avatar: p.name, act: () => go('profile', { personId: p.id }) }));
    const rooms = state.rooms.filter((r) => r.propertyId === propertyId && r.number.includes(n)).slice(0, 4).map((r) => ({ label: `Room ${r.number}`, sub: `${r.building}, ${t('floor').toLowerCase()} ${r.floor}`, act: () => go('rooms', { roomId: r.id }) }));
    const refs = state.stays.filter((s) => s.ref.toLowerCase().includes(n)).slice(0, 3).map((s) => ({ label: s.ref, sub: state.people.find((p) => p.id === s.personId).name, act: () => go('reservations', { stayId: s.id }) }));
    const items = state.inventory.items.filter((i) => i.name.toLowerCase().includes(n)).slice(0, 2).map((i) => ({ label: i.name, sub: `Inventory, ${i.onHand} ${i.unit}`, act: () => go('inventory') }));
    return [...rooms, ...people, ...refs, ...items];
  }, [q, state, propertyId]);
  const unread = state.notifications.filter((n) => !n.read);
  return (
    <header className="top">
      {staffView && (
        <div style={{ position: 'relative', flex: 1, maxWidth: 420 }}>
          <label className="search" style={{ maxWidth: 'none' }}><Icon name="search" size={16} /><input value={q} onChange={(e) => setQ(e.target.value)} onFocus={() => setFocus(true)} onBlur={() => setTimeout(() => setFocus(false), 150)} placeholder={t('search')} aria-label={t('search')} /></label>
          {focus && results.length > 0 && <div className="menu" style={{ insetInlineStart: 0, insetInlineEnd: 'auto', width: '100%' }}>{results.map((r, i) => <button key={i} onClick={() => { r.act(); setQ(''); }}>{r.avatar ? <Avatar name={r.avatar} size={28} /> : <Icon name="search" size={16} />}<span><b>{r.label}</b><span className="muted" style={{ display: 'block', fontSize: 12 }}>{r.sub}</span></span></button>)}</div>}
        </div>
      )}
      {role === 'prizic' && <b style={{ fontSize: 15 }}>Prizic Control Plane <span className="badge b-warn" style={{ marginInlineStart: 8 }}>Staff only</span></b>}
      <span className="spacer" />
      {staffView && <span className="chip date"><Icon name="clock" size={16} />{t('businessDay')} {f.date(TODAY)}, {t('closes')} {prop.cutoff}</span>}
      {staffView && (role === 'owner' || role === 'manager' || role === 'finance') ? (
        <label className="chip" style={{ paddingInlineEnd: 4 }}><Icon name="building" size={16} /><span className="sr-only">Property</span>
          <select value={propertyId} onChange={(e) => { setPropertyId(e.target.value); }} style={{ border: 0, background: 'transparent', fontWeight: 600, height: 36, cursor: 'pointer' }}>{state.properties.filter((p) => role !== 'manager' || p.id !== 'p3').map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}</select>
        </label>
      ) : staffView ? <span className="chip" style={{ cursor: 'default' }}><Icon name="building" size={16} />{prop.name}</span> : null}
      <div className="seg" role="group" aria-label={t('language')}>{['en', 'tr', 'ar'].map((l) => <button key={l} aria-pressed={lang === l} onClick={() => setLang(l)}>{l.toUpperCase()}</button>)}</div>
      <button className="icon-btn seg theme" aria-label={`${t('theme')}: ${theme === 'dark' ? t('light') : t('dark')}`} onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} style={{ border: '1px solid var(--line)' }}><Icon name={theme === 'dark' ? 'sun' : 'moon'} /></button>
      {staffView && (
        <div style={{ position: 'relative' }}>
          <button className="icon-btn" aria-label={`Notifications, ${unread.length} new`} aria-expanded={bell} onClick={() => setBell(!bell)} style={{ border: '1px solid var(--line)', position: 'relative' }}><Icon name="bell" />{unread.length > 0 && <span style={{ position: 'absolute', top: 7, insetInlineEnd: 8, width: 8, height: 8, borderRadius: 4, background: 'var(--danger)' }} />}</button>
          {bell && <div className="menu" style={{ width: 340 }}>{state.notifications.slice(0, 5).map((n) => <div key={n.id} className="list-item" style={{ padding: 10 }}><Icon name={n.kind} size={16} /><div><div style={{ fontWeight: n.read ? 400 : 600 }}>{n.text}</div><div className="muted" style={{ fontSize: 12 }}>{n.module}, {n.when}</div></div></div>)}<hr /><button onClick={() => { setBell(false); mutate((s) => s.notifications.forEach((n) => { n.read = true; })); go('notifications'); }}>See all notifications</button></div>}
        </div>
      )}
      <Menu label={`Account: ${me.name}`} icon="people" buttonClass="icon-btn" items={[
        ...ROLES.filter((r) => r.id !== role).map((r) => ({ label: `${t('switchRole')}: ${r.title}`, icon: 'people', onClick: () => onSwitch(r.id) })),
        { label: 'View the public website', icon: 'door', onClick: () => onSwitch('public') },
        '-', { label: t('signOut'), icon: 'logout', onClick: onSignOut },
      ]} />
      <span style={{ display: 'flex', gap: 8, alignItems: 'center' }}><Avatar name={me.name} /><span style={{ lineHeight: 1.2 }}><b style={{ display: 'block', fontSize: 13 }}>{me.name}</b><span className="muted" style={{ fontSize: 12 }}>{me.title}</span></span></span>
    </header>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
