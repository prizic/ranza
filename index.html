        <section className="card"><div className="card-h"><h2>Revenue this month</h2><b className="num">{f.money(revenue.reduce((a, r) => a + r.value, 0))}</b></div><div className="card-b"><BarList rows={revenue} format={f.money} /></div></section>
      </div>

  );

function extendSeed(st) {
  const r = rng(777);
  const any = (a) => a[Math.floor(r() * a.length)];
  const p1Stays = st.stays.filter((s) => s.propertyId === 'p1');

  st.people.forEach((p) => {
    p.emergency = { name: `${any(FIRST)} ${p.name.split(' ')[1]}`, relation: any(['Mother', 'Father', 'Sister', 'Brother', 'Guardian']), phone: `+90 5${Math.floor(30 + r() * 60)} ${Math.floor(100 + r() * 899)} ${Math.floor(1000 + r() * 8999)}` };
    p.kbs = r() < 0.85 ? 'sent' : 'pending';
    p.documents = [{ kind: 'ID card or passport', status: r() < 0.9 ? 'verified' : 'missing' }];
    if (p.kind === 'resident') {
      p.documents.push({ kind: 'Student certificate', status: r() < 0.8 ? 'verified' : 'missing' });
      p.contract = { term: '2026–2027 academic year', rent: 9000, deposit: 18000, status: r() < 0.85 ? 'signed' : 'awaiting signature', signedOn: addDays(TODAY, -Math.floor(20 + r() * 60)) };
    }
    p.consent = { email: r() < 0.7, whatsapp: r() < 0.5 };
    p.segments = [p.kind === 'resident' ? 'Residents 2026–27' : 'Short-stay guests', ...(r() < 0.2 ? ['Returning'] : []), ...(p.country !== 'Türkiye' ? ['International'] : [])];
  });

  // group booking and deposits
  const group = 'Erasmus group, TU Munich';
  st.stays.filter((s) => s.propertyId === 'p1' && s.status === 'confirmed' && s.start > TODAY).slice(0, 5).forEach((s) => { s.group = group; });
  st.stays.filter((s) => s.status === 'confirmed').slice(0, 12).forEach((s, i) => { if (i % 2 === 0) s.deposit = s.kind === 'resident' ? 18000 : 1850; });
  const quotePerson = { id: 'uq1', name: 'Lea Hoffmann', kind: 'guest', country: 'Germany', phone: '+49 151 2233 4455', email: 'lea.hoffmann@mail.test', documents: [], segments: ['Short-stay guests'], consent: { email: true, whatsapp: false }, emergency: { name: '—', relation: '—', phone: '—' }, kbs: 'pending' };
  st.people.push(quotePerson);
  st.stays.push({ id: 'sq1', ref: 'RZ-Q-0041', personId: 'uq1', propertyId: 'p1', roomId: null, bedId: null, kind: 'guest', status: 'quote', start: addDays(TODAY, 21), end: addDays(TODAY, 26), eta: '—', quote: { rate: 1850, validUntil: addDays(TODAY, 5) } });
  st.folios.push({ id: 'fsq1', stayId: 'sq1', status: 'open', lines: [] });

  st.invoices = [
    { id: 'GIB2026000000418', stayId: p1Stays.find((s) => s.status === 'departed').id, date: addDays(TODAY, -2), total: 7400, type: 'e-Arşiv', status: 'accepted' },
    { id: 'GIB2026000000419', stayId: p1Stays.filter((s) => s.status === 'departed')[1].id, date: addDays(TODAY, -1), total: 3700, type: 'e-Arşiv', status: 'accepted' },
  ];

  st.hkTasks = st.rooms.filter((x) => x.propertyId === 'p1' && (x.hk === 'dirty' || x.hk === 'cleaning')).map((x, i) => ({

/* ============================================================
   Prices and taxes (illustrative Turkish setup)
   ============================================================ */
const NIGHT_RATE = { single: 1650, double: 2100, triple: 2400, quad: 850, dorm: 650, studio: 2600 };
const VAT = 0.10, ACC_TAX = 0.02;
function quoteFor(kind, type, start, end) {
  if (kind === 'resident') { const months = end ? Math.max(1, Math.round(diffDays(start, end) / 30)) : 1; return { unit: 'month', units: months, rate: 9000, total: months * 9000 }; }
  const nights = end ? Math.max(1, diffDays(start, end)) : 1; const rate = NIGHT_RATE[type] || 1850; return { unit: 'night', units: nights, rate, total: nights * rate };
}
const taxOf = (gross) => { const net = gross / (1 + VAT + ACC_TAX); return { net, vat: net * VAT, acc: net * ACC_TAX }; };

/* ============================================================

   ============================================================ */
function MoveStayModal({ stay, onClose }) {
  const { state, mutate, toast, log } = useApp(); const f = useFormat();
  const p = state.people.find((x) => x.id === stay.personId); const from = placeOf(state, stay);
  const options = useMemo(() => freeBeds(state, stay.propertyId), []);
  const [choice, setChoice] = useState(options[0] ? `${options[0].room.id}|${options[0].bedId || ''}` : '');
  const [reason, setReason] = useState('');
  const [roomId, bedId] = choice.split('|'); const to = state.rooms.find((r) => r.id === roomId);
  const person = p; const ruleClash = to && to.rule !== 'mixed' && stay.kind === 'resident' && (hashOf(person.name) % 2 === 0 ? 'women' : 'men') !== to.rule;
  const ok = !!to && reason.trim().length >= 3;
  return (
    <Modal title={`Move ${p.name}`} description={`Now in ${from?.text || 'no room'}.`} onClose={onClose}
      footer={<><button className="btn" onClick={onClose}>Cancel</button><button className="btn primary" disabled={!ok} onClick={() => {
        mutate((s) => { const x = s.stays.find((y) => y.id === stay.id); x.roomId = roomId; x.bedId = bedId || null; if (stay.status === 'in_house') { const old = s.rooms.find((r) => r.id === from.room.id); if (old) old.hk = 'dirty'; } });
        log('Moved stay', `${stay.ref}: ${from?.text} to room ${to.number}${bedId ? `, bed ${bedId}` : ''}`, reason.trim()); toast(`${p.name} moved to room ${to.number}${bedId ? `, bed ${bedId}` : ''}`); onClose();
      }}>Move</button></>}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <div className="field"><label htmlFor="mv">New room and bed</label><select id="mv" className="select" value={choice} onChange={(e) => setChoice(e.target.value)}>{options.map((o) => <option key={o.room.id + o.bedId} value={`${o.room.id}|${o.bedId || ''}`}>{o.label}, {f.typeName(o.room.type)}, {RULE_WORD[o.room.rule].toLowerCase()}</option>)}</select></div>
        {ruleClash && <div className="notice warn"><Icon name="alert" />Room {to.number} is {RULE_WORD[to.rule].toLowerCase()}. Check this is allowed before moving.</div>}
        {stay.status === 'in_house' && <div className="notice"><Icon name="housekeeping" />The old room will be marked dirty so housekeeping can prepare it.</div>}
        <div className="field"><label htmlFor="mvr">Reason</label><input id="mvr" className="input" value={reason} onChange={(e) => setReason(e.target.value)} placeholder="Roommate conflict, moved to a quieter room" /></div>
      </div>
    </Modal>
  );
}

const STATUS_WORDS = { quote: 'Quote', confirmed: 'Confirmed', in_house: 'In house', departed: 'Departed', cancelled: 'Cancelled', no_show: 'No-show' };
const STATUS_TONES = { quote: 'b-warn', confirmed: 'b-info', in_house: 'b-ok', departed: 'b-neutral', cancelled: 'b-bad', no_show: 'b-bad' };
function StatusBadge({ status }) { return <Badge tone={STATUS_TONES[status]}>{STATUS_WORDS[status]}</Badge>; }

  const mine = state.stays.filter((s) => s.propertyId === propertyId);
  const rows = mine.filter(filters[status]).filter((s) => { const p = state.people.find((x) => x.id === s.personId); return !q || (p.name + s.ref + (s.group || '')).toLowerCase().includes(q.toLowerCase()); }).sort((a, b) => a.start < b.start ? -1 : 1);
  const tabs = [['upcoming', 'Upcoming'], ['in_house', 'In house'], ['quotes', 'Quotes'], ['groups', 'Groups'], ['departed', 'Departed'], ['cancelled', 'Cancelled and no-shows'], ['all', 'All']];

          <span style={{ flex: 1 }} />
          <label className="search" style={{ height: 36, maxWidth: 280 }}><Icon name="search" size={16} /><input placeholder="Name, reference or group" value={q} onChange={(e) => setQ(e.target.value)} aria-label="Search reservations" /></label>

          <tbody>{rows.slice(0, 80).map((s) => { const p = state.people.find((x) => x.id === s.personId); const place = placeOf(state, s); return (

              <td><span style={{ display: 'flex', gap: 10, alignItems: 'center' }}><Avatar name={p.name} size={30} /><span>{p.name}<span className="sub">{s.kind === 'resident' ? 'Resident' : 'Guest'}</span></span></span></td>
              <td className="num">{f.date(s.start)} – {s.end ? f.date(s.end) : 'open'}<span className="sub">{s.end ? `${diffDays(s.start, s.end)} nights` : 'no end date'}</span></td>
              <td>{place ? place.text : <Badge tone="b-bad">Not assigned</Badge>}</td>
              <td className="num">{s.deposit ? f.money(s.deposit) : <span className="muted">—</span>}</td>

  const q = quoteFor(kind, type, start, openEnded ? null : end);

    const [roomId, bedId] = choice ? choice.split('|') : [null, null];

        const pid = `u${Date.now()}${i}`; const who = groupSize > 1 ? (i === 0 ? name.trim() : `${groupName.trim()}, guest ${i + 1}`) : name.trim();
        s.people.push({ id: pid, name: who, kind, country: '—', phone: '—', email: '—', documents: [], segments: [], consent: {}, emergency: { name: '—', relation: '—', phone: '—' }, kbs: 'pending' });
        const id = `s${Date.now()}${i}`; const ref = asQuote ? `RZ-Q-${Math.floor(100 + Math.random() * 899)}` : `RZ-${Math.floor(26000 + Math.random() * 999)}`; refs.push(ref);
        s.stays.push({ id, ref, personId: pid, propertyId, roomId: i === 0 ? roomId : null, bedId: i === 0 ? (bedId || null) : null, kind, status: asQuote ? 'quote' : 'confirmed', start, end: openEnded ? null : end, eta: '—', group: groupSize > 1 ? groupName.trim() : undefined, deposit: Number(deposit) || undefined, wantsType: type, quote: asQuote ? { rate: q.rate, validUntil: addDays(TODAY, 7) } : undefined });
        s.folios.push({ id: `f${id}`, stayId: id, status: 'open', lines: Number(deposit) && i === 0 ? [{ id: `dep${id}`, date: TODAY, desc: 'Deposit received', amount: -Number(deposit), kind: 'deposit' }] : [] });
      }

      <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1.6fr) minmax(220px,1fr)', gap: 20 }}>
        <div className="form-grid">
          <div className="field full"><label htmlFor="nn">{groupSize > 1 ? 'Group contact, full name' : 'Full name'}</label><input id="nn" className="input" value={name} onChange={(e) => setName(e.target.value)} placeholder="As written on the ID" /></div>
          <div className="field full"><span style={{ fontWeight: 600, fontSize: 13 }}>Who is staying?</span><div className="pills"><button type="button" className="pill" aria-pressed={kind === 'resident'} onClick={() => { setKind('resident'); setEnd('2027-06-30'); }}>Resident, long stay</button><button type="button" className="pill" aria-pressed={kind === 'guest'} onClick={() => { setKind('guest'); setEnd(addDays(start, 3)); setOpenEnded(false); }}>Guest, short stay</button></div></div>
          <div className="field"><label htmlFor="ns">Arrives</label><input id="ns" type="date" className="input" value={start} min={TODAY} onChange={(e) => setStart(e.target.value)} /></div>

            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13 }} className="muted"><span>Includes accommodation tax 2%</span><span className="num">{f.money(tax.acc)}</span></div>

          <div className="field"><label htmlFor="cr">Reason</label><input id="cr" className="input" value={reason} onChange={(e) => setReason(e.target.value)} placeholder={dialog === 'cancel' ? 'Visa was refused' : 'No answer by phone or email'} />{s.deposit && <span className="hint">The {f.money(s.deposit)} deposit stays on the folio until someone refunds or keeps it.</span>}</div>
        </Modal>
      )}
      {dialog === 'dates' && (
        <Modal title={s.status === 'in_house' ? 'Extend or shorten the stay' : 'Change dates'} onClose={() => setDialog(null)}
          footer={<><button className="btn" onClick={() => setDialog(null)}>Cancel</button><button className="btn primary" disabled={!newEnd || newEnd <= (s.status === 'in_house' ? TODAY : s.start)} onClick={() => act((x) => { x.end = newEnd; }, newEnd > (s.end || '') ? 'Extended stay' : 'Shortened stay', `${p.name} now leaves on ${f.date(newEnd)}`)}>Save new date</button></>}>

            {s.end && newEnd && <div className="full notice"><Icon name="reservations" />{newEnd > s.end ? `${diffDays(s.end, newEnd)} extra nights. Check the bed is free for those nights on the room calendar.` : `${diffDays(newEnd, s.end)} fewer nights.`}</div>}
          </div>
        </Modal>
      )}
      {dialog === 'deposit' && (

          footer={<><button className="btn" onClick={() => setDialog(null)}>Cancel</button><button className="btn primary" disabled={!(Number(dep) > 0)} onClick={() => { mutate((st) => { const x = st.stays.find((y) => y.id === s.id); x.deposit = Number(dep); st.folios.find((y) => y.stayId === s.id).lines.push({ id: `dep${Date.now()}`, date: TODAY, desc: 'Deposit received', amount: -Number(dep), kind: 'deposit' }); }); log('Recorded deposit', `${s.ref}, ${f.money(Number(dep))}`); toast(`Deposit of ${f.money(Number(dep))} recorded`); setDialog(null); }}>Record deposit</button></>}>

        </Modal>
      )}

  );
}

/* ============================================================
   Close the day (night audit)
   ============================================================ */
function NightAudit() {
  const { state, propertyId, mutate, toast, log, go, role } = useApp(); const f = useFormat();
  const prop = state.properties.find((p) => p.id === propertyId);
  const here = state.stays.filter((s) => s.propertyId === propertyId);
  const notArrived = here.filter((s) => s.status === 'confirmed' && s.start <= TODAY);
  const notLeft = here.filter((s) => s.status === 'in_house' && s.end && s.end <= TODAY);
  const inHouse = here.filter((s) => s.status === 'in_house');
  const posted = state.folios.filter((fo) => fo.lines.some((l) => l.kind === 'night' && l.date === TODAY)).length;
  const toPost = inHouse.filter((s) => s.kind === 'guest').length;
  const closed = state.businessDay.closed;
  const step1 = notArrived.length === 0, step2 = notLeft.length === 0, step3 = posted >= toPost;
  const post = () => {
    mutate((st) => st.stays.filter((s) => s.propertyId === propertyId && s.status === 'in_house' && s.kind === 'guest').forEach((s) => { const room = st.rooms.find((r) => r.id === s.roomId); const fo = st.folios.find((x) => x.stayId === s.id); if (fo && !fo.lines.some((l) => l.kind === 'night' && l.date === TODAY)) fo.lines.push({ id: `n${s.id}${TODAY}`, date: TODAY, desc: 'Room night', amount: NIGHT_RATE[room.type] || 1850, kind: 'night' }); }));
    log('Posted room nights', `${toPost} folios, ${f.date(TODAY)}`); toast(`${toPost} room nights posted`);
  };
  const Step = ({ n, done, title, children }) => (
    <section className="card" style={{ marginBottom: 12 }}>
      <div className="card-h"><div style={{ display: 'flex', gap: 12, alignItems: 'center' }}><span className="dot-icon" style={{ background: done ? 'var(--success-soft)' : 'var(--warning-soft)', color: done ? 'var(--success)' : 'var(--warning)' }}>{done ? <Icon name="check" size={16} /> : <b>{n}</b>}</span><h2>{title}</h2></div>{done ? <Badge tone="b-ok">Done</Badge> : <Badge tone="b-warn">To do</Badge>}</div>
      {!done && <div className="card-b">{children}</div>}
    </section>
  );
  return (
    <>
      <PageHead title="Close the day" sub={`Finish business day ${f.longDate(TODAY)} at ${prop.name}. It closes automatically at ${prop.cutoff} if nothing is left open.`} />
      {closed && <div className="notice" style={{ marginBottom: 14, background: 'var(--success-soft)', color: 'var(--success)' }}><Icon name="check" />Business day closed. Totals were sent to Accounting and the next day has started.</div>}
      <Step n={1} done={step1} title={`Arrivals that did not arrive (${notArrived.length})`}>
        <table><tbody>{notArrived.map((s) => { const p = state.people.find((x) => x.id === s.personId); return <tr key={s.id}><td><b>{p.name}</b><span className="sub">{s.ref}, due {f.date(s.start)}</span></td><td style={{ textAlign: 'end' }}><button className="btn sm" onClick={() => go('frontdesk', { tab: 'arrivals' })}>Check in</button> <button className="btn sm" onClick={() => { mutate((st) => { st.stays.find((y) => y.id === s.id).status = 'no_show'; }); log('Marked no-show', s.ref, 'Did not arrive by close of day'); toast(`${p.name} marked as no-show`); }}>Mark no-show</button></td></tr>; })}</tbody></table>
      </Step>
      <Step n={2} done={step2} title={`Departures still in house (${notLeft.length})`}>
        <table><tbody>{notLeft.map((s) => { const p = state.people.find((x) => x.id === s.personId); return <tr key={s.id}><td><b>{p.name}</b><span className="sub">{placeOf(state, s)?.text}, due out {f.date(s.end)}</span></td><td style={{ textAlign: 'end' }}><button className="btn sm" onClick={() => go('frontdesk', { tab: 'departures' })}>Check out</button> <button className="btn sm" onClick={() => { mutate((st) => { st.stays.find((y) => y.id === s.id).end = addDays(TODAY, 1); }); log('Extended stay', s.ref, 'Extended by one night at close of day'); toast(`${p.name} extended by one night`); }}>Extend 1 night</button></td></tr>; })}</tbody></table>
      </Step>
      <Step n={3} done={step3} title={`Post tonight's room nights (${toPost} guests)`}>
        <p style={{ marginTop: 0 }}>Adds one room night to each in-house guest's folio. Residents are billed monthly, so they are not included.</p><button className="btn primary" onClick={post}>Post {toPost} room nights</button>
      </Step>
      <Step n={4} done={closed} title="Close the business day">
        <p style={{ marginTop: 0 }}>{step1 && step2 && step3 ? 'Everything is ready. Closing sends the day totals to Accounting and cannot be undone.' : 'Finish steps 1 to 3 first.'}</p>
        <button className="btn primary" disabled={!(step1 && step2 && step3) || role === 'housekeeping'} onClick={() => { mutate((st) => { st.businessDay.closed = true; st.accounting.journals.unshift({ id: `JE-${1000 + st.accounting.journals.length}`, date: TODAY, desc: `Business day close, ${f.date(TODAY)}: room nights`, source: 'Night audit', lines: [['120', 30600, 0], ['600', 0, 27000], ['391', 0, 3000], ['360', 0, 600]] }); }); log('Closed business day', f.date(TODAY)); toast('Business day closed'); }}>Close business day</button>
      </Step>
    </>
  );
}

function MoneyModal({ kind, balance, onClose, onPost }) {

    refund: { title: 'Record a refund', verb: 'Record refund', options: ['To card', 'Cash', 'Bank transfer'], def: String(Math.max(0, -balance)), sign: 1, desc: (o) => `Refund, ${o.toLowerCase()}`, max: -balance },
    discount: { title: 'Give a discount', verb: 'Give discount', options: ['Long-stay discount', 'Service recovery', 'Staff rate'], def: '', sign: -1, desc: (o) => o, max: null },
    charge: { title: 'Post a charge', verb: 'Post charge', options: ['Laundry', 'Breakfast', 'Damage', 'Key card', 'Late check-out'], def: '', sign: 1, desc: (o) => o, max: null },
  }[kind];
  const [amount, setAmount] = useState(cfg.def); const [opt, setOpt] = useState(cfg.options[0]); const n = Number(amount);
  const ok = n > 0 && (cfg.max === null || n <= cfg.max);
  return (
    <Modal title={cfg.title} onClose={onClose} footer={<><button className="btn" onClick={onClose}>Cancel</button><button className="btn primary" disabled={!ok} onClick={() => onPost(cfg.sign * n, cfg.desc(opt), kind)}>{cfg.verb}</button></>}>
      <div className="form-grid">
        <div className="field"><label htmlFor="amt">Amount (₺)</label><input id="amt" className="input num" inputMode="decimal" value={amount} onChange={(e) => setAmount(e.target.value.replace(/[^\d.]/g, ''))} />{cfg.max !== null && n > cfg.max && <span className="hint" style={{ color: 'var(--danger)' }}>More than the {f.money(cfg.max)} available.</span>}</div>
        <div className="field"><span style={{ fontWeight: 600, fontSize: 13 }}>{kind === 'payment' || kind === 'refund' ? 'Method' : 'Reason'}</span><div className="pills">{cfg.options.map((m) => <button key={m} type="button" className="pill" aria-pressed={opt === m} onClick={() => setOpt(m)}>{m}</button>)}</div></div>
        {(kind === 'payment' || kind === 'refund') && <div className="full notice"><Icon name="card" />This records money that already moved. Charging a card happens through the payments integration.</div>}
      </div>
    </Modal>
  );
}

          </tr>); })}</tbody>
      </table></div></section>}

        <section className="card"><div className="card-b" style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>

function Maintenance() {

    toast(status === 'done' && x.tookOutOfService ? `${x.id} done. Room ${x.roomId.split('-')[1]} is back in service and needs cleaning.` : `${x.id} moved to ${cols.find((c) => c[0] === status)[1].toLowerCase()}`);

      <div className="tabs" role="tablist" style={{ padding: 0, marginBottom: 16 }}>{[['board', 'Requests'], ['assets', 'Equipment'], ['plan', 'Service plan']].map(([k, l]) => <button key={k} role="tab" aria-selected={tab === k} onClick={() => setTab(k)}>{l}</button>)}</div>
      {tab === 'board' && <div className="kanban">

                <span style={{ fontSize: 13, display: 'flex', gap: 6, alignItems: 'center' }}>{x.assignee ? <><Avatar name={x.assignee} size={22} color={tech?.color} />{x.assignee}</> : <span style={{ color: 'var(--warning)', fontWeight: 600 }}>Not assigned</span>}</span>
              </article>); })}
          </section>
        ))}
      </div>}
      {tab === 'assets' && <section className="card"><div className="table-wrap"><table aria-label="Equipment"><thead><tr><th scope="col">Equipment</th><th scope="col">Where</th><th scope="col">Type</th><th scope="col">Last serviced</th><th scope="col">Next service</th><th scope="col">Condition</th></tr></thead>
        <tbody>{state.assets.map((a) => <tr key={a.id}><td><b>{a.name}</b><span className="sub">{a.id}</span></td><td>{a.location}</td><td>{a.category}</td><td className="num">{f.date(a.lastService, { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' })}</td><td className="num">{f.date(a.nextService, { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' })}</td><td><Badge tone={assetTone[a.status][0]}>{assetTone[a.status][1]}</Badge></td></tr>)}</tbody></table></div></section>}
      {tab === 'plan' && <section className="card"><div className="card-b list">{[...state.assets].sort((a, b) => a.nextService < b.nextService ? -1 : 1).map((a) => { const days = diffDays(TODAY, a.nextService); return (
        <div className="list-item" key={a.id}><span className="dot-icon" style={{ background: days < 0 ? 'var(--danger-soft)' : days < 14 ? 'var(--warning-soft)' : 'var(--success-soft)', color: days < 0 ? 'var(--danger)' : days < 14 ? 'var(--warning)' : 'var(--success)' }}><Icon name="wrench" size={16} /></span>
          <div style={{ flex: 1 }}><b>{a.name}</b><div className="muted" style={{ fontSize: 13 }}>{a.location}, every 6 months</div></div>
          <div style={{ textAlign: 'end' }}><b className="num">{f.date(a.nextService)}</b><div className="muted" style={{ fontSize: 13 }}>{days < 0 ? `${-days} days overdue` : days === 0 ? 'today' : `in ${days} days`}</div></div>
          <button className="btn sm" onClick={() => { mutate((s) => s.tickets.push({ id: `MT-${150 + s.tickets.length}`, propertyId, roomId: `${propertyId}-101`, title: `Planned service: ${a.name}`, priority: days < 0 ? 'high' : 'medium', status: 'new', created: TODAY, assignee: null, reporter: 'Service plan' })); toast(`Work order created for ${a.name}`); }}>Create work order</button>
        </div>); })}</div></section>}
      {creating && <TicketModal onClose={() => setCreating(false)} />}
    </>

}
function TicketModal({ onClose, fromPortal }) {
  const { state, propertyId, mutate, toast, log } = useApp();
  const rooms = state.rooms.filter((r) => r.propertyId === propertyId);
  const [room, setRoom] = useState(fromPortal?.roomId || rooms[0].id); const [title, setTitle] = useState(''); const [priority, setPriority] = useState('medium'); const [ooo, setOoo] = useState(false); const [tech, setTech] = useState('');
  const create = () => {
    mutate((s) => { s.tickets.push({ id: `MT-${130 + s.tickets.length}`, propertyId, roomId: room, title: title.trim(), priority, status: 'new', created: TODAY, assignee: tech || null, reporter: fromPortal ? 'Resident request' : 'Front desk', tookOutOfService: ooo }); if (ooo) s.rooms.find((r) => r.id === room).hk = 'ooo'; });
    log('Reported problem', `Room ${rooms.find((r) => r.id === room).number}: ${title.trim()}`, ooo ? 'Room taken out of service' : null);
    toast(ooo ? `Request sent. Room ${rooms.find((r) => r.id === room).number} is out of service.` : 'Request sent to maintenance'); onClose();
  };
  return (
    <Modal title={fromPortal ? 'Report a problem' : 'New maintenance request'} onClose={onClose} footer={<><button className="btn" onClick={onClose}>Cancel</button><button className="btn primary" disabled={title.trim().length < 3} onClick={create}>Send request</button></>}>
      <div className="form-grid">
        <div className="field full"><label htmlFor="tt">What is wrong?</label><input id="tt" className="input" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="The desk lamp doesn't turn on" /></div>
        {!fromPortal && <div className="field"><label htmlFor="troom">Room</label><select id="troom" className="select" value={room} onChange={(e) => setRoom(e.target.value)}>{rooms.map((r) => <option key={r.id} value={r.id}>Room {r.number}</option>)}</select></div>}
        {!fromPortal && <div className="field"><label htmlFor="ttech">Assign to</label><select id="ttech" className="select" value={tech} onChange={(e) => setTech(e.target.value)}><option value="">Decide later</option>{state.staff.filter((s) => s.role === 'maintenance').map((s) => <option key={s.id} value={s.name}>{s.name}</option>)}</select></div>}
        <div className="field full"><span style={{ fontWeight: 600, fontSize: 13 }}>How urgent?</span><div className="pills">{[['low', 'It can wait'], ['medium', 'This week'], ['high', 'Urgent']].map(([k, l]) => <button key={k} type="button" className="pill" aria-pressed={priority === k} onClick={() => setPriority(k)}>{l}</button>)}</div></div>
        {!fromPortal && <label className="switch full"><input type="checkbox" checked={ooo} onChange={(e) => setOoo(e.target.checked)} /><span>Take the room out of service until it is fixed. <span className="muted">The front desk will not be able to assign its beds.</span></span></label>}
      </div>
    </Modal>
  );
}

function StockModal({ dialog, onClose }) {
  const { state, mutate, toast, log, role } = useApp();
  const inv = state.inventory; const me = ROLES.find((r) => r.id === role)?.name || 'Staff';
  const [itemId, setItemId] = useState(dialog.itemId || inv.items[0].id); const [qty, setQty] = useState(''); const [note, setNote] = useState(''); const [to, setTo] = useState(inv.locations[0]);
  const item = inv.items.find((i) => i.id === itemId); const n = Number(qty);
  const isCount = dialog.kind === 'count'; const out = dialog.kind === 'Issue' || dialog.kind === 'Wastage' || dialog.kind === 'Transfer';
  const ok = qty !== '' && n >= 0 && (isCount || n > 0) && (!out || n <= item.onHand) && (dialog.kind !== 'Wastage' || note.trim().length > 2);
  const save = () => {
    const delta = isCount ? n - item.onHand : out ? -n : n;
    mutate((s) => {
      const it = s.inventory.items.find((i) => i.id === itemId);
      if (dialog.kind === 'Transfer') { it.onHand -= n; const existing = s.inventory.items.find((i) => i.name === it.name && i.location === to); if (existing) existing.onHand += n; else s.inventory.items.push({ ...it, id: `it${Date.now()}`, location: to, onHand: n }); }
      else it.onHand += delta;
      s.inventory.movements.push({ id: `mv${Date.now()}`, itemId, qty: dialog.kind === 'Transfer' ? -n : delta, kind: isCount ? 'Count adjustment' : dialog.kind, note: dialog.kind === 'Transfer' ? `To ${to}` : note || (isCount ? `Counted ${n}` : '—'), date: TODAY, who: me });
    });
    log(`Stock ${isCount ? 'count' : dialog.kind.toLowerCase()}`, `${item.name}, ${isCount ? `counted ${n}` : `${n} ${item.unit}`}`, note || null);
    toast(isCount ? `${item.name}: count recorded, difference ${delta > 0 ? '+' : ''}${delta}` : `${item.name}: ${dialog.kind.toLowerCase()} of ${n} ${item.unit} recorded`); onClose();
  };
  return (
    <Modal title={isCount ? 'Record a stock count' : { Issue: 'Issue stock', Receipt: 'Receive stock', Transfer: 'Transfer stock', Wastage: 'Record wastage' }[dialog.kind]} onClose={onClose} footer={<><button className="btn" onClick={onClose}>Cancel</button><button className="btn primary" disabled={!ok} onClick={save}>Record</button></>}>
      <div className="form-grid">
        <div className="field full"><label htmlFor="si">Item</label><select id="si" className="select" value={itemId} onChange={(e) => setItemId(e.target.value)}>{inv.items.map((i) => <option key={i.id} value={i.id}>{i.name}, {i.location}</option>)}</select><span className="hint">On hand now: {item.onHand} {item.unit}</span></div>
        <div className="field"><label htmlFor="sq">{isCount ? 'Counted quantity' : 'Quantity'}</label><input id="sq" className="input num" inputMode="numeric" value={qty} onChange={(e) => setQty(e.target.value.replace(/\D/g, ''))} />{out && n > item.onHand && <span className="hint" style={{ color: 'var(--danger)' }}>Only {item.onHand} on hand.</span>}{isCount && qty !== '' && <span className="hint">Difference: {n - item.onHand > 0 ? '+' : ''}{n - item.onHand}</span>}</div>
        {dialog.kind === 'Transfer' ? <div className="field"><label htmlFor="sto">To location</label><select id="sto" className="select" value={to} onChange={(e) => setTo(e.target.value)}>{inv.locations.filter((l) => l !== item.location).map((l) => <option key={l}>{l}</option>)}</select></div>
          : <div className="field"><label htmlFor="sn">{dialog.kind === 'Wastage' ? 'What happened' : 'Note'}</label><input id="sn" className="input" value={note} onChange={(e) => setNote(e.target.value)} placeholder={dialog.kind === 'Issue' ? 'Housekeeping, Block A' : dialog.kind === 'Wastage' ? 'Stained beyond repair' : ''} /></div>}
      </div>
    </Modal>
  );
}

      {tab === 'orders' && <section className="card"><div className="table-wrap"><table aria-label="Purchase orders"><thead><tr><th scope="col">Order</th><th scope="col">Supplier</th><th scope="col">Items</th><th scope="col" style={{ textAlign: 'end' }}>Total</th><th scope="col">Status</th><th scope="col"><span className="sr-only">Actions</span></th></tr></thead>

function ReceiveModal({ po, onClose }) {
  const { state, mutate, toast, log } = useApp();
  const [qtys, setQtys] = useState(Object.fromEntries(po.lines.map((l) => [l.itemId, String(l.qty - l.received)])));
  const item = (id) => state.inventory.items.find((i) => i.id === id);
  const save = () => {
    mutate((s) => {
      const o = s.procurement.orders.find((x) => x.id === po.id);
      o.lines.forEach((l) => { const n = Math.min(Number(qtys[l.itemId] || 0), l.qty - l.received); if (n > 0) { l.received += n; s.inventory.items.find((i) => i.id === l.itemId).onHand += n; s.inventory.movements.push({ id: `mv${Date.now()}${l.itemId}`, itemId: l.itemId, qty: n, kind: 'Receipt', note: `${po.id} received`, date: TODAY, who: 'Receiving' }); } });
      o.status = o.lines.every((l) => l.received >= l.qty) ? 'received' : 'partial';
    });
    log('Received goods', po.id); toast(`Goods received for ${po.id}. Stock updated.`); onClose();
  };
  return (
    <Modal title={`Receive goods for ${po.id}`} description="Enter what actually arrived. Stock goes up by these amounts." onClose={onClose} footer={<><button className="btn" onClick={onClose}>Cancel</button><button className="btn primary" onClick={save}>Record goods received</button></>}>
      <table><thead><tr><th scope="col">Item</th><th scope="col" style={{ textAlign: 'end' }}>Still expected</th><th scope="col">Arrived</th></tr></thead><tbody>{po.lines.map((l) => <tr key={l.itemId}><td>{item(l.itemId).name}</td><td className="num" style={{ textAlign: 'end' }}>{l.qty - l.received}</td><td><input className="input num" style={{ width: 100, height: 34 }} aria-label={`Arrived, ${item(l.itemId).name}`} value={qtys[l.itemId]} onChange={(e) => setQtys({ ...qtys, [l.itemId]: e.target.value.replace(/\D/g, '') })} /></td></tr>)}</tbody></table>
    </Modal>
  );
}

function Accounting() {

      {tab === 'journal' && <section className="card"><div className="table-wrap"><table aria-label="Journal entries"><thead><tr><th scope="col">Entry</th><th scope="col">Date</th><th scope="col">Description</th><th scope="col">Source</th><th scope="col" style={{ textAlign: 'end' }}>Amount</th></tr></thead>

          {open === j.id && <tr><td colSpan={5} style={{ background: 'var(--surface-2)' }}><table><thead><tr><th scope="col">Account</th><th scope="col" style={{ textAlign: 'end' }}>Debit</th><th scope="col" style={{ textAlign: 'end' }}>Credit</th></tr></thead><tbody>{j.lines.map((l, i) => <tr key={i}><td><span className="num">{l[0]}</span> {name(l[0])}</td><td className="num" style={{ textAlign: 'end' }}>{l[1] ? f.money(l[1]) : ''}</td><td className="num" style={{ textAlign: 'end' }}>{l[2] ? f.money(l[2]) : ''}</td></tr>)}<tr><td><b>Balanced</b></td><td className="num" style={{ textAlign: 'end' }}><b>{f.money(j.lines.reduce((a, l) => a + l[1], 0))}</b></td><td className="num" style={{ textAlign: 'end' }}><b>{f.money(j.lines.reduce((a, l) => a + l[2], 0))}</b></td></tr></tbody></table></td></tr>}</Fragment>)}</tbody></table></div>
        <div className="card-b muted" style={{ fontSize: 13 }}>Posted entries are never edited. A correction is a new reversing entry.</div></section>}
      {tab === 'accounts' && <section className="card"><div className="table-wrap"><table aria-label="Chart of accounts"><thead><tr><th scope="col">Code</th><th scope="col">Account</th><th scope="col">Type</th><th scope="col" style={{ textAlign: 'end' }}>Balance</th></tr></thead>

      {tab === 'statements' && <div className="grid g2">
        <section className="card"><div className="card-h"><h2>Revenue</h2><b className="num">{f.money(revenue)}</b></div><div className="card-b"><BarList rows={acc.accounts.filter((a) => a.type === 'Revenue').map((a) => ({ label: a.name, value: -a.balance }))} format={f.money} /></div></section>
        <section className="card"><div className="card-h"><h2>Costs</h2><b className="num">{f.money(expense)}</b></div><div className="card-b"><BarList rows={acc.accounts.filter((a) => a.type === 'Expense').map((a) => ({ label: a.name, value: a.balance, color: 'var(--warning)' }))} format={f.money} /></div></section>
      </div>}

      {confirmClose && <Modal title={`Close ${current.name}?`} description="Checks run before a month can close." onClose={() => setConfirmClose(false)} footer={<><button className="btn" onClick={() => setConfirmClose(false)}>Keep open</button><button className="btn primary" disabled onClick={() => {}}>Close period</button></>}>

      </Modal>}
    </>
  );
}

function HR() {

  const pay = (e) => { const sgk = e.gross * 0.15, tax = (e.gross - sgk) * 0.15, stamp = e.gross * 0.00759; return { sgk, tax, stamp, net: e.gross - sgk - tax - stamp }; };

      {tab === 'rota' && <section className="card"><div className="table-wrap"><table aria-label="Weekly rota"><thead><tr><th scope="col">Staff member</th>{days.map((d, i) => <th scope="col" key={d} style={i === 3 ? { color: 'var(--accent-dark)' } : null}>{d}{i === 3 ? ' (today)' : ''}</th>)}</tr></thead>
        <tbody>{state.staff.map((s) => <tr key={s.id}><td><span style={{ display: 'flex', gap: 8, alignItems: 'center' }}><Avatar name={s.name} size={28} color={s.color} /><span>{s.name}<span className="sub">{ROLE_NAMES[s.role]}</span></span></span></td>{(hr.shifts[s.id] || days.map(() => 'Off')).map((sh, i) => <td key={i} style={i === 3 ? { background: 'var(--accent-soft)' } : null}><button className={`badge ${SHIFT[sh][0]}`} style={{ border: 0, cursor: 'pointer' }} title={SHIFT[sh][1]} onClick={() => mutate((st) => { const order = ['Morning', 'Evening', 'Day', 'Off']; const cur = st.hr.shifts[s.id] || (st.hr.shifts[s.id] = days.map(() => 'Off')); cur[i] = order[(order.indexOf(cur[i]) + 1) % order.length]; })}>{sh}</button></td>)}</tr>)}</tbody></table></div>
        <div className="card-b muted" style={{ fontSize: 13 }}>Click a shift to change it. Front desk needs at least one person on every morning and evening.</div></section>}
      {tab === 'leave' && <section className="card"><div className="table-wrap"><table aria-label="Leave requests"><thead><tr><th scope="col">Staff member</th><th scope="col">Type</th><th scope="col">Dates</th><th scope="col">Status</th><th scope="col"><span className="sr-only">Actions</span></th></tr></thead>
        <tbody>{hr.leave.map((l) => { const s = staff(l.staffId); const clash = l.status === 'pending' && hr.leave.some((o) => o.id !== l.id && o.status === 'approved' && staff(o.staffId).role === s.role && o.from <= l.to && l.from <= o.to); return <tr key={l.id}><td><span style={{ display: 'flex', gap: 8, alignItems: 'center' }}><Avatar name={s.name} size={28} color={s.color} />{s.name}</span></td><td>{l.type}</td><td className="num">{f.date(l.from)} – {f.date(l.to)}<span className="sub">{diffDays(l.from, l.to) + 1} days</span></td><td><Badge tone={l.status === 'pending' ? 'b-warn' : l.status === 'approved' ? 'b-ok' : 'b-bad'}>{l.status[0].toUpperCase() + l.status.slice(1)}</Badge>{clash && <span className="sub" style={{ color: 'var(--danger)' }}>Clashes with another {ROLE_NAMES[s.role].toLowerCase()}</span>}</td>
          <td style={{ textAlign: 'end', whiteSpace: 'nowrap' }}>{l.status === 'pending' && <><button className="btn sm primary" onClick={() => { mutate((st) => { st.hr.leave.find((x) => x.id === l.id).status = 'approved'; }); log('Approved leave', `${s.name}, ${f.date(l.from)} – ${f.date(l.to)}`); toast(`Leave approved for ${s.name}`); }}>Approve</button> <button className="btn sm" onClick={() => { mutate((st) => { st.hr.leave.find((x) => x.id === l.id).status = 'rejected'; }); toast(`Leave declined for ${s.name}`); }}>Decline</button></>}</td></tr>; })}</tbody></table></div></section>}

          <tbody>{hr.employees.map((e) => { const s = staff(e.staffId); const p = pay(e); return <tr key={e.staffId}><td><span style={{ display: 'flex', gap: 8, alignItems: 'center' }}><Avatar name={s.name} size={28} color={s.color} />{s.name}</span></td><td className="num" style={{ textAlign: 'end' }}>{f.money(e.gross)}</td><td className="num" style={{ textAlign: 'end' }}>{f.money(p.sgk)}</td><td className="num" style={{ textAlign: 'end' }}>{f.money(p.tax)}</td><td className="num" style={{ textAlign: 'end', fontWeight: 600 }}>{f.money(p.net)}</td><td style={{ textAlign: 'end' }}><button className="btn sm" onClick={() => setSlip(e)}>Payslip</button></td></tr>; })}</tbody></table></div>
        <div className="card-b muted" style={{ fontSize: 13 }}>Deduction rates here are simplified for the mockup.</div>
      </section>}
      {slip && (() => { const s = staff(slip.staffId); const p = pay(slip); return <Drawer title={`Payslip, ${hr.payroll.period}`} subtitle={s.name} onClose={() => setSlip(null)} footer={<button className="btn" onClick={() => toast('Payslip PDF would download here')}>Download PDF</button>}><div style={{ display: 'flex', gap: 12, alignItems: 'center' }}><Avatar name={s.name} size={52} color={s.color} /><div><b>{s.name}</b><div className="muted">{slip.position}, {slip.department}</div></div></div><dl className="dl"><dt>Gross pay</dt><dd className="num">{f.money(slip.gross)}</dd><dt>Social security</dt><dd className="num">−{f.money(p.sgk)}</dd><dt>Income tax</dt><dd className="num">−{f.money(p.tax)}</dd><dt>Stamp duty</dt><dd className="num">−{f.money(p.stamp)}</dd><dt><b>Net pay</b></dt><dd className="num"><b>{f.money(p.net)}</b></dd><dt>Paid to</dt><dd className="num">TR•• •••• •••• 4417</dd></dl></Drawer>; })()}
    </>
  );
}

function Integrations() {
  const { state, mutate, toast, log } = useApp();
  const TONE = { connected: ['b-ok', 'Connected'], error: ['b-bad', 'Needs attention'], not_connected: ['b-neutral', 'Not connected'] };
  return (
    <>
      <PageHead title="Integrations" sub="Payments, booking channels, government reporting, invoices and messaging." />
      <div className="grid g3" style={{ marginBottom: 16 }}>{state.integrations.map((i) => <section className="card" key={i.id}><div className="card-b" style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8 }}><b style={{ fontSize: 16 }}>{i.name}</b><Badge tone={TONE[i.status][0]}>{TONE[i.status][1]}</Badge></div>
        <span className="muted">{i.category}{i.status !== 'not_connected' ? `, last sync ${i.last}` : ''}</span>
        {i.detail && <div className="notice bad" style={{ fontSize: 13 }}><Icon name="alert" size={16} />{i.detail}</div>}
        <div>{i.status === 'not_connected' ? <button className="btn sm primary" onClick={() => { mutate((s) => { const x = s.integrations.find((y) => y.id === i.id); x.status = 'connected'; x.last = 'now'; }); log('Connected integration', i.name); toast(`${i.name} connected`); }}>Connect</button> : <button className="btn sm" onClick={() => toast(`${i.name} settings open here`)}>Settings</button>}</div>
      </div></section>)}</div>
      <section className="card"><div className="card-h"><h2>Failed operations</h2><span className="muted">{state.failedOps.length}</span></div>
        {state.failedOps.length ? <div className="table-wrap"><table aria-label="Failed operations"><thead><tr><th scope="col">Integration</th><th scope="col">What was attempted</th><th scope="col">Error</th><th scope="col" style={{ textAlign: 'end' }}>Attempts</th><th scope="col"><span className="sr-only">Actions</span></th></tr></thead>
          <tbody>{state.failedOps.map((o) => <tr key={o.id}><td><b>{o.integration}</b><span className="sub">{o.time}</span></td><td>{o.op}</td><td style={{ color: 'var(--danger)' }}>{o.error}</td><td className="num" style={{ textAlign: 'end' }}>{o.attempts}</td><td style={{ textAlign: 'end' }}><button className="btn sm" onClick={() => { mutate((s) => { s.failedOps = s.failedOps.filter((x) => x.id !== o.id); const ig = s.integrations.find((x) => x.name === o.integration); if (ig && !s.failedOps.some((x) => x.integration === o.integration)) { ig.status = 'connected'; ig.detail = null; } }); log('Retried integration operation', o.op); toast('Retried successfully'); }}>Retry</button></td></tr>)}</tbody></table></div>
          : <Empty icon="check" title="Nothing has failed" body="Retries happen automatically. Anything that still fails appears here." />}
      </section>
    </>
  );
}
/* ============================================================
   All Properties (owner's portfolio view)
   ============================================================ */
function Portfolio() {
  const { state, setPropertyId, go } = useApp(); const f = useFormat();
  const rows = state.properties.map((p) => {
    const rooms = state.rooms.filter((r) => r.propertyId === p.id); const sums = rooms.map((r) => roomSummary(state, r));
    const beds = sums.reduce((a, s) => a + s.total - s.blocked, 0), taken = sums.reduce((a, s) => a + s.taken, 0);
    const stays = state.stays.filter((s) => s.propertyId === p.id);
    const owed = state.folios.filter((fo) => stays.some((s) => s.id === fo.stayId)).reduce((a, fo) => a + Math.max(0, folioBalance(fo)), 0);
    const revenue = state.folios.filter((fo) => stays.some((s) => s.id === fo.stayId)).reduce((a, fo) => a + fo.lines.filter((l) => l.amount > 0).reduce((b, l) => b + l.amount, 0), 0);
    return { p, beds, taken, occ: taken / Math.max(1, beds), arrivals: stays.filter((s) => s.status === 'confirmed' && s.start <= TODAY).length, departures: stays.filter((s) => s.status === 'in_house' && s.end && s.end <= TODAY).length, issues: state.tickets.filter((t) => t.propertyId === p.id && t.status !== 'done').length, owed, revenue, spark: Array.from({ length: 12 }, (_, i) => ({ label: String(i), value: Math.round(60 + 25 * Math.sin((i + p.id.length * 3) / 2.2) + (taken / Math.max(1, beds)) * 10) })) };
  });
  const tot = rows.reduce((a, r) => ({ beds: a.beds + r.beds, taken: a.taken + r.taken, owed: a.owed + r.owed, revenue: a.revenue + r.revenue }), { beds: 0, taken: 0, owed: 0, revenue: 0 });
  return (
    <>

            <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap' }}>{roommates.map(({ b, st }) => { const w = st.stay && state.people.find((x) => x.id === st.stay.personId); return <span key={b.id} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, width: 64 }}>{b.id === me.bedId ? <Avatar name={person.name} size={40} /> : w ? <Avatar name={w.name} size={40} /> : <BedIcon kind="empty" label={b.label} />}<span style={{ fontSize: 11, fontWeight: b.id === me.bedId ? 700 : 400, textAlign: 'center' }} className={b.id === me.bedId ? '' : 'muted'}>{b.id === me.bedId ? 'You' : w ? w.name.split(' ')[0] : 'Free bed'}</span></span>; })}</div>

          </div></section>
          <section className="card"><div className="card-h"><h2>My balance</h2></div><div className="card-b" style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            <span className="num" style={{ fontSize: 30, fontWeight: 700, color: bal > 0 ? 'var(--danger)' : 'var(--success)' }}>{f.money(bal)}</span><span className="muted">{bal > 0 ? 'Due by 1 October' : 'You are all paid up.'}</span>

          </div></section>
          <section className="card"><div className="card-h"><h2>Today</h2></div><div className="card-b list">
            <div className="list-item"><Icon name="today" /><div><b>Dinner: {state.fnb.week[3].dinner}</b><div className="muted" style={{ fontSize: 13 }}>{ps.meals['Thu-dinner'] === false ? 'You said you will skip it' : '19:00, dining hall'}</div></div></div>
            <div className="list-item"><Icon name="lock" /><div><b>Wi-Fi: Galata-Residents</b><div className="muted num" style={{ fontSize: 13 }}>kediler-2026</div></div></div>
          </div></section>
        </div>
      </>}

      {tab === 'payments' && <section className="card"><div className="card-h"><h2>My folio</h2><b className="num">{f.money(bal)}</b></div><div className="table-wrap"><table><tbody>{folio.lines.map((l) => <tr key={l.id}><td className="num muted">{f.date(l.date)}</td><td>{l.desc}</td><td className="num" style={{ textAlign: 'end', color: l.amount < 0 ? 'var(--success)' : undefined }}>{f.money(l.amount)}</td></tr>)}</tbody></table></div><div className="card-b"><button className="btn primary" disabled={bal <= 0} onClick={() => setPaying(true)}>Pay {f.money(Math.max(0, bal))}</button></div></section>}

      {tab === 'requests' && <section className="card"><div className="card-h"><h2>My requests</h2><button className="btn sm primary" onClick={() => setReporting(true)}>Report a problem</button></div><div className="card-b list">{mine.length ? mine.map((x) => <div className="list-item" key={x.id}><div style={{ flex: 1 }}><b>{x.title}</b><div className="muted" style={{ fontSize: 13 }}>Reported {f.date(x.created)}</div></div><Badge tone={x.status === 'done' ? 'b-ok' : x.status === 'new' ? 'b-info' : 'b-warn'}>{{ new: 'Received', in_progress: 'Being fixed', waiting: 'Waiting for parts', done: 'Fixed' }[x.status]}</Badge></div>) : <Empty icon="wrench" title="No requests" body="If something in your room is broken, tell us here." />}</div></section>}

      {tab === 'meals' && <section className="card"><div className="card-h"><h2>Meals this week</h2><span className="muted">Change until 10:00 the day before</span></div><div className="table-wrap"><table aria-label="Meal choices"><thead><tr><th scope="col">Day</th><th scope="col">Lunch</th><th scope="col">Dinner</th></tr></thead><tbody>{state.fnb.week.map((d, i) => <tr key={d.day}><td><b>{d.day}</b>{i === 3 && <span className="sub">today</span>}</td>{['lunch', 'dinner'].map((meal) => { const key = `${d.day}-${meal}`; const eating = ps.meals[key] !== false; const locked = i <= 3; return <td key={meal}><label className="switch"><input type="checkbox" checked={eating} disabled={locked} onChange={() => setPs((p) => { p.meals[key] = !eating; })} /><span>{d[meal]}<span className="muted" style={{ display: 'block', fontSize: 12 }}>{locked ? 'Choices closed' : eating ? 'I will eat' : 'I will skip'}</span></span></label></td>; })}</tr>)}</tbody></table></div></section>}

      {tab === 'away' && <div className="split">
        <section className="card"><div className="card-h"><h2>Tell us you'll be away</h2></div><div className="card-b form-grid">
          <div className="field"><label htmlFor="af1">From</label><input id="af1" type="date" className="input" value={away.from} min={TODAY} onChange={(e) => setAway({ ...away, from: e.target.value })} /></div>
          <div className="field"><label htmlFor="af2">Back on</label><input id="af2" type="date" className="input" value={away.to} min={away.from} onChange={(e) => setAway({ ...away, to: e.target.value })} /></div>
          <div className="field full"><label htmlFor="af3">Where are you going? <span className="muted" style={{ fontWeight: 400 }}>(optional)</span></label><input id="af3" className="input" value={away.where} onChange={(e) => setAway({ ...away, where: e.target.value })} placeholder="Visiting family in İzmir" /></div>
          <div className="full notice"><Icon name="today" />Your meals for those days are cancelled automatically, and staff know not to worry if they don't see you.</div>
          <button className="btn primary" disabled={!(away.to > away.from)} onClick={() => { setPs((p) => { p.away.push({ ...away }); }); toast('Away days saved'); }}>Save</button>
        </div></section>
        <section className="card" style={{ alignSelf: 'start' }}><div className="card-h"><h2>Planned</h2></div><div className="card-b list">{ps.away.length ? ps.away.map((a, i) => <div className="list-item" key={i}><Icon name="reservations" /><div><b>{f.date(a.from)} – {f.date(a.to)}</b><div className="muted" style={{ fontSize: 13 }}>{a.where || 'No destination given'}</div></div></div>) : <p className="muted" style={{ margin: 0 }}>Nothing planned.</p>}</div></section>
      </div>}

      {tab === 'news' && <section className="card"><div className="card-b list">{state.announcements.map((a) => { const acked = ps.acked.includes(a.id); return <div className="list-item" key={a.id}><span className="dot-icon" style={{ background: 'var(--info-soft)', color: 'var(--info)' }}><Icon name="megaphone" size={16} /></span><div style={{ flex: 1 }}><b>{a.title}</b><div className="muted" style={{ fontSize: 13 }}>{a.body}</div><div className="muted" style={{ fontSize: 12, marginTop: 2 }}>{f.date(a.date)}</div></div>{a.requiresAck && (acked ? <Badge tone="b-ok">You confirmed</Badge> : <button className="btn sm primary" onClick={() => { setPs((p, s) => { p.acked.push(a.id); s.announcements.find((x) => x.id === a.id).acked += 1; }); toast('Thanks for confirming'); }}>I have read this</button>)}</div>; })}</div></section>}

      {tab === 'registration' && <section className="card"><div className="card-h"><h2>My details</h2>{ps.registration === 'complete' ? <Badge tone="b-ok">Complete</Badge> : <Badge tone="b-warn">Not finished</Badge>}</div><div className="card-b form-grid">
        <div className="field"><label>Full name</label><input className="input" value={person.name} disabled /><span className="hint">As on your ID. Ask reception to change it.</span></div>
        <div className="field"><label htmlFor="rp">Phone</label><input id="rp" className="input" value={reg.phone} onChange={(e) => setReg({ ...reg, phone: e.target.value })} /></div>
        <div className="field"><label htmlFor="ren">Emergency contact name</label><input id="ren" className="input" value={reg.ename} onChange={(e) => setReg({ ...reg, ename: e.target.value })} /></div>
        <div className="field"><label htmlFor="rep2">Emergency contact phone</label><input id="rep2" className="input" value={reg.ephone} onChange={(e) => setReg({ ...reg, ephone: e.target.value })} /></div>
        <div className="field full"><span style={{ fontWeight: 600, fontSize: 13 }}>ID card or passport</span><div style={{ display: 'flex', gap: 10, alignItems: 'center' }}><button className="btn sm" onClick={() => toast('Photo upload opens here')}>Upload a photo</button>{(person.documents || [])[0]?.status === 'verified' ? <Badge tone="b-ok">Checked by reception</Badge> : <Badge tone="b-warn">Missing</Badge>}</div></div>
        <div className="full" style={{ borderTop: '1px solid var(--line-soft)', paddingTop: 12 }}><b>My documents</b><div className="muted" style={{ fontSize: 13, marginBottom: 8 }}>Upload what's missing. Reception checks each one.</div>
          {paperworkOf(state, person).filter((d) => !d.generated && d.key !== 'kbs').map((d) => <div key={d.key} className="bed-row" style={{ marginBottom: 6 }}><Icon name="card" /><div className="who"><b>{d.name}</b>{d.reason && <span style={{ fontSize: 13, color: 'var(--danger)' }}>{d.reason}</span>}{d.expiry && <span className="muted" style={{ fontSize: 13 }}>valid until {f.date(d.expiry)}</span>}</div><Badge tone={PAPER_STATUS[d.shown][0]}>{PAPER_STATUS[d.shown][1]}</Badge>{['missing', 'rejected', 'expired', 'expiring'].includes(d.shown) && <button className="btn sm primary" onClick={() => { mutate((s) => { const x = s.people.find((y) => y.id === person.id); x.papers[d.key] = { status: 'uploaded', at: TODAY, by: 'Resident app' }; }); toast(`${d.name} uploaded. Reception will check it.`); }}>Upload</button>}</div>)}
        </div>
        <label className="switch full"><input type="checkbox" checked={reg.rules} onChange={(e) => setReg({ ...reg, rules: e.target.checked })} />I have read and accept the house rules</label>
        <button className="btn primary" disabled={!reg.ename.trim() || !reg.ephone.trim() || !reg.rules} onClick={() => { mutate((s) => { s.portalState.registration = 'complete'; const x = s.people.find((y) => y.id === person.id); x.phone = reg.phone; x.emergency = { ...x.emergency, name: reg.ename, phone: reg.ephone }; }); toast('Your details are saved'); }}>Save my details</button>
      </div></section>}

      {tab === 'feedback' && <section className="card"><div className="card-h"><h2>How is your stay?</h2></div><div className="card-b" style={{ display: 'flex', flexDirection: 'column', gap: 12, maxWidth: 520 }}>
        {ps.feedbackSent ? <Empty icon="check" title="Thank you" body="The team reads every message. If something needs fixing, you'll hear from us." /> : <>
          <div role="radiogroup" aria-label="Rating" style={{ display: 'flex', gap: 6 }}>{[1, 2, 3, 4, 5].map((n) => <button key={n} role="radio" aria-checked={stars === n} aria-label={`${n} stars`} onClick={() => setStars(n)} style={{ fontSize: 34, background: 'none', border: 0, cursor: 'pointer', color: n <= stars ? 'var(--warning)' : 'var(--line)' }}>★</button>)}</div>
          <div className="field"><label htmlFor="fbc">Anything to tell us?</label><textarea id="fbc" className="input" rows="4" value={comment} onChange={(e) => setComment(e.target.value)} /></div>
          <button className="btn primary" style={{ alignSelf: 'flex-start' }} disabled={!stars} onClick={() => { mutate((s) => { s.portalState.feedbackSent = true; s.gx.feedback.unshift({ id: `fb${Date.now()}`, stayId: me.id, rating: stars, text: comment || '(no comment)', date: TODAY, reply: null, source: 'Portal' }); }); toast('Feedback sent'); }}>Send feedback</button>
        </>}
      </div></section>}

      {reporting && <TicketModal fromPortal={{ roomId: room.id }} onClose={() => setReporting(false)} />}
      {paying && <Modal title="Pay your balance" onClose={() => setPaying(false)} footer={<><button className="btn" onClick={() => setPaying(false)}>Cancel</button><button className="btn primary" onClick={() => { mutate((s) => { s.folios.find((x) => x.stayId === me.id).lines.push({ id: `pp${Date.now()}`, date: TODAY, desc: 'Payment, card in portal', amount: -bal, kind: 'payment' }); }); log('Portal payment', `${me.ref}, ${f.money(bal)}`); toast(`Paid ${f.money(bal)}. A receipt was emailed to you.`); setPaying(false); }}>Pay {f.money(bal)}</button></>}>
        <div className="form-grid"><div className="field full"><label htmlFor="cc">Card number</label><input id="cc" className="input num" defaultValue="4242 4242 4242 4242" /></div><div className="field"><label htmlFor="ce">Expiry</label><input id="ce" className="input num" defaultValue="12/28" /></div><div className="field"><label htmlFor="cv">Security code</label><input id="cv" className="input num" defaultValue="123" /></div><div className="full notice"><Icon name="lock" />In the real product the card form belongs to the payment provider. Ranza never sees card numbers.</div></div>
      </Modal>}
    </>
  );
}

function CpOrgs() {
  const { state, mutate, toast, log } = useApp(); const f = useFormat(); const [open, setOpen] = useState(null);
  const cp = state.cp; const TONE = { active: ['b-ok', 'Active'], trialing: ['b-info', 'Trial'], past_due: ['b-warn', 'Payment overdue'], suspended: ['b-bad', 'Suspended'] };
  const mrr = cp.orgs.reduce((a, o) => a + o.mrr, 0);
  const org = open && cp.orgs.find((o) => o.id === open);
  return (
    <>
      <PageHead title="Organizations" sub="Every customer running on Ranza."><button className="btn primary"><Icon name="plus" />New Organization</button></PageHead>
      <section className="grid g3" style={{ marginBottom: 16 }}>
        <div className="stat" style={{ cursor: 'default' }}><span className="label">Monthly recurring revenue</span><span className="value num">€{mrr.toLocaleString('en')}</span><span className="sub">{cp.orgs.filter((o) => o.status === 'active').length} active customers</span></div>
        <div className="stat" style={{ cursor: 'default' }}><span className="label">Beds under management</span><span className="value num">{cp.orgs.reduce((a, o) => a + o.beds, 0).toLocaleString('en')}</span><span className="sub">in {cp.orgs.reduce((a, o) => a + o.properties, 0)} Properties</span></div>
        <div className="stat alert" style={{ cursor: 'default' }}><span className="label">Need attention</span><span className="value num">{cp.orgs.filter((o) => o.status !== 'active').length}</span><span className="sub">trials ending, overdue, suspended</span></div>
      </section>
      <section className="card"><div className="table-wrap"><table aria-label="Organizations"><thead><tr><th scope="col">Organization</th><th scope="col">Plan</th><th scope="col" style={{ textAlign: 'end' }}>Properties</th><th scope="col" style={{ textAlign: 'end' }}>Beds</th><th scope="col" style={{ textAlign: 'end' }}>Monthly</th><th scope="col">Status</th></tr></thead>
        <tbody>{cp.orgs.map((o) => <tr key={o.id} className="row-click" onClick={() => setOpen(o.id)}><td><span style={{ display: 'flex', gap: 10, alignItems: 'center' }}><span className="brand-mark" style={{ width: 32, height: 32, fontSize: 14, background: `hsl(${hashOf(o.name) % 360} 40% 38%)` }}>{o.name[0]}</span><span><b>{o.name}</b><span className="sub">{o.country}, since {f.date(o.since, { month: 'short', year: 'numeric', timeZone: 'UTC' })}</span></span></span></td><td>{o.plan}</td><td className="num" style={{ textAlign: 'end' }}>{o.properties}</td><td className="num" style={{ textAlign: 'end' }}>{o.beds}</td><td className="num" style={{ textAlign: 'end' }}>€{o.mrr.toLocaleString('en')}</td><td><Badge tone={TONE[o.status][0]}>{TONE[o.status][1]}</Badge>{o.trialEnds && <span className="sub">trial ends {f.date(o.trialEnds)}</span>}</td></tr>)}</tbody></table></div></section>
      {org && <Drawer title={org.name} subtitle={`${org.plan}, ${org.country}`} onClose={() => setOpen(null)} footer={<>{org.status === 'suspended' ? <button className="btn primary" onClick={() => { mutate((s) => { s.cp.orgs.find((x) => x.id === org.id).status = 'active'; }); log('Reactivated Organization', org.name); toast(`${org.name} reactivated`); }}>Reactivate</button> : <button className="btn" style={{ color: 'var(--danger)' }} onClick={() => { mutate((s) => { s.cp.orgs.find((x) => x.id === org.id).status = 'suspended'; }); log('Suspended Organization', org.name, 'Payment overdue beyond grace period'); toast(`${org.name} suspended. Exit actions like check-out and export still work.`); }}>Suspend</button>}</>}>
        <dl className="dl"><dt>Status</dt><dd><Badge tone={TONE[org.status][0]}>{TONE[org.status][1]}</Badge></dd><dt>Properties</dt><dd>{org.properties}</dd><dt>Beds</dt><dd>{org.beds}</dd><dt>Monthly</dt><dd className="num">€{org.mrr.toLocaleString('en')}</dd></dl>
        <h3 style={{ margin: 0, fontSize: 15 }}>Modules in this plan</h3>
        <div className="pills">{(cp.plans.find((p) => p.name === org.plan)?.modules || []).map((m) => <span key={m} className="badge b-ok">{m}</span>)}</div>
        {org.status === 'past_due' && <div className="notice warn"><Icon name="alert" />Payment is overdue. New reservations will be blocked after the grace period, but check-out, payments and export keep working.</div>}
        {org.trialEnds && <button className="btn" onClick={() => { mutate((s) => { const x = s.cp.orgs.find((y) => y.id === org.id); x.trialEnds = addDays(x.trialEnds, 14); }); log('Extended trial', org.name); toast('Trial extended by 14 days'); }}>Extend trial by 14 days</button>}
      </Drawer>}
    </>
  );
}
function CpPlans() {
  const { state } = useApp();
  return <><PageHead title="Plans & entitlements" sub="What each plan includes. Entitlements are checked by the server and the database." /><div className="grid g2">{state.cp.plans.map((p) => <section className="card" key={p.id}><div className="card-h"><h2>{p.name}</h2><b className="num">{p.price ? `€${p.price}` : 'Custom'} <span className="muted" style={{ fontWeight: 400, fontSize: 13 }}>{p.unit}</span></b></div><div className="card-b"><div className="pills">{p.modules.map((m) => <span key={m} className="badge b-ok"><Icon name="check" size={12} />{m}</span>)}</div><div className="muted" style={{ marginTop: 10, fontSize: 13 }}>{state.cp.orgs.filter((o) => o.plan === p.name).length} Organizations on this plan</div></div></section>)}</div></>;
}

}
function CpHealth() {

function CpSupport() {

      </Modal>}
    </>
  );
}

/* ============================================================

const FACULTIES = ['Engineering', 'Economics and Administrative Sciences', 'Arts and Sciences', 'Law', 'Architecture', 'Medicine', 'Education'];
const PROGRAMMES = ['Computer Engineering', 'Economics', 'Molecular Biology', 'International Relations', 'Architecture', 'Medicine', 'Psychology', 'Industrial Engineering'];

function seedProfiles(st) {
  const r = rng(4242);
  const any = (a) => a[Math.floor(r() * a.length)];
  const digits = (n) => Array.from({ length: n }, () => Math.floor(r() * 10)).join('');
  const residentsInP1 = st.stays.filter((s) => s.propertyId === 'p1' && s.status === 'in_house' && s.kind === 'resident').map((s) => s.personId);
  st.people.forEach((p, i) => {
    const local = p.country === 'Türkiye' || p.country === '—';
    const age = p.kind === 'resident' ? 19 + Math.floor(r() * 6) : 22 + Math.floor(r() * 30);
    p.dob = `${2026 - age}-${String(1 + Math.floor(r() * 12)).padStart(2, '0')}-${String(1 + Math.floor(r() * 27)).padStart(2, '0')}`;
    p.sex = hashOf(p.name) % 2 === 0 ? 'Female' : 'Male';
    p.nationality = p.country === '—' ? 'Türkiye' : p.country;
    p.language = local ? 'Turkish' : any(['English', 'Arabic', 'German', 'English']);
    p.address = local ? `${any(['Atatürk Cd.', 'Cumhuriyet Mh.', 'İnönü Sk.'])} No:${Math.floor(1 + r() * 90)}, ${any(['Ankara', 'İzmir', 'Bursa', 'Trabzon', 'Antalya'])}` : `${Math.floor(1 + r() * 200)} ${any(['Main Street', 'Park Road', 'Station Avenue'])}, ${p.country}`;
    p.identity = local
      ? { type: 'Turkish ID card (T.C. Kimlik)', number: `${digits(2)}${digits(9)}`, expiry: `20${30 + Math.floor(r() * 5)}-0${1 + Math.floor(r() * 8)}-15` }
      : { type: 'Passport', number: `${String.fromCharCode(65 + Math.floor(r() * 26))}${String.fromCharCode(65 + Math.floor(r() * 26))}${digits(7)}`, expiry: `20${28 + Math.floor(r() * 6)}-0${1 + Math.floor(r() * 8)}-20`, issuedBy: p.country };
    if (p.kind === 'resident') {
      const uni = p.university || any(['Boğaziçi University', 'İTÜ', 'Galatasaray University', 'Marmara University']);
      p.university = uni;
      p.study = { university: uni, faculty: any(FACULTIES), programme: any(PROGRAMMES), studentNo: `${2021 + Math.floor(r() * 5)}${digits(6)}`, year: 1 + Math.floor(r() * 4), level: r() < 0.85 ? 'Bachelor' : 'Master', expectedEnd: `20${27 + Math.floor(r() * 3)}-06-30`, exchange: !local && r() < 0.4 ? 'Erasmus+' : null };
      p.guardian = { name: `${any(FIRST)} ${p.name.split(' ')[1]}`, relation: any(['Mother', 'Father', 'Guardian']), phone: `+90 5${digits(2)} ${digits(3)} ${digits(4)}`, email: `family.${p.name.split(' ')[1].toLowerCase().replace(/[^a-z]/g, '')}@mail.test` };
      p.insurance = local ? { provider: 'SGK (state insurance)', policy: digits(11), expiry: null } : { provider: any(['Allianz Care', 'AXA Student', 'Anadolu Sigorta Student']), policy: `HI-${digits(8)}`, expiry: `2027-0${1 + Math.floor(r() * 8)}-01` };
      if (!local) p.permit = { type: 'Student residence permit (ikamet)', number: `99${digits(9)}`, expiry: `2027-0${1 + Math.floor(r() * 8)}-10`, status: 'granted' };
      const stay = st.stays.find((s) => s.personId === p.id && (s.status === 'in_house' || s.status === 'confirmed'));
      const anyStay = st.stays.find((s) => s.personId === p.id);
      p.contract = { ...(p.contract || {}), number: `SZL-2026-${String(300 + i).padStart(4, '0')}`, start: stay ? stay.start : '2026-09-01', end: stay?.end || '2027-06-30', rent: 9000, deposit: 18000, paymentDay: 1, term: '2026–2027 academic year', status: 'signed', signedOn: addDays(TODAY, -30) };
      p.depositInfo = { amount: 18000, received: addDays((stay || anyStay || { start: TODAY }).start, -10), method: any(['Bank transfer', 'Card']), status: stay ? 'held' : anyStay?.status === 'departed' ? 'returned' : 'held', deductions: [] };
    }
    p.notes = [];
    p.papers = {};
    if (st.stays.some((s) => s.personId === p.id && s.status !== 'confirmed' && s.status !== 'quote')) p.kbs = 'sent';
  });

  // Paperwork state: mostly complete, with realistic gaps for the demo
  st.people.forEach((p, i) => {
    const set = (k, v) => { p.papers[k] = v; };
    const ok = (k, extra) => set(k, { status: 'verified', at: addDays(TODAY, -Math.floor(5 + r() * 40)), by: any(['Mert Polat', 'Aylin Demir', 'Deniz Arslan']), ...extra });
    ok('id', { expiry: p.identity.expiry });
    if (p.kind !== 'resident') return;
    ok('photo'); ok('studentcert', { expiry: '2027-06-30' }); ok('emergency'); ok('rules');
    set('contract', p.contract.status === 'signed' ? { status: 'signed', at: p.contract.signedOn, by: 'e-signature' } : { status: 'sent', at: addDays(TODAY, -2), by: 'Mert Polat' });
    set('deposit', p.depositInfo.status !== 'not received' ? { status: 'verified', at: p.depositInfo.received, by: 'Sibel Koç' } : { status: 'missing' });
    if (st.stays.some((s) => s.personId === p.id && s.status === 'departed') && !st.stays.some((s) => s.personId === p.id && (s.status === 'in_house' || s.status === 'confirmed'))) { set('inspection_out', { status: 'signed', at: addDays(TODAY, -2), by: 'Gülşen Aksoy' }); set('deposit_return', { status: 'signed', at: addDays(TODAY, -1), by: 'Sibel Koç' }); }
    set('inspection_in', st.stays.some((s) => s.personId === p.id && (s.status === 'in_house' || s.status === 'departed')) ? { status: 'signed', at: addDays(TODAY, -Math.floor(3 + r() * 20)), by: 'Gülşen Aksoy' } : { status: 'not_due' });
    if (p.permit) ok('permit', { expiry: p.permit.expiry });
    if (p.insurance && p.insurance.expiry) ok('insurance', { expiry: p.insurance.expiry }); else set('insurance', { status: 'verified', at: addDays(TODAY, -20), by: 'Aylin Demir' });
    if (p.study.exchange) ok('acceptance');
  });

  // Make the demo resident cases visible at Galata
  const pick = (n) => st.people.find((p) => p.id === residentsInP1[n]);
  const a = pick(1), b = pick(2), c = pick(3), d = pick(4), e = pick(5), g = pick(6);
  if (a) { a.papers.studentcert = { status: 'missing' }; a.papers.rules = { status: 'missing' }; }
  if (b) { b.country = 'Egypt'; b.nationality = 'Egypt'; b.identity = { type: 'Passport', number: 'A28841197', expiry: addDays(TODAY, 41), issuedBy: 'Egypt' }; b.permit = { type: 'Student residence permit (ikamet)', number: '99417730215', expiry: addDays(TODAY, -6), status: 'renewal applied' }; b.insurance = { provider: 'Allianz Care', policy: 'HI-55120934', expiry: '2027-03-01' }; b.papers.id = { status: 'verified', at: addDays(TODAY, -30), by: 'Aylin Demir', expiry: b.identity.expiry }; b.papers.permit = { status: 'verified', at: addDays(TODAY, -300), by: 'Aylin Demir', expiry: b.permit.expiry }; b.papers.insurance = { status: 'verified', at: addDays(TODAY, -30), by: 'Aylin Demir', expiry: b.insurance.expiry }; }
  if (c) { c.dob = '2009-02-11'; c.papers.guardian = { status: 'uploaded', at: addDays(TODAY, -1), by: 'Resident app' }; }
  if (d) { d.papers.insurance = { status: 'rejected', at: addDays(TODAY, -3), by: 'Aylin Demir', reason: 'The policy does not cover Türkiye. Please upload one that does.' }; d.country = d.country === 'Türkiye' ? 'Germany' : d.country; d.nationality = d.country; d.insurance = { provider: 'AXA Student', policy: 'HI-10239484', expiry: '2027-02-01' }; d.identity = { type: 'Passport', number: 'C7F9912LK', expiry: '2031-05-20', issuedBy: d.country }; if (!d.permit) d.permit = { type: 'Student residence permit (ikamet)', number: '—', expiry: null, status: 'appointment booked' }; d.papers.permit = { status: 'missing', note: 'Appointment at the migration office on 2 Oct' }; }
  if (e) { e.contract.status = 'awaiting signature'; e.papers.contract = { status: 'sent', at: addDays(TODAY, -4), by: 'Mert Polat' }; e.papers.deposit = { status: 'missing' }; e.depositInfo.status = 'not received'; e.depositInfo.received = null; }
  if (g) { g.notes.push({ at: `${addDays(TODAY, -12)} 10:40`, by: 'Deniz Arslan', text: 'Asked for a quieter room when one frees up on floor 3.' }); g.depositInfo.deductions.push({ what: 'Lost key card', amount: 250 }); }
  // the resident-app demo person has one open item to finish
  const me = st.people.find((p) => p.id === residentsInP1[0]); if (me) me.papers.photo = { status: 'missing' };
  return st;
}

const ageOf = (dob) => { if (!dob) return null; const [y, m, d] = dob.split('-').map(Number); const [ty, tm, td] = TODAY.split('-').map(Number); return ty - y - ((tm < m || (tm === m && td < d)) ? 1 : 0); };

/* Which papers a person needs, and the state of each */
function paperworkOf(state, p) {
  const international = p.nationality && p.nationality !== 'Türkiye';
  const stay = state.stays.find((s) => s.personId === p.id && s.status === 'in_house') || state.stays.find((s) => s.personId === p.id && s.status === 'confirmed');
  const minor = ageOf(p.dob) < 18;
  const defs = [
    { key: 'id', group: 'Identity and legal', name: international ? 'Passport' : 'Turkish ID card', need: true, detail: p.identity ? `${p.identity.type}` : '' },
    { key: 'permit', group: 'Identity and legal', name: 'Residence permit (ikamet)', need: p.kind === 'resident' && international, detail: 'Needed for stays over 90 days' },
    { key: 'kbs', group: 'Identity and legal', name: 'KBS guest registration', need: true, detail: 'Reported to the police system at check-in', derived: p.kbs === 'sent' ? { status: 'verified', by: 'System' } : stay?.status === 'in_house' ? { status: 'missing' } : { status: 'not_due' } },
    { key: 'photo', group: 'Identity and legal', name: 'Passport-size photo', need: p.kind === 'resident', detail: 'For the resident card' },
    { key: 'guardian', group: 'Identity and legal', name: 'Guardian consent form', need: p.kind === 'resident' && minor, detail: 'Required because the resident is under 18' },
    { key: 'studentcert', group: 'Study', name: 'Student certificate (öğrenci belgesi)', need: p.kind === 'resident', detail: 'Valid for the current academic year' },
    { key: 'acceptance', group: 'Study', name: 'Exchange acceptance letter', need: p.kind === 'resident' && !!p.study?.exchange, detail: p.study?.exchange || '' },
    { key: 'insurance', group: 'Health and safety', name: 'Health insurance', need: p.kind === 'resident', detail: international ? 'Must cover Türkiye' : 'State insurance (SGK) accepted' },
    { key: 'emergency', group: 'Health and safety', name: 'Emergency contact form', need: p.kind === 'resident', detail: '' },
    { key: 'contract', group: 'Contract and money', name: 'Accommodation contract', need: p.kind === 'resident', detail: p.contract?.number || '', generated: true },
    { key: 'rules', group: 'Contract and money', name: 'House rules, signed', need: p.kind === 'resident', detail: '', generated: true },
    { key: 'deposit', group: 'Contract and money', name: 'Deposit receipt', need: p.kind === 'resident', detail: p.depositInfo ? `₺${p.depositInfo.amount.toLocaleString('tr-TR')}` : '', generated: true },
    { key: 'inspection_in', group: 'Move-in and move-out', name: 'Move-in room inspection', need: p.kind === 'resident', detail: 'Condition of room and furniture', generated: true },
    { key: 'inspection_out', group: 'Move-in and move-out', name: 'Move-out room inspection', need: p.kind === 'resident', detail: 'Done on the last day', generated: true, later: true },
    { key: 'deposit_return', group: 'Move-in and move-out', name: 'Deposit return form', need: p.kind === 'resident', detail: 'After the move-out inspection', generated: true, later: true },
  ];
  return defs.filter((d) => d.need).map((d) => {
    let s = d.derived || p.papers?.[d.key] || { status: d.later ? 'not_due' : 'missing' };
    if (d.later && !p.papers?.[d.key]) s = { status: 'not_due' };
    const expiry = s.expiry || null;
    let shown = s.status;
    if ((s.status === 'verified' || s.status === 'signed') && expiry) { const left = diffDays(TODAY, expiry); if (left < 0) shown = 'expired'; else if (left <= 60) shown = 'expiring'; }
    return { ...d, ...s, expiry, shown, stayStatus: stay?.status };

}

/* ============================================================
   Deep links
   The hash is the address of a screen, so a link pasted into a task opens that
   screen instead of the front door. The role is part of the address because a
   screen is only reachable to a role that has it — `#owner/staff` is the long
   form and `#staff` is the same thing, because owner is the role that sees all
   twenty-eight.
   ============================================================ */
function hashRoute() {
  const parts = decodeURIComponent(String(location.hash).replace(/^#/, ''))
    .split('/')
    .filter(Boolean);
  if (!parts.length) return null;
  const named = ROLES.some((r) => r.id === parts[0]);
  const role = named ? parts[0] : 'owner';
  const screen = named ? parts[1] : parts[0];
  if (!screen || !(ACCESS[role] || []).includes(screen)) return null;
  return { role, screen };
}

function App() {
  const [state, setState] = useState(() => seedProfiles(extendSeed(buildSeed())));
  const [lang, setLang] = useState('en');
  const [theme, setTheme] = useState('light');
  const [role, setRole] = useState(() => (hashRoute() || {}).role || null);
  const [propertyId, setPropertyId] = useState('p1');
  const [route, setRoute] = useState(() => ({ screen: (hashRoute() || {}).screen || 'today', params: null }));
  const [toasts, setToasts] = useState([]);

  useEffect(() => {
    const apply = () => {
      const next = hashRoute();
      if (!next) return;
      setRole(next.role);
      setRoute({ screen: next.screen, params: null });
    };
    window.addEventListener('hashchange', apply);
    return () => window.removeEventListener('hashchange', apply);
  }, []);
  useEffect(() => {
    if (!role || role === 'public') return;
    const next = `#${role}/${route.screen}`;
    if (location.hash !== next) history.replaceState(null, '', next);
  }, [role, route.screen]);

  useEffect(() => { document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; }, [lang]);
  useEffect(() => { document.documentElement.dataset.theme = theme; }, [theme]);
  useEffect(() => {
    const root = document.documentElement.style;
    if (theme === 'dark' || state.branding.accent === '#087466') { root.removeProperty('--accent'); root.removeProperty('--accent-dark'); root.removeProperty('--accent-soft'); }
    else { root.setProperty('--accent', state.branding.accent); root.setProperty('--accent-dark', state.branding.accent); root.setProperty('--accent-soft', `color-mix(in srgb, ${state.branding.accent} 16%, white)`); }
  }, [state.branding.accent, theme]);

  const mutate = useCallback((fn) => setState((s) => { const n = structuredClone(s); fn(n); return n; }), []);
  const toast = useCallback((msg) => { const id = Math.random(); setToasts((t) => [...t, { id, msg }]); setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3400); }, []);
  const go = useCallback((screen, params = null) => { setRoute({ screen, params: params ? { ...params, _t: Date.now() } : null }); window.scrollTo(0, 0); }, []);
  const can = useCallback((perm) => (CAN[perm] || []).includes(role), [role]);
  const log = useCallback((action, subject, reason = null) => {
    const who = (ROLES.find((r) => r.id === role) || {}).name || 'Staff';
    setState((s) => { const n = structuredClone(s); n.audit.unshift({ id: `au${Date.now()}${Math.random()}`, at: `${TODAY} 14:${String(30 + (n.audit.length % 29)).padStart(2, '0')}`, who, action, subject, reason }); return n; });
  }, [role]);

  const ctx = { state, mutate, lang, setLang, theme, setTheme, role, propertyId, setPropertyId, go, toast, can, log };
  const login = (r) => { setRole(r); setPropertyId('p1'); setRoute({ screen: ACCESS[r] ? ACCESS[r].filter((x) => x !== 'profile')[0] : 'today', params: null }); if (r !== 'public') toast(r === 'resident' ? 'Welcome home' : `Signed in as ${ROLES.find((x) => x.id === r).title}`); };

  if (!role) return <AppCtx.Provider value={ctx}><Login onLogin={login} /><Toasts toasts={toasts} /></AppCtx.Provider>;
  if (role === 'public') return <AppCtx.Provider value={ctx}><Storefront onSignIn={() => setRole(null)} /><Toasts toasts={toasts} /></AppCtx.Provider>;

  const allowed = ACCESS[role];
  const home = allowed.filter((x) => x !== 'profile')[0];
  const screen = allowed.includes(route.screen) ? route.screen : home;
  const blocked = MODULE_OF[screen] && state.disabledModules.includes(screen);
  const Screen = SCREENS[screen];

  return (
    <AppCtx.Provider value={ctx}>
      <a className="skip" href="#main">Skip to content</a>
      <div className="app">
        <Sidebar screen={screen} role={role} />
        <div style={{ minWidth: 0 }}>
          <TopBar role={role} onSignOut={() => setRole(null)} onSwitch={(r) => login(r)} />
          <main id="main" className="main" tabIndex={-1}>
            {blocked ? <NotInPlan screen={screen} /> : <Screen key={`${screen}-${propertyId}`} params={route.params} />}
          </main>
        </div>
      </div>
      <Toasts toasts={toasts} />
    </AppCtx.Provider>
  );
}

  return <div className="toasts" aria-live="polite">{toasts.map((x) => <div className="toast" key={x.id}><Icon name="check" size={16} />{x.msg}</div>)}</div>;
