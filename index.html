<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ranza — interactive system mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --canvas:#f3f6f4; --canvas-deep:#e6ece9; --ink:#132f38; --ink-muted:#52656b;
  --accent:#087466; --accent-dark:#05594f; --accent-soft:#d9eee9;
  --surface:#ffffff; --surface-2:#f8faf9; --surface-strong:#132f38;
  --success:#176842; --success-soft:#dcefe3; --warning:#8a5a08; --warning-soft:#f7e8c8;
  --danger:#a33a35; --danger-soft:#f5dfdd; --info:#315f83; --info-soft:#dfeaf2;
  --line:#c8d3d0; --line-soft:#e1e8e5; --line-strong:#9caca8; --focus:#126bad;
  --radius-sm:.45rem; --radius:.75rem; --radius-lg:1.15rem;
  --shadow:0 1.25rem 3.25rem rgb(19 47 56 / 12%); --shadow-low:0 .5rem 1.5rem rgb(19 47 56 / 8%);
  --bed-empty:#ffffff; --bed-taken:#087466; --bed-blocked:#9caca8;
  --font: Aptos, "Segoe UI Variable", "Noto Sans", "Noto Sans Arabic", system-ui, sans-serif;
}
[data-theme="dark"]{
  --canvas:#0e1d22; --canvas-deep:#132a31; --ink:#e7f0ee; --ink-muted:#a4b6b3;
  --accent:#3bb3a1; --accent-dark:#62c9b8; --accent-soft:#16403b;
  --surface:#15282e; --surface-2:#1a3037; --surface-strong:#e7f0ee;
  --success:#5ccb93; --success-soft:#173b2b; --warning:#e5b25a; --warning-soft:#3e3118;
  --danger:#ec8a84; --danger-soft:#44211f; --info:#8fbbe0; --info-soft:#1c3345;
  --line:#2c4850; --line-soft:#223b42; --line-strong:#4b6a70; --focus:#6fb4ea;
  --shadow:0 1.25rem 3.25rem rgb(0 0 0 / 45%); --shadow-low:0 .5rem 1.5rem rgb(0 0 0 / 30%);
  --bed-empty:#15282e; --bed-taken:#3bb3a1; --bed-blocked:#4b6a70;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--canvas);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
[dir="rtl"] body{font-family:"Noto Sans Arabic",var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:12px;top:-60px;background:var(--surface);padding:10px 14px;border-radius:var(--radius-sm);z-index:100}
.skip:focus{top:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-inline-end:1px solid var(--line-soft);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink-muted);font-size:12px}
.nav{padding:4px 10px 16px;display:flex;flex-direction:column;gap:2px}
.nav h6{margin:14px 10px 4px;font-size:12px;font-weight:600;color:var(--ink-muted)}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:var(--radius-sm);text-align:start;cursor:pointer;color:var(--ink);font-weight:500}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-dark);font-weight:600}
.nav button .count{margin-inline-start:auto;font-size:12px;background:var(--danger-soft);color:var(--danger);border-radius:999px;padding:0 7px;font-weight:600}
.side-foot{margin-top:auto;padding:12px 18px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--ink-muted)}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;padding:10px 24px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:0 12px;height:40px;flex:1;max-width:420px}
.search input{border:0;outline:0;background:transparent;width:100%}
.top .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.chip.date{background:var(--warning-soft);border-color:transparent;color:var(--warning);cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 10px;height:38px;cursor:pointer;font-weight:600;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.avatar{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;flex-shrink:0;overflow:hidden}.avatar svg{display:block}
.main{padding:24px 28px 60px;max-width:1500px;width:100%}

/* ---------- common ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1.2}
.page-head p{margin:4px 0 0;color:var(--ink-muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink-muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);box-shadow:var(--shadow-low)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.card-h h2{margin:0;font-size:16px}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:16px}
.stat{padding:14px 16px;text-align:start;border:1px solid var(--line-soft);background:var(--surface);border-radius:var(--radius);cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow-low)}
.stat:hover{border-color:var(--accent)}
.stat .label{color:var(--ink-muted);font-weight:500}
.stat .value{font-size:28px;font-weight:700;letter-spacing:-.02em}
.stat .sub{color:var(--ink-muted);font-size:13px}
.stat .go{margin-top:6px;font-size:13px;font-weight:600;color:var(--accent)}
.stat.alert .value{color:var(--danger)}

.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.b-ok{background:var(--success-soft);color:var(--success)}
.b-warn{background:var(--warning-soft);color:var(--warning)}
.b-bad{background:var(--danger-soft);color:var(--danger)}
.b-info{background:var(--info-soft);color:var(--info)}
.b-neutral{background:var(--canvas-deep);color:var(--ink-muted)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;font-weight:600;color:var(--ink-muted);text-align:start;padding:10px 14px;border-bottom:1px solid var(--line-soft);background:var(--surface-2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td .sub{display:block;font-size:12.5px;color:var(--ink-muted)}
.row-click{cursor:pointer}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-soft);padding:0 14px}
.tabs button{border:0;background:transparent;padding:12px 10px;cursor:pointer;font-weight:500;color:var(--ink-muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--accent-dark);border-bottom-color:var(--accent);font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px}
.pill[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dark);font-weight:600}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:13px}
.field .hint{font-size:12.5px;color:var(--ink-muted)}
.input,.select,textarea.input{height:40px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:0 12px;width:100%}
textarea.input{height:auto;padding:10px 12px;resize:vertical}
.input:focus,.select:focus{outline:3px solid color-mix(in srgb,var(--focus) 35%,transparent);border-color:var(--focus)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.stepper button{width:40px;height:40px;border:0;background:var(--surface-2);cursor:pointer;font-size:18px;font-weight:600}
.stepper button:disabled{opacity:.4;cursor:not-allowed}
.stepper output{min-width:54px;text-align:center;font-weight:700;font-size:16px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer}
.switch input{width:40px;height:22px;appearance:none;background:var(--line-strong);border-radius:999px;position:relative;cursor:pointer;flex-shrink:0}
.switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{inset-inline-start:21px}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgb(10 25 30 / 45%);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.modal.wide{width:min(760px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px 0}
.modal-h h2{margin:0;font-size:21px;letter-spacing:-.01em}
.modal-h p{margin:6px 0 0;color:var(--ink-muted)}
.modal-b{padding:18px 22px;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 20px;border-top:1px solid var(--line-soft)}
.drawer-scrim{position:fixed;inset:0;background:rgb(10 25 30 / 30%);z-index:50}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(460px,100%);background:var(--surface);z-index:55;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slide .18s ease-out}
[dir="rtl"] .drawer{animation-name:slide-rtl}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes slide-rtl{from{transform:translateX(-24px);opacity:.4}to{transform:none;opacity:1}}
.drawer-h{padding:18px 20px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer-h h2{margin:0;font-size:20px}
.drawer-b{padding:18px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.drawer-f{padding:14px 20px;border-top:1px solid var(--line-soft);display:flex;gap:10px;justify-content:flex-end}
.dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;margin:0}
.dl dt{color:var(--ink-muted)} .dl dd{margin:0;font-weight:500}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px;min-width:210px;z-index:30}
.menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;text-align:start}
.menu button:hover{background:var(--surface-2)}
.menu .danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line-soft);margin:4px}
.toasts{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
[dir="rtl"] .toasts{transform:translateX(50%)}
.toast{background:var(--surface-strong);color:var(--canvas);padding:10px 16px;border-radius:var(--radius);box-shadow:var(--shadow);font-weight:500;display:flex;gap:8px;align-items:center}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);background:var(--info-soft);color:var(--info)}
.notice.warn{background:var(--warning-soft);color:var(--warning)}
.notice.bad{background:var(--danger-soft);color:var(--danger)}
.empty{padding:40px 20px;text-align:center}
.empty h3{margin:10px 0 4px;font-size:17px}
.empty p{margin:0 0 14px;color:var(--ink-muted)}

/* ---------- rooms & beds (the memorable part) ---------- */
.floor{margin-bottom:22px}
.floor-h{display:flex;align-items:baseline;gap:12px;margin:0 0 10px}
.floor-h h2{margin:0;font-size:17px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.room{position:relative;text-align:start;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-low)}
.room:hover{border-color:var(--accent)}
.room.ooo{background:repeating-linear-gradient(135deg,var(--surface) 0 8px,var(--canvas-deep) 8px 16px)}
.room-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.room-no{font-size:18px;font-weight:700;letter-spacing:-.01em}
.room-type{font-size:12px;color:var(--ink-muted)}
.beds{display:flex;flex-wrap:wrap;gap:6px}
.bed{width:30px;height:38px;border-radius:7px 7px 4px 4px;border:2px solid var(--bed-taken);display:grid;place-items:center;font-size:11px;font-weight:700;position:relative;background:var(--bed-empty);color:var(--bed-taken)}
.bed::before{content:"";position:absolute;top:4px;left:5px;right:5px;height:6px;border-radius:3px;border:1.5px solid currentColor;opacity:.7}
.bed.taken{background:var(--bed-taken);color:#fff}
.bed.taken::before{border-color:#fff}
.bed.blocked{border-color:var(--bed-blocked);color:var(--bed-blocked);background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--bed-blocked) 35%,transparent) 4px 7px)}
.bed.empty{border-style:dashed}
.bed span{margin-top:9px}
.room-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-muted)}
.legend .bed{width:20px;height:24px;border-width:2px}
.legend .bed::before{display:none}
.legend span.item{display:inline-flex;align-items:center;gap:8px}
.preview-rooms{display:flex;flex-wrap:wrap;gap:8px;max-height:220px;overflow:auto;padding:4px}
.preview-rooms .room{cursor:default;min-width:120px;padding:8px}
.bed-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line-soft);border-radius:var(--radius-sm)}
.bed-row .bed{flex-shrink:0}
.bed-row .who{flex:1;min-width:0}
.bed-row .who b{display:block}

/* ---------- rack ---------- */
.rack{overflow-x:auto}
.rack-grid{display:grid;min-width:1100px}
.rack-cell{border-bottom:1px solid var(--line-soft);border-inline-start:1px solid var(--line-soft);height:40px}
.rack-head{font-size:12px;color:var(--ink-muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line);background:var(--surface-2)}
.rack-head.today{color:var(--accent-dark);font-weight:700;background:var(--accent-soft)}
.rack-label{position:sticky;inset-inline-start:0;background:var(--surface);z-index:2;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line-soft);font-weight:600;height:40px}
.rack-label.bedrow{font-weight:500;color:var(--ink-muted);padding-inline-start:28px}
.bar{position:absolute;top:6px;height:28px;border-radius:6px;padding:0 8px;font-size:12px;font-weight:600;display:flex;align-items:center;overflow:hidden;white-space:nowrap;cursor:pointer;border:0;text-align:start}
.bar.inhouse{background:var(--accent);color:#fff}
.bar.confirmed{background:var(--info-soft);color:var(--info);border:1px solid var(--info)}
.bar.departed{background:var(--canvas-deep);color:var(--ink-muted)}

/* ---------- housekeeping ---------- */
.hk{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.hk-tile{border-radius:var(--radius-sm);padding:10px;border:1px solid var(--line-soft);background:var(--surface);cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:4px;position:relative}
.hk-tile b{font-size:17px}
.hk-tile.clean{border-inline-start:0;box-shadow:inset 0 -3px 0 var(--success)}
.hk-tile.dirty{box-shadow:inset 0 -3px 0 var(--danger)}
.hk-tile.cleaning{box-shadow:inset 0 -3px 0 var(--warning)}
.hk-tile.inspected{box-shadow:inset 0 -3px 0 var(--info)}
.hk-tile.ooo{box-shadow:inset 0 -3px 0 var(--line-strong);background:repeating-linear-gradient(135deg,var(--surface) 0 8px,var(--canvas-deep) 8px 16px)}

/* ---------- misc ---------- */
.progress{height:8px;background:var(--canvas-deep);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--success);border-radius:999px}
.list{display:flex;flex-direction:column}
.list-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.list-item:last-child{border-bottom:0}
.dot-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11.5px;color:var(--ink-muted)}
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login-art{background:var(--surface-strong);color:var(--canvas);padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px}
.role-card{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);cursor:pointer;text-align:start;width:100%}
.role-card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}
.kanban-col{background:var(--canvas-deep);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.kanban-col h3{margin:2px 4px 6px;font-size:14px;display:flex;justify-content:space-between}
.ticket{background:var(--surface);border-radius:var(--radius-sm);padding:10px 12px;border:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:start}

@media (max-width:1100px){
  .app{grid-template-columns:76px minmax(0,1fr)}
  .brand b,.brand small,.nav h6,.nav .label,.nav .count,.side-foot{display:none}
  .nav button{flex-direction:column;gap:2px;font-size:11px;justify-content:center}
  .g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:minmax(0,1fr)}
  .search{max-width:none}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}

/* ============================================================

const TODAY = '2026-09-17';
const D = (s) => new Date(s + 'T00:00:00Z');

function buildSeed() {
  const properties = [

/* ============================================================
   Derived facts, computed from state, never stored twice
   ============================================================ */
function bedState(state, room, bed, date = TODAY) {
  if (bed.blocked) return { kind: 'blocked' };
  const match = (s) => s.roomId === room.id && (room.bookableBy === 'room' || s.bedId === bed.id);
  if (date !== TODAY) {
    const covering = state.stays.find((s) => (s.status === 'in_house' || s.status === 'confirmed') && match(s) && s.start <= date && (!s.end || s.end > date));
    return covering ? { kind: covering.status === 'in_house' ? 'taken' : 'reserved', stay: covering } : { kind: 'empty' };
  }
  const inHouse = state.stays.find((s) => s.status === 'in_house' && match(s));
  if (inHouse) return { kind: 'taken', stay: inHouse };
  const soon = state.stays.filter((s) => s.status === 'confirmed' && match(s) && diffDays(TODAY, s.start) <= 7).sort((a, b) => a.start < b.start ? -1 : 1)[0];
  if (soon) return { kind: 'reserved', stay: soon };
  return { kind: 'empty' };
}
function roomSummary(state, room, date = TODAY) {
  const states = room.beds.map((b) => bedState(state, room, b, date));
  const count = (k) => states.filter((s) => s.kind === k).length;
  return { states, taken: count('taken'), reserved: count('reserved'), empty: count('empty'), blocked: count('blocked'), total: room.beds.length };
}

   Charts — plain SVG, each with a readable data table
   ============================================================ */
function LineChart({ points, height = 180, label, format = (v) => v, yMax = 100 }) {
  const w = 640, h = height, pad = 30;
  const xs = (i) => pad + (i * (w - pad * 2)) / Math.max(1, points.length - 1);
  const ys = (v) => h - pad - (v / yMax) * (h - pad * 2);
  const path = points.map((p, i) => `${i ? 'L' : 'M'}${xs(i)},${ys(p.value)}`).join(' ');
  const area = `${path} L${xs(points.length - 1)},${h - pad} L${xs(0)},${h - pad} Z`;
  return (
    <figure style={{ margin: 0 }}>
      <svg viewBox={`0 0 ${w} ${h}`} width="100%" role="img" aria-label={label}>
        {[0, 0.5, 1].map((g) => <g key={g}><line x1={pad} x2={w - pad} y1={ys(g * yMax)} y2={ys(g * yMax)} stroke="var(--line-soft)" /><text x={4} y={ys(g * yMax) + 4} fontSize="11" fill="var(--ink-muted)">{format(g * yMax)}</text></g>)}
        <path d={area} fill="var(--accent-soft)" opacity=".7" />
        <path d={path} fill="none" stroke="var(--accent)" strokeWidth="2.5" />
        {points.map((p, i) => <circle key={i} cx={xs(i)} cy={ys(p.value)} r="3" fill="var(--surface)" stroke="var(--accent)" strokeWidth="2" />)}
        {points.map((p, i) => (i % 2 === 0) && <text key={`t${i}`} x={xs(i)} y={h - 8} fontSize="11" textAnchor="middle" fill="var(--ink-muted)">{p.label}</text>)}
      </svg>
      <table className="sr-only"><caption>{label}</caption><tbody>{points.map((p, i) => <tr key={i}><th scope="row">{p.label}</th><td>{format(p.value)}</td></tr>)}</tbody></table>
    </figure>
  );
}

/* ============================================================

   ============================================================ */
function useDesk() {
  const { state, propertyId } = useApp();
  return useMemo(() => {
    const here = (s) => s.propertyId === propertyId;
    const arrivals = state.stays.filter((s) => here(s) && s.status === 'confirmed' && s.start <= TODAY);
    const checkedInToday = state.stays.filter((s) => here(s) && s.status === 'in_house' && s.start === TODAY);
    const departures = state.stays.filter((s) => here(s) && s.status === 'in_house' && s.end && s.end <= TODAY);
    const inHouse = state.stays.filter((s) => here(s) && s.status === 'in_house');
    return { arrivals, checkedInToday, departures, inHouse };
  }, [state, propertyId]);
}
function readinessOf(state, stay) {
  if (!stay.roomId) return { tone: 'b-bad', word: 'No room yet', ready: false, why: 'Assign a room first' };
  const room = state.rooms.find((r) => r.id === stay.roomId);
  if (room.hk === 'clean' || room.hk === 'inspected') return { tone: 'b-ok', word: 'Ready', ready: true };
  if (room.hk === 'cleaning') return { tone: 'b-warn', word: 'Being cleaned', ready: false, why: 'Room is being cleaned' };
  if (room.hk === 'ooo') return { tone: 'b-bad', word: 'Out of order', ready: false, why: 'Room is out of order' };
  return { tone: 'b-bad', word: 'Dirty', ready: false, why: 'Room has not been cleaned' };
}
function placeOf(state, stay) {
  if (!stay.roomId) return null;
  const room = state.rooms.find((r) => r.id === stay.roomId);
  return { room, text: `Room ${room.number}${stay.bedId ? `, bed ${stay.bedId}` : ''}` };
}

   Today
   ============================================================ */
function Today() {
  const { state, propertyId, go, lang } = useApp(); const f = useFormat(); const t = useT();
  const prop = state.properties.find((p) => p.id === propertyId);
  const desk = useDesk();
  const rooms = state.rooms.filter((r) => r.propertyId === propertyId);
  const sums = rooms.map((r) => roomSummary(state, r));
  const totalBeds = sums.reduce((a, s) => a + s.total - s.blocked, 0);
  const taken = sums.reduce((a, s) => a + s.taken, 0);
  const readyBeds = rooms.reduce((a, r, i) => a + ((r.hk === 'clean' || r.hk === 'inspected') ? sums[i].empty + sums[i].reserved : 0), 0);
  const cleaningBeds = rooms.reduce((a, r, i) => a + (r.hk === 'cleaning' ? sums[i].empty + sums[i].reserved : 0), 0);
  const openTickets = state.tickets.filter((x) => x.propertyId === propertyId && x.status !== 'done');
  const urgent = openTickets.filter((x) => x.priority === 'high');
  const overdue = desk.departures.filter((s) => s.end < TODAY);
  const floors = [...new Set(rooms.map((r) => r.floor))];
  const [tab, setTab] = useState('arrivals');

  const series = Array.from({ length: 14 }, (_, i) => {
    const day = addDays(TODAY, i);
    const n = state.stays.filter((s) => s.propertyId === propertyId && s.roomId && (s.status === 'in_house' || s.status === 'confirmed') && s.start <= day && (!s.end || s.end > day)).length;
    return { label: f.date(day), value: Math.round((n / Math.max(1, totalBeds)) * 100) };
  });
  const avg = Math.round(series.reduce((a, p) => a + p.value, 0) / series.length);

  const attention = [
    overdue.length && { sev: 'Urgent', tone: 'bad', icon: 'clock', title: `${overdue.length} departure${overdue.length > 1 ? 's' : ''} overdue`, body: overdue.slice(0, 2).map((s) => placeOf(state, s)?.text).join(' and ') + ' should have left already.', module: 'Front desk', act: () => go('frontdesk', { tab: 'departures' }), cta: 'Review departures' },
    desk.arrivals.some((s) => !s.roomId) && { sev: 'Urgent', tone: 'bad', icon: 'bed', title: `${desk.arrivals.filter((s) => !s.roomId).length} arrival without a room`, body: 'They arrive today and have no room or bed assigned yet.', module: 'Front desk', act: () => go('frontdesk', { tab: 'arrivals' }), cta: 'Assign a room' },
    urgent.length && { sev: 'High', tone: 'bad', icon: 'wrench', title: `${urgent.length} urgent maintenance request${urgent.length > 1 ? 's' : ''}`, body: urgent.map((x) => `${x.title} (room ${x.roomId.split('-')[1]})`).join('; '), module: 'Maintenance', act: () => go('maintenance'), cta: 'Open requests' },
    (() => { const hereP = state.people.filter((p) => state.stays.some((s) => s.personId === p.id && s.propertyId === propertyId && (s.status === 'in_house' || s.status === 'confirmed'))); const miss = hereP.filter((p) => paperworkScore(state, p).problems.length).length; const exp = hereP.filter((p) => paperworkScore(state, p).expiring).length; return (miss || exp) && { sev: miss ? 'High' : 'Check', tone: miss ? 'bad' : 'warn', icon: 'card', title: miss ? `${miss} ${miss === 1 ? 'person has' : 'people have'} missing paperwork` : `${exp} with documents expiring soon`, body: exp ? `${exp} ${exp === 1 ? 'has' : 'have'} a passport, permit or insurance expiring within 60 days.` : 'Student certificates, contracts or deposit receipts are missing.', module: 'Residents', act: () => go('people', { filter: 'papers' }), cta: 'Review paperwork' }; })(),
    { sev: 'Check', tone: 'warn', icon: 'card', title: 'Balances to collect', body: `${state.folios.filter((fo) => { const s = state.stays.find((x) => x.id === fo.stayId); return s && s.propertyId === propertyId && s.status === 'in_house' && folioBalance(fo) > 0; }).length} in-house folios have money owing.`, module: 'Billing', act: () => go('billing'), cta: 'Open folios' },
  ].filter(Boolean);

  return (
    <>
      <PageHead title={`${t('today')} at ${prop.name}`} sub={f.longDate(TODAY)}>
        <button className="btn" onClick={() => go('rooms')}><Icon name="rooms" />Bed map</button>
        <button className="btn primary" onClick={() => go('reservations', { create: true })}><Icon name="plus" />New reservation</button>
      </PageHead>

      <section className="grid g5" aria-label="Today at a glance" style={{ marginBottom: 16 }}>
        <button className="stat" onClick={() => go('rooms')}><span className="label">{t('occupancy')}</span><span className="value num">{f.pct(taken / Math.max(1, totalBeds))}</span><span className="sub">{taken} of {totalBeds} beds</span><span className="go">Open bed map</span></button>
        <button className="stat" onClick={() => go('frontdesk', { tab: 'arrivals' })}><span className="label">Arrivals today</span><span className="value num">{desk.arrivals.length + desk.checkedInToday.length}</span><span className="sub">{desk.checkedInToday.length} checked in</span><span className="go">Open arrivals</span></button>
        <button className="stat" onClick={() => go('frontdesk', { tab: 'departures' })}><span className="label">Departures today</span><span className="value num">{desk.departures.length}</span><span className="sub">{overdue.length ? <span style={{ color: 'var(--danger)', fontWeight: 600 }}>{overdue.length} overdue</span> : 'none overdue'}</span><span className="go">Open departures</span></button>
        <button className="stat" onClick={() => go('housekeeping')}><span className="label">Beds ready</span><span className="value num">{readyBeds}</span><span className="sub">{cleaningBeds} being cleaned</span><span className="go">Open housekeeping</span></button>
        <button className={`stat ${urgent.length ? 'alert' : ''}`} onClick={() => go('maintenance')}><span className="label">Open issues</span><span className="value num">{openTickets.length}</span><span className="sub">{urgent.length ? <span style={{ display: 'inline-flex', gap: 4, alignItems: 'center', color: 'var(--danger)', fontWeight: 600 }}><Icon name="alert" size={14} />{urgent.length} urgent</span> : 'nothing urgent'}</span><span className="go">Open maintenance</span></button>
      </section>

      <div className="split" style={{ marginBottom: 16 }}>
        <section className="card" aria-label="Today's movement">
          <div className="tabs" role="tablist">
            <button role="tab" aria-selected={tab === 'arrivals'} onClick={() => setTab('arrivals')}>Arrivals <span className="num">{desk.arrivals.length}</span></button>
            <button role="tab" aria-selected={tab === 'departures'} onClick={() => setTab('departures')}>Departures <span className="num">{desk.departures.length}</span></button>
            <span style={{ flex: 1 }} />
            <button className="btn ghost sm" style={{ alignSelf: 'center' }} onClick={() => go('frontdesk', { tab })}>Open full list</button>
          </div>
          <DeskTable mode={tab} limit={6} />
        </section>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <section className="card">
            <div className="card-h"><h2>Floor readiness</h2><button className="btn ghost sm" onClick={() => go('housekeeping')}>Housekeeping</button></div>
            <div className="card-b">
              <BarList rows={floors.map((fl) => { const fr = rooms.filter((r) => r.floor === fl); const ok = fr.filter((r) => r.hk === 'clean' || r.hk === 'inspected').length; return { label: `${t('floor')} ${fl}`, value: ok, suffix: ` / ${fr.length} ready`, color: ok / fr.length > .7 ? 'var(--success)' : 'var(--warning)' }; })} max={Math.max(...floors.map((fl) => rooms.filter((r) => r.floor === fl).length))} />
            </div>
          </section>
          <section className="card">
            <div className="card-h"><h2>Needs attention</h2><span className="muted num">{attention.length}</span></div>
            <div className="card-b list" style={{ paddingTop: 4, paddingBottom: 4 }}>
              {attention.map((a, i) => (
                <div className="list-item" key={i}>
                  <span className="dot-icon" style={{ background: `var(--${a.tone === 'bad' ? 'danger' : 'warning'}-soft)`, color: `var(--${a.tone === 'bad' ? 'danger' : 'warning'})` }}><Icon name={a.icon} size={16} /></span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}><b>{a.title}</b><Badge tone={a.tone === 'bad' ? 'b-bad' : 'b-warn'}>{a.sev}</Badge></div>
                    <div className="muted" style={{ fontSize: 13, margin: '2px 0 6px' }}>{a.body}</div>
                    <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}><button className="btn sm" onClick={a.act}>{a.cta}</button><span className="badge b-neutral">{a.module}</span></div>
                  </div>
                </div>
              ))}
            </div>
          </section>
        </div>
      </div>

      <section className="card">
        <div className="card-h"><h2>Occupancy, next 14 days</h2><span className="muted">Average <b className="num" style={{ color: 'var(--ink)' }}>{avg}%</b></span></div>
        <div className="card-b"><LineChart points={series} label="Occupancy for the next 14 days, percent of beds" format={(v) => `${v}%`} /></div>
      </section>
    </>
  );
}

/* ============================================================
   Arrivals & departures table (used on Today and Front desk)
   ============================================================ */
function DeskTable({ mode, limit, query = '' }) {
  const { state, go } = useApp(); const f = useFormat(); const desk = useDesk();
  const [dialog, setDialog] = useState(null);
  let rows = mode === 'arrivals' ? [...desk.arrivals, ...desk.checkedInToday] : mode === 'departures' ? desk.departures : desk.inHouse;
  if (query) rows = rows.filter((s) => { const p = state.people.find((x) => x.id === s.personId); return (p.name + s.ref + (placeOf(state, s)?.text || '')).toLowerCase().includes(query.toLowerCase()); });
  rows = rows.sort((a, b) => (a.status === 'in_house') - (b.status === 'in_house') || (a.start < b.start ? -1 : 1));
  const shown = limit ? rows.slice(0, limit) : rows;
  if (!rows.length) return <Empty icon={mode === 'arrivals' ? 'door' : 'logout'} title={mode === 'arrivals' ? 'Nobody else arrives today' : mode === 'departures' ? 'No departures left today' : 'Nobody is in house'} body="When there is something to do here it will appear in this list." action={<button className="btn" onClick={() => go('reservations', { create: true })}>New reservation</button>} />;
  return (
    <>
      <div className="table-wrap">
        <table aria-label={mode}>
          <thead><tr><th scope="col">{mode === 'arrivals' ? 'Resident or guest' : 'Name'}</th><th scope="col">Reservation</th><th scope="col">Room and bed</th><th scope="col">{mode === 'departures' ? 'Leaves' : 'Readiness'}</th><th scope="col">Balance</th><th scope="col"><span className="sr-only">Action</span></th></tr></thead>
          <tbody>
            {shown.map((s) => {
              const p = state.people.find((x) => x.id === s.personId); const place = placeOf(state, s); const ready = readinessOf(state, s);
              const folio = state.folios.find((x) => x.stayId === s.id); const bal = folioBalance(folio);
              const late = s.status === 'confirmed' && s.start < TODAY; const overdue = s.status === 'in_house' && s.end && s.end < TODAY;
              return (
                <tr key={s.id}>
                  <td><span style={{ display: 'flex', gap: 10, alignItems: 'center' }}><Avatar name={p.name} size={34} /><span><b>{p.name}</b><span className="sub">{s.kind === 'resident' ? 'Resident' : 'Guest'}{s.end ? `, until ${f.date(s.end)}` : ', no end date'}</span></span></span></td>
                  <td className="num">{s.ref}{late && <span className="sub" style={{ color: 'var(--warning)', fontWeight: 600 }}>1 day late</span>}{s.status === 'confirmed' && !late && s.eta && <span className="sub">expected {s.eta}</span>}</td>
                  <td>{place ? place.text : <span className="muted">Not assigned</span>}</td>
                  <td>{mode === 'departures' ? (overdue ? <Badge tone="b-bad">Overdue since {f.date(s.end)}</Badge> : <Badge tone="b-info">Today</Badge>) : s.status === 'in_house' ? <Badge tone="b-ok">Checked in {s.checkedInAt}</Badge> : <><Badge tone={ready.tone}>{ready.word}</Badge></>}</td>
                  <td className="num" style={{ color: bal > 0 ? 'var(--danger)' : bal < 0 ? 'var(--info)' : undefined, fontWeight: bal ? 600 : 400 }}>{f.money(bal)}{bal < 0 && <span className="sub">credit</span>}</td>
                  <td style={{ textAlign: 'end', whiteSpace: 'nowrap' }}>
                    {mode === 'arrivals' && s.status === 'confirmed' && (!s.roomId
                      ? <button className="btn sm" onClick={() => setDialog({ kind: 'checkin', stay: s })}>Assign and check in</button>
                      : <span style={{ display: 'inline-flex', flexDirection: 'column', alignItems: 'flex-end', gap: 2 }}><button className="btn sm primary" disabled={!ready.ready} onClick={() => setDialog({ kind: 'checkin', stay: s })}>Check in</button>{!ready.ready && <span className="muted" style={{ fontSize: 12 }}>{ready.why}</span>}</span>)}
                    {mode !== 'arrivals' && s.status === 'in_house' && <button className="btn sm primary" onClick={() => setDialog({ kind: 'checkout', stay: s })}>Check out</button>}
                    <Menu label={`More actions for ${p.name}`} items={[
                      { label: 'Reservation details', icon: 'reservations', onClick: () => go('reservations', { stayId: s.id }) },
                      { label: 'Open folio', icon: 'billing', onClick: () => go('billing', { stayId: s.id }) },
                      { label: 'Show on bed map', icon: 'rooms', onClick: () => go('rooms', { roomId: s.roomId }), disabled: !s.roomId },
                      { label: 'Profile', icon: 'people', onClick: () => go('profile', { personId: p.id }) },
                      s.status === 'in_house' && s.start === TODAY && '-',
                      s.status === 'in_house' && s.start === TODAY && { label: 'Undo check-in…', icon: 'undo', danger: true, onClick: () => setDialog({ kind: 'undo', stay: s }) },
                    ]} />
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {dialog?.kind === 'checkin' && <CheckInDialog stay={dialog.stay} onClose={() => setDialog(null)} />}
      {dialog?.kind === 'checkout' && <CheckOutDialog stay={dialog.stay} onClose={() => setDialog(null)} />}
      {dialog?.kind === 'undo' && <UndoCheckInDialog stay={dialog.stay} onClose={() => setDialog(null)} />}
    </>
  );
}

function freeBeds(state, propertyId, wantsType) {
  const out = [];
  state.rooms.filter((r) => r.propertyId === propertyId && r.hk !== 'ooo').forEach((room) => {
    const sum = roomSummary(state, room);
    if (room.bookableBy === 'room') { if (sum.states[0].kind === 'empty') out.push({ room, bedId: null, label: `Room ${room.number}` }); }
    else room.beds.forEach((b, i) => { if (sum.states[i].kind === 'empty') out.push({ room, bedId: b.id, label: `Room ${room.number}, bed ${b.id}` }); });
  });
  return out.sort((a, b) => ((b.room.type === wantsType) - (a.room.type === wantsType)) || (a.room.hk === 'clean' ? -1 : 1));
}

function CheckInDialog({ stay, onClose }) {
  const { state, mutate, toast, log } = useApp(); const f = useFormat();
  const p = state.people.find((x) => x.id === stay.personId);
  const options = useMemo(() => freeBeds(state, stay.propertyId, stay.wantsType), []);
  const [choice, setChoice] = useState(stay.roomId ? `${stay.roomId}|${stay.bedId || ''}` : options[0] ? `${options[0].room.id}|${options[0].bedId || ''}` : '');
  const [roomId, bedId] = choice.split('|');
  const room = state.rooms.find((r) => r.id === roomId);
  const notReady = room && !(room.hk === 'clean' || room.hk === 'inspected');
  const late = stay.start < TODAY;
  const confirm = () => {
    mutate((s) => { const x = s.stays.find((y) => y.id === stay.id); x.roomId = roomId; x.bedId = bedId || null; x.status = 'in_house'; x.start = TODAY; x.checkedInAt = '14:32'; });
    log('Checked in', `${stay.ref}, room ${room.number}${bedId ? `, bed ${bedId}` : ''}`);
    toast(`${p.name} checked in to room ${room.number}${bedId ? `, bed ${bedId}` : ''}`); onClose();
  };
  return (
    <Modal title={`Check in ${p.name}`} description={`${stay.ref}. ${stay.kind === 'resident' ? 'Resident' : 'Guest'}${stay.end ? `, until ${f.date(stay.end)}` : ', no end date'}.`} onClose={onClose}
      footer={<><button className="btn" onClick={onClose}>Cancel</button><button className="btn primary" disabled={!room || notReady} onClick={confirm}>Check in</button></>}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        {late && <div className="notice warn"><Icon name="clock" />Booked for {f.date(stay.start)}. The stay will start today, {f.date(TODAY)}, so no night is charged for yesterday.</div>}
        <div className="field">
          <label htmlFor="bedpick">Room and bed</label>
          <select id="bedpick" className="select" value={choice} onChange={(e) => setChoice(e.target.value)}>
            {stay.roomId && <option value={`${stay.roomId}|${stay.bedId || ''}`}>Assigned: {placeOf(state, stay).text}</option>}
            {options.map((o) => <option key={`${o.room.id}${o.bedId}`} value={`${o.room.id}|${o.bedId || ''}`}>{o.label} ({typeById(o.room.type).en}, {o.room.hk})</option>)}
          </select>
          <span className="hint">Only empty beds that are not out of order are listed.</span>
        </div>
        {room && <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}><span className="muted">Room status</span><HkBadge hk={room.hk} /></div>}
        {notReady && <div className="notice bad"><Icon name="alert" />This room is not ready. Choose another bed, or ask housekeeping to finish it first.</div>}
      </div>
    </Modal>
  );
}

function UndoCheckInDialog({ stay, onClose }) {
  const { state, mutate, toast, log } = useApp();
  const p = state.people.find((x) => x.id === stay.personId); const place = placeOf(state, stay);
  const folio = state.folios.find((x) => x.stayId === stay.id);
  const charged = folio && folio.lines.some((l) => l.date >= TODAY && l.amount > 0);
  const [reason, setReason] = useState('');
  const ok = reason.trim().length >= 3;
  return (
    <Modal title="Undo this check-in?" description="Use this when the wrong person was checked in. The stay is withdrawn and the reservation goes back to today's arrivals. Nothing is deleted." onClose={onClose}
      footer={<><button className="btn" onClick={onClose}>Keep check-in</button><button className="btn danger" disabled={!ok || charged} onClick={() => { mutate((s) => { const x = s.stays.find((y) => y.id === stay.id); x.status = 'confirmed'; }); log('Undid check-in', stay.ref, reason.trim()); toast(`Check-in undone for ${p.name}`); onClose(); }}>Undo check-in</button></>}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <dl className="dl" style={{ background: 'var(--surface-2)', padding: 12, borderRadius: 'var(--radius-sm)' }}>
          <dt>Name</dt><dd><bdi>{p.name}</bdi></dd><dt>Room</dt><dd>{place?.text}</dd><dt>Checked in</dt><dd>Today at {stay.checkedInAt}</dd>
        </dl>
        {charged ? <div className="notice bad"><Icon name="alert" />Charges have been posted to this stay, so it counts as having happened and the check-in can't be undone. Correct the charges in Billing.</div> : (
          <div className="field"><label htmlFor="why">Reason <span className="muted" style={{ fontWeight: 400 }}>(required)</span></label>
            <textarea id="why" className="input" rows="3" value={reason} onChange={(e) => setReason(e.target.value)} placeholder="For example: checked in the wrong one of two residents arriving together" maxLength={2000} />
            <span className="hint">Kept with the record of this correction. At least 3 characters.</span></div>
        )}
      </div>
    </Modal>
  );
}

function CheckOutDialog({ stay, onClose }) {
  const { state, mutate, toast, log } = useApp(); const f = useFormat();
  const p = state.people.find((x) => x.id === stay.personId); const place = placeOf(state, stay);
  const folio = state.folios.find((x) => x.stayId === stay.id); const bal = folioBalance(folio);
  const early = stay.end && stay.end > TODAY;
  const [how, setHow] = useState(bal > 0 ? 'pay' : bal < 0 ? 'open' : 'zero');
  const [method, setMethod] = useState('Card');
  const [reason, setReason] = useState('');
  const [ackEarly, setAckEarly] = useState(false);
  const blocked = (early && !ackEarly) || (how === 'open' && reason.trim().length < 3);
  const confirm = () => {
    mutate((s) => {
      const x = s.stays.find((y) => y.id === stay.id); x.status = 'departed'; x.end = TODAY;
      const fo = s.folios.find((y) => y.stayId === stay.id);
      if (fo && how === 'pay') fo.lines.push({ id: `pay${Date.now()}`, date: TODAY, desc: `Payment, ${method.toLowerCase()}`, amount: -bal });
      if (fo) { fo.status = how === 'open' ? 'open' : 'closed'; if (how === 'open') fo.openReason = reason; }
      const r = s.rooms.find((y) => y.id === stay.roomId); if (r) r.hk = 'dirty';
    });
    log('Checked out', `${stay.ref}, ${place.text}`, how === 'open' ? `Folio left open: ${reason}` : null);
    toast(`${p.name} checked out. Room ${place.room.number} is marked dirty.`); onClose();
  };
  return (
    <Modal title={`Check out ${p.name}`} description={`${place.text}. ${stay.ref}.`} onClose={onClose}
      footer={<><button className="btn" onClick={onClose}>Cancel</button><button className="btn primary" disabled={blocked} onClick={confirm}>{how === 'pay' ? `Take ${f.money(bal)} and check out` : 'Check out'}</button></>}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <div className="card" style={{ boxShadow: 'none' }}>
          <div className="card-h"><h2 style={{ fontSize: 15 }}>Folio</h2><b className="num" style={{ color: bal > 0 ? 'var(--danger)' : undefined }}>{f.money(bal)}</b></div>
          <div className="table-wrap" style={{ maxHeight: 180, overflow: 'auto' }}><table><tbody>{folio.lines.map((l) => <tr key={l.id}><td className="num muted">{f.date(l.date)}</td><td>{l.desc}</td><td className="num" style={{ textAlign: 'end' }}>{f.money(l.amount)}</td></tr>)}</tbody></table></div>
        </div>
        {early && <label className="switch"><input type="checkbox" checked={ackEarly} onChange={(e) => setAckEarly(e.target.checked)} /><span>Leaving early: booked until {f.date(stay.end)}. The stay will end today.</span></label>}
        {bal !== 0 && (
          <fieldset style={{ border: 0, padding: 0, margin: 0, display: 'flex', flexDirection: 'column', gap: 8 }}>
            <legend style={{ fontWeight: 600, marginBottom: 6 }}>{bal > 0 ? `${f.money(bal)} is owed` : `The ${p.kind === 'resident' ? 'resident' : 'guest'} has ${f.money(-bal)} credit`}</legend>
            {bal > 0 && <label className="switch"><input type="radio" name="how" checked={how === 'pay'} onChange={() => setHow('pay')} /><span>Take payment now</span></label>}
            {how === 'pay' && <div className="pills" style={{ marginInlineStart: 50 }}>{['Card', 'Cash', 'Bank transfer'].map((m) => <button key={m} type="button" className="pill" aria-pressed={method === m} onClick={() => setMethod(m)}>{m}</button>)}</div>}
            <label className="switch"><input type="radio" name="how" checked={how === 'open'} onChange={() => setHow('open')} /><span>Leave the folio open</span></label>
            {how === 'open' && <div className="field" style={{ marginInlineStart: 50 }}><label htmlFor="openwhy">Why?</label><input id="openwhy" className="input" value={reason} onChange={(e) => setReason(e.target.value)} placeholder={bal > 0 ? 'Company pays by invoice' : 'Refund to card, approved by manager'} /></div>}
          </fieldset>
        )}
      </div>
    </Modal>
  );
}

function FrontDesk({ params }) {
  const desk = useDesk(); const [tab, setTab] = useState(params?.tab || 'arrivals'); const [q, setQ] = useState('');
  useEffect(() => { if (params?.tab) setTab(params.tab); }, [params]);
  return (
    <>
      <PageHead title="Arrivals & departures" sub="Everyone arriving, leaving or staying at this Property today." />
      <section className="card">
        <div className="tabs" role="tablist" style={{ alignItems: 'center' }}>

/* ============================================================
   Rooms & beds

const RULE_WORD = { mixed: 'Mixed', women: 'Women only', men: 'Men only' };
function Rooms({ params }) {
  const { state, propertyId, can } = useApp(); const t = useT(); const f = useFormat();
  const rooms = state.rooms.filter((r) => r.propertyId === propertyId);
  const buildings = [...new Set(rooms.map((r) => r.building))];
  const [building, setBuilding] = useState('all'); const [floor, setFloor] = useState('all'); const [onlyEmpty, setOnlyEmpty] = useState(false); const [view, setView] = useState('map'); const [q, setQ] = useState(''); const [night, setNight] = useState(TODAY);
  const [openRoom, setOpenRoom] = useState(params?.roomId || null); const [adding, setAdding] = useState(false);
  useEffect(() => { if (params?.roomId) setOpenRoom(params.roomId); }, [params]);
  const inBuilding = rooms.filter((r) => building === 'all' || r.building === building);
  const floors = [...new Set(inBuilding.map((r) => r.floor))].sort((a, b) => a - b);
  const sums = Object.fromEntries(rooms.map((r) => [r.id, roomSummary(state, r, night)]));
  const all = inBuilding.map((r) => sums[r.id]);
  const total = all.reduce((a, s) => a + s.total, 0), taken = all.reduce((a, s) => a + s.taken, 0), empty = all.reduce((a, s) => a + s.empty, 0), blocked = all.reduce((a, s) => a + s.blocked, 0), reserved = all.reduce((a, s) => a + s.reserved, 0);
  const visible = inBuilding.filter((r) => (floor === 'all' || r.floor === floor) && (!onlyEmpty || sums[r.id].empty > 0) && (!q || r.number.includes(q)));
  const canEdit = can('rooms.edit'); const canAssign = can('rooms.assign');
  const isToday = night === TODAY;

  return (
    <>

        <label className="chip" style={{ cursor: 'default' }}><Icon name="reservations" size={16} /><span>Night of</span><input type="date" value={night} min={addDays(TODAY, -30)} onChange={(e) => setNight(e.target.value || TODAY)} style={{ border: 0, background: 'transparent', fontWeight: 600 }} aria-label="Show beds for the night of" /></label>
        {!isToday && <button className="btn" onClick={() => setNight(TODAY)}>Back to tonight</button>}
        {canEdit && <button className="btn primary" onClick={() => setAdding(true)}><Icon name="plus" />{t('addRooms')}</button>}
      </PageHead>

      {!isToday && <div className="notice" style={{ marginBottom: 14 }}><Icon name="reservations" />Showing beds for the night of {f.longDate(night)}. Reserved means a confirmed reservation covers that night.</div>}

      <section className="grid g5" style={{ marginBottom: 16 }} aria-label="Summary">
        <div className="stat" style={{ cursor: 'default' }}><span className="label">{t('statRooms')}</span><span className="value num">{inBuilding.length}</span><span className="sub">{buildings.length > 1 && building === 'all' ? `${buildings.length} buildings, ` : ''}{floors.length} floors</span></div>
        <div className="stat" style={{ cursor: 'default' }}><span className="label">{t('statBeds')}</span><span className="value num">{total}</span><span className="sub">{f.pct((taken + (isToday ? 0 : reserved)) / Math.max(1, total - blocked))} {t('occupancy').toLowerCase()}</span></div>
        <div className="stat" style={{ cursor: 'default' }}><span className="label">{t('statTaken')}</span><span className="value num">{taken}</span><span className="sub">{reserved} {isToday ? 'more reserved this week' : 'reserved that night'}</span></div>
        <button className="stat" onClick={() => setOnlyEmpty(true)}><span className="label">{isToday ? t('statEmpty') : 'Empty beds that night'}</span><span className="value num" style={{ color: 'var(--accent)' }}>{empty}</span><span className="sub">in {all.filter((s) => s.empty).length} rooms</span><span className="go">Show only these rooms</span></button>
        <div className="stat" style={{ cursor: 'default' }}><span className="label">{t('statBlocked')}</span><span className="value num">{blocked}</span><span className="sub">not bookable</span></div>
      </section>

      <section className="card" style={{ marginBottom: 16 }}>

          <div className="pills" role="group" aria-label={t('floor')}>
            <button className="pill" aria-pressed={floor === 'all'} onClick={() => setFloor('all')}>{t('all')} floors</button>
            {floors.map((fl) => <button key={fl} className="pill" aria-pressed={floor === fl} onClick={() => setFloor(fl)}>{t('floor')} {fl}</button>)}
          </div>
          <label className="switch"><input type="checkbox" checked={onlyEmpty} onChange={(e) => setOnlyEmpty(e.target.checked)} />{t('onlyEmpty')}</label>
          <span style={{ flex: 1 }} />
          <label className="search" style={{ height: 36, maxWidth: 170 }}><Icon name="search" size={16} /><input placeholder="Room number" value={q} onChange={(e) => setQ(e.target.value)} aria-label="Room number" inputMode="numeric" /></label>
          <div className="seg" role="group" aria-label="View"><button aria-pressed={view === 'map'} onClick={() => setView('map')}>{t('bedMap')}</button><button aria-pressed={view === 'list'} onClick={() => setView('list')}>{t('bedList')}</button></div>
        </div>
        <div className="card-b legend" style={{ borderTop: '1px solid var(--line-soft)', paddingTop: 10, paddingBottom: 10 }}>
          <span className="item"><BedIcon kind="taken" label="" />{t('occupied')}</span>
          <span className="item"><BedIcon kind="reserved" label="" />{t('reserved')}{isToday ? ', arriving within 7 days' : ''}</span>
          <span className="item"><BedIcon kind="empty" label="" />{t('empty')}</span>
          <span className="item"><BedIcon kind="blocked" label="" />{t('blocked')}</span>
        </div>
      </section>

      {!visible.length && <div className="card"><Empty icon="bed" title="No rooms match" body={onlyEmpty ? 'Every bed here is taken, reserved or blocked that night.' : 'Try another floor or clear the search.'} action={<button className="btn" onClick={() => { setOnlyEmpty(false); setFloor('all'); setBuilding('all'); setQ(''); }}>Clear filters</button>} /></div>}

      {view === 'map' ? buildings.filter((b) => building === 'all' || b === building).flatMap((b) => floors.filter((fl) => visible.some((r) => r.floor === fl && r.building === b)).map((fl) => {

          <section className="floor" key={`${b}-${fl}`} aria-label={`${b}, ${t('floor')} ${fl}`}>
            <div className="floor-h"><h2>{buildings.length > 1 ? `${b}, ` : ''}{t('floor')} {fl}</h2><span className="muted">{fr.length} rooms, {fe} {t('empty').toLowerCase()} {fe === 1 ? 'bed' : 'beds'}</span>{rules.map((ru) => ru !== 'mixed' && <Badge key={ru} tone="b-info">{RULE_WORD[ru]}</Badge>)}</div>
            <div className="rooms">
              {fr.map((r) => {
                const s = sums[r.id];
                return (
                  <button key={r.id} className={`room ${r.hk === 'ooo' ? 'ooo' : ''}`} onClick={() => setOpenRoom(r.id)} aria-label={`Room ${r.number}, ${s.taken} of ${s.total} beds occupied, ${s.empty} empty`}>

                    <div className="beds">{r.beds.map((bd, i) => <BedIcon key={bd.id} kind={s.states[i].kind} label={bd.label} title={`Bed ${bd.label}: ${s.states[i].kind}`} />)}</div>

                      <HkBadge hk={r.hk} />
                    </div>
                  </button>
                );
              })}
            </div>
          </section>
        );
      })) : (
        <section className="card"><div className="table-wrap"><table aria-label={t('bedList')}>
          <thead><tr><th scope="col">{t('room')}</th><th scope="col">{t('bed')}</th><th scope="col">Building and floor</th><th scope="col">Type</th><th scope="col">State</th><th scope="col">Who</th><th scope="col">Until</th><th scope="col">Room status</th></tr></thead>
          <tbody>{visible.flatMap((r) => r.beds.map((b, i) => {
            const st = sums[r.id].states[i]; const who = st.stay && state.people.find((x) => x.id === st.stay.personId);
            if (onlyEmpty && st.kind !== 'empty') return null;
            return <tr key={r.id + b.id} className="row-click" onClick={() => setOpenRoom(r.id)}><td className="num"><b>{r.number}</b></td><td>{b.label}</td><td>{r.building}, {r.floor}</td><td>{f.typeName(r.type)}</td><td><Badge tone={{ taken: 'b-ok', reserved: 'b-info', empty: 'b-neutral', blocked: 'b-bad' }[st.kind]}>{t({ taken: 'occupied', reserved: 'reserved', empty: 'empty', blocked: 'blocked' }[st.kind])}</Badge></td><td>{who ? <span style={{ display: 'flex', gap: 8, alignItems: 'center' }}><Avatar name={who.name} size={28} />{who.name}</span> : b.blocked ? <span className="muted">{b.blockReason}</span> : '—'}</td><td className="num">{st.stay ? (st.kind === 'reserved' ? `from ${f.date(st.stay.start)}` : st.stay.end ? f.date(st.stay.end) : 'no end date') : '—'}</td><td><HkBadge hk={r.hk} /></td></tr>;
          }))}</tbody>
        </table></div></section>
      )}

      {openRoom && <RoomDrawer roomId={openRoom} onClose={() => setOpenRoom(null)} canEdit={canEdit} canAssign={canAssign} />}
      {adding && <AddRoomsModal onClose={() => setAdding(false)} floors={[...new Set(rooms.map((r) => r.floor))].sort((a, b) => a - b)} buildings={buildings} />}
    </>
  );
}

function RoomDrawer({ roomId, onClose, canEdit, canAssign }) {
  const { state, mutate, toast, go, log } = useApp(); const t = useT(); const f = useFormat();
  const room = state.rooms.find((r) => r.id === roomId);
  const [draft, setDraft] = useState(() => JSON.parse(JSON.stringify(room)));
  const [assignBed, setAssignBed] = useState(null); const [blockBed, setBlockBed] = useState(null); const [moving, setMoving] = useState(null);
  const sum = roomSummary(state, room);
  // the smallest bed count that keeps every occupied, reserved or blocked bed
  const lastUsed = sum.states.reduce((a, s, i) => (s.kind !== 'empty' ? i + 1 : a), 0);
  const setBeds = (n) => setDraft((d) => {
    const beds = Array.from({ length: n }, (_, i) => d.beds[i] || { id: BED_LABELS[i], label: BED_LABELS[i], blocked: false });
    return { ...d, beds, bookableBy: n > 1 ? d.bookableBy : 'room' };
  });
  const dirty = JSON.stringify(draft) !== JSON.stringify(room);
  const save = () => { mutate((s) => { const i = s.rooms.findIndex((r) => r.id === roomId); s.rooms[i] = { ...draft }; }); log('Changed room', `Room ${draft.number}, ${draft.beds.length} beds`); toast(`Room ${draft.number} saved`); onClose(); };

  return (
    <Drawer title={`Room ${room.number}`} subtitle={`${room.building}, ${t('floor')} ${room.floor}, ${f.typeName(room.type)}, ${RULE_WORD[room.rule].toLowerCase()}, ${sum.taken} of ${sum.total} beds occupied`} onClose={onClose}
      footer={canEdit ? <><button className="btn" onClick={onClose}>{t('cancel')}</button><button className="btn primary" disabled={!dirty} onClick={save}>{t('save')}</button></> : null}>
      {room.hk === 'ooo' && <div className="notice warn"><Icon name="lock" />This room is out of order, so none of its beds can be booked.</div>}
      <section style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        <h3 style={{ margin: 0, fontSize: 15 }}>{t('beds')}</h3>
        {room.beds.map((b, i) => {
          const st = sum.states[i]; const who = st.stay && state.people.find((x) => x.id === st.stay.personId);
          return (
            <div className="bed-row" key={b.id}>
              <BedIcon kind={st.kind} label={b.label} />
              <div className="who">
                {st.kind === 'taken' && <><b style={{ display: 'flex', gap: 8, alignItems: 'center' }}><Avatar name={who.name} size={24} />{who.name}</b><span className="muted" style={{ fontSize: 13 }}>{st.stay.kind === 'resident' ? 'Resident' : 'Guest'}, {st.stay.end ? `until ${f.date(st.stay.end)}` : 'no end date'}</span></>}
                {st.kind === 'reserved' && <><b>{t('reserved')}: {who.name}</b><span className="muted" style={{ fontSize: 13 }}>arrives {st.stay.start === TODAY ? 'today' : f.date(st.stay.start)}</span></>}
                {st.kind === 'empty' && <><b>{t('empty')}</b><span className="muted" style={{ fontSize: 13 }}>Free tonight</span></>}
                {st.kind === 'blocked' && <><b>{t('blocked')}</b><span className="muted" style={{ fontSize: 13 }}>{b.blockReason}</span></>}
              </div>
              {st.kind === 'taken' && <>{canAssign && <button className="btn sm" onClick={() => setMoving(st.stay)}><Icon name="move" size={14} />Move</button>}<button className="btn sm" onClick={() => go('profile', { personId: who.id })}>Profile</button></>}
              {st.kind === 'empty' && canAssign && room.hk !== 'ooo' && <><button className="btn sm primary" onClick={() => setAssignBed(b.id)}>Assign</button><Menu label={`Bed ${b.label} options`} items={[{ label: 'Block this bed…', icon: 'lock', onClick: () => setBlockBed(b.id) }]} /></>}
              {st.kind === 'blocked' && canAssign && room.hk !== 'ooo' && <button className="btn sm" onClick={() => { mutate((s) => { const r = s.rooms.find((x) => x.id === roomId); const bb = r.beds.find((x) => x.id === b.id); bb.blocked = false; }); setDraft((d) => ({ ...d, beds: d.beds.map((x) => x.id === b.id ? { ...x, blocked: false } : x) })); toast(`Bed ${b.label} unblocked`); }}>Unblock</button>}
            </div>
          );
        })}
      </section>

      {canEdit && (
        <section style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <h3 style={{ margin: 0, fontSize: 15 }}>Room details</h3>
          <div className="form-grid">
            <div className="field"><label htmlFor="rno">Room number</label><input id="rno" className="input" value={draft.number} onChange={(e) => setDraft({ ...draft, number: e.target.value })} /></div>
            <div className="field"><label htmlFor="rtype">{t('roomType')}</label><select id="rtype" className="select" value={draft.type} onChange={(e) => setDraft({ ...draft, type: e.target.value })}>{ROOM_TYPES.map((x) => <option key={x.id} value={x.id}>{f.typeName(x.id)}</option>)}</select></div>

            <div className="field"><label htmlFor="rbld">Building</label><input id="rbld" className="input" value={draft.building} onChange={(e) => setDraft({ ...draft, building: e.target.value })} /></div>

            <div className="field"><label htmlFor="hk">Room status</label><select id="hk" className="select" value={draft.hk} onChange={(e) => setDraft({ ...draft, hk: e.target.value })}>{['clean', 'inspected', 'cleaning', 'dirty', 'ooo'].map((h) => <option key={h} value={h}>{t(h)}</option>)}</select></div>

          </div>
        </section>
      )}
      {moving && <MoveStayModal stay={moving} onClose={() => setMoving(null)} />}
      {assignBed && <AssignBedModal room={room} bedId={assignBed} onClose={() => setAssignBed(null)} />}
      {blockBed && <BlockBedModal room={room} bedId={blockBed} onClose={(reason) => { if (reason) setDraft((d) => ({ ...d, beds: d.beds.map((x) => x.id === blockBed ? { ...x, blocked: true, blockReason: reason } : x) })); setBlockBed(null); }} />}
    </Drawer>
  );
}

function AssignBedModal({ room, bedId, onClose }) {
  const { state, mutate, toast, log } = useApp(); const f = useFormat();
  const waiting = state.stays.filter((s) => s.propertyId === room.propertyId && s.status === 'confirmed' && !s.roomId);
  const [mode, setMode] = useState(waiting.length ? 'reservation' : 'walkin');
  const [stayId, setStayId] = useState(waiting[0]?.id || ''); const [name, setName] = useState(''); const [kind, setKind] = useState('resident'); const [until, setUntil] = useState('2027-06-30');
  const place = `Room ${room.number}${room.bookableBy === 'bed' ? `, bed ${bedId}` : ''}`;
  const ok = mode === 'reservation' ? !!stayId : name.trim().length > 1;
  const confirm = () => {
    mutate((s) => {
      if (mode === 'reservation') { const x = s.stays.find((y) => y.id === stayId); x.roomId = room.id; x.bedId = room.bookableBy === 'bed' ? bedId : null; }
      else {
        const pid = `u${Date.now()}`; s.people.push({ id: pid, name: name.trim(), kind, country: 'Türkiye', phone: '—', email: '—' });
        const id = `s${Date.now()}`; s.stays.push({ id, ref: `RZ-${Math.floor(25000 + Math.random() * 999)}`, personId: pid, propertyId: room.propertyId, roomId: room.id, bedId: room.bookableBy === 'bed' ? bedId : null, kind, status: 'in_house', start: TODAY, end: until || null, checkedInAt: '14:40' });
        s.folios.push({ id: `f${id}`, stayId: id, status: 'open', lines: [] });
      }
    });
    log(mode === 'reservation' ? 'Assigned bed' : 'Checked in walk-in', place);
    toast(mode === 'reservation' ? `Reservation assigned to ${place}` : `${name.trim()} checked in to ${place}`); onClose();
  };
  return (
    <Modal title={`Assign ${place}`} onClose={onClose} footer={<><button className="btn" onClick={onClose}>Cancel</button><button className="btn primary" disabled={!ok} onClick={confirm}>{mode === 'reservation' ? 'Assign bed' : 'Check in now'}</button></>}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <div className="pills"><button className="pill" aria-pressed={mode === 'reservation'} onClick={() => setMode('reservation')} disabled={!waiting.length}>Reservation without a bed ({waiting.length})</button><button className="pill" aria-pressed={mode === 'walkin'} onClick={() => setMode('walkin')}>Walk-in, check in now</button></div>
        {mode === 'reservation' ? (
          <div className="field"><label htmlFor="res">Reservation</label><select id="res" className="select" value={stayId} onChange={(e) => setStayId(e.target.value)}>{waiting.map((s) => <option key={s.id} value={s.id}>{state.people.find((p) => p.id === s.personId).name}, {s.ref}, arrives {f.date(s.start)}</option>)}</select></div>
        ) : (
          <div className="form-grid">
            <div className="field full"><label htmlFor="wn">Full name</label><input id="wn" className="input" value={name} onChange={(e) => setName(e.target.value)} placeholder="As written on the ID" /></div>
            <div className="field"><label htmlFor="wk">Type</label><select id="wk" className="select" value={kind} onChange={(e) => setKind(e.target.value)}><option value="resident">Resident</option><option value="guest">Guest</option></select></div>
            <div className="field"><label htmlFor="wu">Until</label><input id="wu" type="date" className="input" value={until} min={addDays(TODAY, 1)} onChange={(e) => setUntil(e.target.value)} /><span className="hint">Leave empty for no end date.</span></div>
          </div>
        )}
      </div>
    </Modal>
  );
}

function BlockBedModal({ room, bedId, onClose }) {
  const { mutate, toast, log } = useApp(); const [reason, setReason] = useState('');
  const go = () => { mutate((s) => { const b = s.rooms.find((r) => r.id === room.id).beds.find((x) => x.id === bedId); b.blocked = true; b.blockReason = reason.trim(); }); log('Blocked bed', `Room ${room.number}, bed ${bedId}`, reason.trim()); toast(`Bed ${bedId} in room ${room.number} blocked`); onClose(reason.trim()); };
  return (
    <Modal title={`Block bed ${bedId} in room ${room.number}?`} description="A blocked bed can't be booked or assigned until someone unblocks it." onClose={() => onClose(null)} footer={<><button className="btn" onClick={() => onClose(null)}>Cancel</button><button className="btn primary" disabled={reason.trim().length < 3} onClick={go}>Block bed</button></>}>
      <div className="field"><label htmlFor="br">Reason</label><input id="br" className="input" value={reason} onChange={(e) => setReason(e.target.value)} placeholder="Broken frame, mattress being replaced" /></div>
    </Modal>
  );
}

function AddRoomsModal({ onClose, floors, buildings = ['Main building'] }) {
  const { state, propertyId, mutate, toast, log } = useApp(); const t = useT(); const f = useFormat();
  const nextFloor = (floors.length ? Math.max(...floors) : 0) + 1;
  const [floor, setFloor] = useState(nextFloor); const [count, setCount] = useState(8); const [first, setFirst] = useState(`${nextFloor}01`);
  const [type, setType] = useState('quad'); const [beds, setBeds] = useState(4); const [bookBy, setBookBy] = useState('bed'); const [building, setBuilding] = useState(buildings[buildings.length - 1]); const [rule, setRule] = useState('mixed');
  useEffect(() => { setFirst(`${floor}01`); }, [floor]);
  useEffect(() => { setBeds(typeById(type).beds); }, [type]);
  const start = parseInt(first, 10);
  const numbers = Array.from({ length: count }, (_, i) => String(start + i));
  const existing = new Set(state.rooms.filter((r) => r.propertyId === propertyId).map((r) => r.number));
  const clashes = numbers.filter((n) => existing.has(n));
  const valid = !Number.isNaN(start) && count > 0 && beds > 0 && !clashes.length;
  const create = () => {
    mutate((s) => numbers.forEach((n) => s.rooms.push({ id: `${propertyId}-${n}-${Date.now()}`, propertyId, number: n, floor: Number(floor), type, hk: 'clean', building, rule, bookableBy: beds > 1 ? bookBy : 'room', beds: Array.from({ length: beds }, (_, b) => ({ id: BED_LABELS[b], label: BED_LABELS[b], blocked: false })) })));

          <div className="field"><label htmlFor="arule">Who can stay</label><select id="arule" className="select" value={rule} onChange={(e) => setRule(e.target.value)}>{Object.entries(RULE_WORD).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></div>
          <div className="field"><label htmlFor="af">{t('floor')}</label><select id="af" className="select" value={floor} onChange={(e) => setFloor(Number(e.target.value))}>{floors.map((fl) => <option key={fl} value={fl}>{t('floor')} {fl}</option>)}<option value={nextFloor}>New floor {nextFloor}</option></select></div>
          <div className="field"><label htmlFor="afirst">{t('firstNumber')}</label><input id="afirst" className="input num" value={first} onChange={(e) => setFirst(e.target.value.replace(/\D/g, ''))} inputMode="numeric" /><span className="hint">Rooms are numbered in order from here.</span></div>
          <div className="field"><label>{t('howMany')}</label><Stepper value={count} min={1} max={60} label="rooms" onChange={setCount} /></div>
          <div className="field"><label htmlFor="at">{t('roomType')}</label><select id="at" className="select" value={type} onChange={(e) => setType(e.target.value)}>{ROOM_TYPES.map((x) => <option key={x.id} value={x.id}>{f.typeName(x.id)}</option>)}</select></div>
          <div className="field"><label>{t('bedsPerRoom')}</label><Stepper value={beds} min={1} max={12} label="beds" onChange={setBeds} /></div>
          {beds > 1 && <div className="field"><span style={{ fontWeight: 600, fontSize: 13 }}>{t('bookBy')}</span><div className="pills"><button type="button" className="pill" aria-pressed={bookBy === 'bed'} onClick={() => setBookBy('bed')}>{t('byBed')}</button><button type="button" className="pill" aria-pressed={bookBy === 'room'} onClick={() => setBookBy('room')}>{t('byRoom')}</button></div></div>}
        </div>
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}><b>{t('preview')}</b><span className="muted num">{numbers[0]}{count > 1 ? `–${numbers[numbers.length - 1]}` : ''}, {count * beds} beds</span></div>
          {clashes.length > 0 && <div className="notice bad" style={{ marginBottom: 10 }}><Icon name="alert" />Room {clashes.slice(0, 4).join(', ')}{clashes.length > 4 ? ` and ${clashes.length - 4} more` : ''} already exist. Change the first room number.</div>}
          <div className="preview-rooms">

function RoomCalendar() {
  const { state, propertyId, go } = useApp(); const f = useFormat(); const t = useT();
  const [from, setFrom] = useState(addDays(TODAY, -3)); const days = 14; const [floor, setFloor] = useState(1); const [expanded, setExpanded] = useState({}); const [sel, setSel] = useState(null);
  const rooms = state.rooms.filter((r) => r.propertyId === propertyId && r.floor === floor);
  const floors = [...new Set(state.rooms.filter((r) => r.propertyId === propertyId).map((r) => r.floor))];
  const dates = Array.from({ length: days }, (_, i) => addDays(from, i));
  const rows = rooms.flatMap((r) => (r.bookableBy === 'bed' && expanded[r.id] !== false) ? [{ room: r, head: true }, ...r.beds.map((b) => ({ room: r, bed: b }))] : [{ room: r, head: true, whole: true }]);
  const cols = `160px repeat(${days}, minmax(64px,1fr))`;
  const barsFor = (row) => state.stays.filter((s) => s.roomId === row.room.id && s.status !== 'cancelled' && s.status !== 'no_show' && s.status !== 'quote' && (row.whole ? true : row.bed ? s.bedId === row.bed.id || row.room.bookableBy === 'room' : false) && s.start < addDays(from, days) && (!s.end || s.end > from));
  return (
    <>
      <PageHead title="Room calendar" sub="Who holds each room and bed over the next two weeks.">
        <div className="seg"><button onClick={() => setFrom(addDays(from, -7))} aria-label="Previous week">‹</button><button onClick={() => setFrom(addDays(TODAY, -3))}>Today</button><button onClick={() => setFrom(addDays(from, 7))} aria-label="Next week">›</button></div>
      </PageHead>
      <section className="card">
        <div className="card-b" style={{ display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>

          <span style={{ flex: 1 }} />
          <div className="legend"><span className="item"><span className="bar inhouse" style={{ position: 'static', width: 26, height: 14 }} />In house</span><span className="item"><span className="bar confirmed" style={{ position: 'static', width: 26, height: 14 }} />Confirmed</span><span className="item"><span className="bar departed" style={{ position: 'static', width: 26, height: 14 }} />Departed</span></div>
        </div>
        <div className="rack"><div className="rack-grid" style={{ gridTemplateColumns: cols }}>
          <div className="rack-head" style={{ position: 'sticky', insetInlineStart: 0, zIndex: 3, textAlign: 'start', paddingInlineStart: 12 }}>Room / bed</div>
          {dates.map((d) => <div key={d} className={`rack-head ${d === TODAY ? 'today' : ''}`}>{f.date(d, { weekday: 'short', timeZone: 'UTC' })}<br /><b className="num">{f.date(d, { day: 'numeric', timeZone: 'UTC' })}</b></div>)}
          {rows.map((row, ri) => {
            const bars = row.head && !row.whole ? [] : barsFor(row);
            return (
              <Fragment key={ri}>
                <div className={`rack-label ${row.bed ? 'bedrow' : ''}`}>
                  {row.head ? <>{row.room.bookableBy === 'bed' && <button className="icon-btn" style={{ width: 24, height: 24 }} aria-label={expanded[row.room.id] === false ? 'Show beds' : 'Hide beds'} onClick={() => setExpanded({ ...expanded, [row.room.id]: expanded[row.room.id] === false })}><Icon name={expanded[row.room.id] === false ? 'chevronEnd' : 'chevron'} size={14} /></button>}<span className="num">{row.room.number}</span><span className="muted" style={{ fontSize: 12, fontWeight: 400 }}>{f.typeName(row.room.type)}</span></> : <>{t('bed')} {row.bed.label}{row.bed.blocked && <Icon name="lock" size={13} />}</>}
                </div>
                <div style={{ gridColumn: `2 / span ${days}`, position: 'relative', display: 'grid', gridTemplateColumns: `repeat(${days}, 1fr)` }}>
                  {dates.map((d) => <div key={d} className="rack-cell" style={{ background: d === TODAY ? 'color-mix(in srgb, var(--accent-soft) 45%, transparent)' : row.bed?.blocked ? 'repeating-linear-gradient(135deg,transparent 0 6px,var(--canvas-deep) 6px 10px)' : undefined }} />)}
                  {bars.map((s) => {
                    const a = Math.max(0, diffDays(from, s.start)); const b = Math.min(days, s.end ? diffDays(from, s.end) : days);

                  })}
                </div>
              </Fragment>
            );
          })}
        </div></div>
      </section>
      {sel && (() => { const p = state.people.find((x) => x.id === sel.personId); return (
        <Drawer title={p.name} subtitle={`${sel.ref}, ${placeOf(state, sel)?.text}`} onClose={() => setSel(null)} footer={<><button className="btn" onClick={() => { setSel(null); go('profile', { personId: p.id }); }}>Profile</button><button className="btn primary" onClick={() => { setSel(null); go('frontdesk', { tab: sel.status === 'in_house' ? 'departures' : 'arrivals' }); }}>Open at front desk</button></>}>

          <div className="notice"><Icon name="move" />Moving a stay to another room or bed, extending it and shortening it are planned for this drawer.</div>
        </Drawer>); })()}
    </>
  );

function People({ params }) {

  const byFloor = floors.map((fl) => { const s = rooms.filter((r) => r.floor === fl).map((r) => roomSummary(state, r)); const tot = s.reduce((a, x) => a + x.total - x.blocked, 0); const tk = s.reduce((a, x) => a + x.taken, 0); return { label: `${t('floor')} ${fl}`, value: Math.round((tk / Math.max(1, tot)) * 100), suffix: '%' }; });
  const byType = ROOM_TYPES.map((ty) => { const s = rooms.filter((r) => r.type === ty.id).map((r) => roomSummary(state, r)); return { label: f.typeName(ty.id), value: s.reduce((a, x) => a + x.empty, 0), suffix: ' empty beds' }; }).filter((x) => rooms.some((r) => f.typeName(r.type) === x.label));
  const past = Array.from({ length: 30 }, (_, i) => { const d = addDays(TODAY, i - 29); return { label: f.date(d), value: Math.round(70 + 12 * Math.sin(i / 4) + (i > 20 ? 5 : 0)) }; });
  const revenue = [['Rent and room nights', 842000], ['Deposits', 96000], ['Laundry', 18400], ['Breakfast', 12600], ['Damage', 4200]].map(([label, value]) => ({ label, value }));
  return (
