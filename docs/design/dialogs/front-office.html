<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Front office</title><style>
:root{--ink:#0b3d33;--deep:#082f28;--primary:#12544b;--accent:#0f6e56;--tint:#dbe5e3;--mint:#eef3f1;--line:#d3dcd9;--mute:#5d6f6a;--bg:#eef1f0;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Hoefler Text",Georgia,serif;--sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
.page{max-width:1000px;margin:0 auto;padding:56px 24px 96px}
h1{font-size:clamp(2.2rem,5vw,3.2rem);line-height:1.05;font-weight:500;letter-spacing:-.03em;margin:0 0 14px}
.intro{max-width:66ch;color:var(--mute);margin:0 0 24px}
.shots{display:grid;gap:28px}.shot{margin:0}.shot figcaption{font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
.stage{background:#c9d3d0;border-radius:20px;padding:44px 24px;display:flex;justify-content:center;overflow-x:auto}
.mono{font:500 11.5px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase}

.dlg{background:#fff;border-radius:28px;box-shadow:0 1px 2px rgba(8,47,40,.1),0 30px 70px -16px rgba(8,47,40,.35);overflow:hidden;flex:none;corner-shape:squircle}
.hd{position:relative;background:var(--tint);padding:24px 32px 30px;min-height:206px;overflow:hidden}
.hd-top{display:flex;justify-content:space-between;align-items:center}.eb{color:var(--primary)}
.x{display:grid;place-items:center;width:34px;height:34px;border-radius:999px;background:rgba(255,255,255,.6);color:var(--ink);position:relative;z-index:2}
.name{margin:34px 0 0;position:relative;z-index:1;max-width:58%}
.meta{margin:12px 0 0;color:#3f5a53;position:relative;z-index:1}
.art{position:absolute;right:20px;bottom:-26px;transform:rotate(-6deg)}.art img{display:block;width:150px;height:150px}
.ed .name{font:italic 400 52px/1 var(--serif);letter-spacing:-.02em}

.bd{padding:6px 32px 8px}
.sec{padding:22px 0;border-bottom:1px solid var(--line);display:grid;gap:12px}.sec:last-child{border-bottom:0}
.sec h4{margin:0;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;letter-spacing:-.005em}
.hint{margin:0;color:var(--mute);font-size:13px}
.rt{font:500 10.5px var(--mono);letter-spacing:.08em;fill:#5d6f6a}.rt.now{fill:#0b3d33;font-weight:700}
.ruler{display:block;overflow:visible}
.ledger{display:grid}.ln{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);color:var(--mute)}.ln b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-top:18px}.total>div{display:grid;gap:8px}.total .mono{color:var(--mute)}
.num{display:block;font-variant-numeric:tabular-nums;line-height:.95;color:var(--ink)}.num small{font-size:.42em;letter-spacing:0;color:#7d8f89}
.ed .num{font:300 76px/.95 var(--serif);letter-spacing:-.04em}.ed .num small{font-family:var(--serif);font-size:30px}
.side{text-align:right;color:var(--mute);margin:0}
.chk{display:flex;gap:14px;align-items:flex-start}.box{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--ink);margin-top:1px}
.ft{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 32px 30px;border-top:1px solid var(--line)}
.lnk{display:inline-flex;gap:5px;align-items:center;font-weight:500;color:var(--accent);text-decoration:underline;text-underline-offset:5px}
.act{display:flex;align-items:center;gap:22px;margin-inline-start:auto;white-space:nowrap;flex:none}.txt{font-weight:500}
.cta{display:inline-flex;align-items:center;gap:14px;height:54px;padding:0 7px 0 26px;border-radius:999px;background:var(--deep);color:#fff;font-weight:600;font-size:16px}
.cta i{display:grid;place-items:center;width:40px;height:40px;border-radius:999px;background:var(--tint);color:var(--deep)}

.sec h4 .q{flex:1}.sec h4 em{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;font-style:normal;padding:3px 8px;border-radius:999px;align-self:center}.sec h4 em.req{background:var(--tint);color:var(--primary)}.sec h4 em.opt{color:var(--mute);border:1px solid var(--line)}
.fld{display:grid;gap:8px}.fl{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:14.5px}
.fl em{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;font-style:normal;padding:3px 8px;border-radius:999px}
.fl em.req{background:var(--tint);color:var(--primary)}.fl em.opt{color:var(--mute);border:1px solid var(--line)}
.inp{display:flex;align-items:center;min-height:50px;padding:0 16px;border:1.5px solid #b3c2bd;border-radius:14px;background:#fff}
.inp.ta{align-items:flex-start;min-height:92px;padding:14px 16px}.inp.focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(18,84,75,.14)}
.ph{color:#7a8c86}
.sugg{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sugg .mono{color:var(--mute);margin-inline-end:2px}
.sugg span:not(.mono),.seg span{padding:8px 14px;border-radius:999px;border:1.5px solid #b3c2bd;font-size:14px;font-weight:500;background:#fff}
.seg{display:flex;flex-wrap:wrap;gap:8px}.seg span{display:inline-flex;align-items:center;gap:6px}.seg span.on{background:var(--deep);border-color:var(--deep);color:#fff}
.units{display:grid;gap:8px}.search{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;border:1.5px solid #b3c2bd;border-radius:14px;color:var(--mute)}
.u{display:grid;grid-template-columns:auto 56px 1fr auto;align-items:center;gap:12px;padding:12px 16px;border:1.5px solid var(--line);border-radius:14px}
.u b{font-size:20px;font-variant-numeric:tabular-nums}.u .ut{color:var(--mute)}.u.on{border-color:var(--primary);background:var(--mint);box-shadow:0 0 0 3px rgba(18,84,75,.12)}.u.on .ut{color:var(--ink)}
.radio{width:20px;height:20px;border-radius:999px;border:1.5px solid #8fa39d;display:block}.u.on .radio{border:6px solid var(--primary);background:#fff}
.free{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;font-style:normal;padding:3px 9px;border-radius:999px;background:var(--tint);color:var(--primary)}
.more{margin:2px 0 0;color:var(--mute);font-size:13px}
.chk{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1.5px solid #b3c2bd;border-radius:14px}.chk b{font-weight:600}.box{width:24px;height:24px;border-radius:8px}
.total .lnk{align-self:flex-end}
.todo{color:var(--mute);font-size:13.5px;min-width:0}
.cta.off{background:#c5d0cc;color:#fff}.cta.off i{background:#e4eae8;color:#9fb0ab}

.bd.simple{display:grid;gap:18px;padding:26px 32px 26px}
.settled{display:flex;gap:16px;align-items:center;padding:4px 0}.settled b{display:block;font-size:18px;font-weight:600}.settled span:not(.ok){color:var(--mute)}
.ok{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:999px;background:var(--tint);color:var(--primary)}
.due{display:grid;gap:10px}.due .mono{color:var(--mute)}.due .cap{margin:0;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.chk.slim{padding:14px 16px;border-radius:14px;align-items:center}
.co .ft{padding-top:18px}

.back{margin:0 0 18px;font-size:14px}.back a{color:var(--accent);text-underline-offset:4px}
.sec:has(> h4){gap:12px}
.bd.simple .sec{border-bottom:0;padding:0}
.ico{display:inline-flex;margin-inline-end:10px;color:var(--mute)}
.inp.sel,.inp.daterange{justify-content:space-between}.inp.daterange{gap:12px;justify-content:flex-start}.inp.daterange .to{margin-inline:auto;color:var(--mute);display:inline-flex}
.cols{display:grid;gap:16px}.cols.c2{grid-template-columns:1fr 1fr}.cols.c3{grid-template-columns:repeat(3,1fr)}
.box.on{background:var(--primary);border-color:var(--primary);color:#fff;display:grid;place-items:center}
.tgl{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px}
.tgl b{display:block;font-weight:600}.tgl span:not(.sw){display:block;color:var(--mute);font-size:13.5px}
.sw{flex:none;width:44px;height:26px;border-radius:999px;background:#c5d0cc;position:relative}.sw:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--primary)}.sw.on:after{left:21px}
.ban{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--mint);border:1px solid #dbe5e1}
.ban .ic{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:999px;background:var(--tint);color:var(--primary)}.ban p{margin:3px 0 0;font-size:14px}
.ln.tot{border-bottom:0;border-top:2px solid var(--ink);color:var(--ink);font-weight:600;padding-top:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-align:start;padding:8px 10px 8px 0;border-bottom:1.5px solid var(--ink)}
.tbl td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.chp{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--primary);font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.cta.danger{background:#fff;color:#a32626;box-shadow:inset 0 0 0 1.5px #d9a3a3}.cta.danger i{background:#f6e3e3;color:#a32626}
.stage.sheetstage{padding:0;justify-content:flex-end;min-height:760px;align-items:stretch}
.sheetdlg{border-radius:28px 0 0 28px;display:flex;flex-direction:column;box-shadow:-24px 0 60px -20px rgba(8,47,40,.35)}.sheetdlg .bd{flex:1}
.sheetdlg .hd{min-height:170px}
@media (max-width:640px){.cols.c2,.cols.c3{grid-template-columns:1fr}}
.shots{display:grid;gap:36px}
.hd .meta{max-width:58%}
.bd:not(.simple)>.ban:first-child{margin-top:20px}
.lnk{white-space:nowrap}
</style></head><body><div class="page"><p class="back"><a href="index.html">All dialogs</a></p><h1>Front office</h1><p class="intro">Every dialog a front-desk member opens from Arrivals, Departures, Today and the room calendar. Each shows only what applies to its state.</p><div class="shots"><figure class="shot"><figcaption>Check out, the usual case: leaving on the day, nothing owed</figcaption><div class="stage"><div class="dlg ed " style="width:580px"><header class="hd"><div class="hd-top"><span class="mono eb">Check out</span><span class="x"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div><h3 class="name">Mei Lin</h3><p class="mono meta">UNIT 204 · LEAVES TODAY</p><div class="art"><img src="data:image/svg+xml;base64,PHN2ZyB2ZXJzaW9uPSIxLjEiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIgdmlld0JveD0iMTc2IDIwMiAxNTk4IDE1ODIiPgo8cGF0aCB0cmFuc2Zvcm09InRyYW5zbGF0ZSgwLDApIiBmaWxsPSJyZ2IoMTEsNzMsNTcpIiBkPSJNIDEyNzcuNzcgMjI3LjQyNiBDIDEyODMuNDIgMjI3LjExNiAxMjkwLjkyIDIyNi45OTcgMTI5Ni42IDIyNy4wNjQgQyAxMzc3LjcgMjI3LjkyOCAxNDU1LjE1IDI2MC45NTggMTUxMS45MSAzMTguODk1IEMgMTU2Ny4yMSAzNzUuNDMyIDE1OTcuNTkgNDUxLjc0MSAxNTk2LjI4IDUzMC44MTQgQyAxNTk1LjE0IDYxMC4wMzUgMTU2Mi44MyA2ODUuNjE0IDE1MDYuMzUgNzQxLjE3NyBDIDE0NDYuNTYgNzk5LjQ3NiAxMzcwLjE5IDgyOC42ODYgMTI4Ny4wNCA4MjcuODY5IEMgMTI3Ny4xMyA4NDEuNTAyIDEyNjEuNDQgODU3LjExMyAxMjQ5LjQxIDg2OS42NjQgQyAxMjg0LjcgODQ5Ljg1MiAxMzI0LjM0IDgzOS4wNjcgMTM2NC44MSA4MzguMjY3IEMgMTQyMi4wNyA4MzYuODUzIDE0ODUuOTEgODU4LjU5MSAxNTI3LjQ3IDg5OS4wNDEgQyAxNTcyLjIxIDk0Mi41OTEgMTYxNS44MiA5ODcuNDc4IDE2NjAuNTIgMTAzMS4wOSBDIDE2ODEuNTIgMTA1MS4yIDE2OTkuOTYgMTA2OC42NCAxNzE1LjM3IDEwOTMuNjQgQyAxNzY3LjM5IDExNzguMDUgMTc1OC4zMyAxMjk4Ljg2IDE2ODguMiAxMzcwLjU1IEMgMTY3MC42MyAxMzg4LjUxIDE2NTEuNDUgMTQwNi4yIDE2MzMuMzcgMTQyNC4xOSBDIDE1ODUuODQgMTQ3MS4zNSAxNTM4LjU2IDE1MTguNzYgMTQ5MS41NCAxNTY2LjQzIEwgMTQwNC44NiAxNjU0LjIyIEMgMTM4MS41NiAxNjc3LjkyIDEzNT
