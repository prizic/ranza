<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today · House map</title>
<style>
:root {
  --canvas: #ffffff;
  --canvas-deep: hsl(170 10% 96%);
  --ink: hsl(170 60% 10%);
  --ink-muted: hsl(170 5% 45%);
  --accent: hsl(172 65% 20%);
  --accent-soft: hsl(38 60% 95%);
  --surface: #ffffff;
  --success: #176842; --success-soft: #dcefe3;
  --warning: #8a5a08; --warning-soft: #f7e8c8;
  --danger: #a33a35; --danger-soft: #f5dfdd;
  --info: #315f83; --info-soft: #dfeaf2;
  --line: hsl(170 10% 90%);
  --line-strong: hsl(170 10% 80%);
  --shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
  --shadow-low: 0 4px 14px rgba(10, 41, 36, 0.04);
  --font: "Geist", ui-sans-serif, -apple-system, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--canvas); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
.ic { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { max-width: 1480px; margin: 0 auto; padding: 0 40px 56px; }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }
.num { font-weight: 300; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 0.9; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.crumbs { display: flex; gap: 10px; padding: 18px 0; border-bottom: 1px solid var(--line); margin: 0 -40px; padding-inline: 40px; }
.crumbs b { color: var(--ink); font-weight: 600; }
.crumbs .eyebrow { letter-spacing: .1em; }

.hdr { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; padding: 36px 0 28px; }
.hdr h1 { font-size: 40px; font-weight: 300; letter-spacing: -0.03em; line-height: 1.05; margin-top: 14px; }
.hdr h1 b { font-weight: 600; }
.hdr .right { display: flex; align-items: flex-end; gap: 28px; }
.clock { text-align: right; }
.clock .num { font-size: 60px; display: block; }
.clock .eyebrow { margin-top: 8px; display: block; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 9px 18px; font-weight: 500; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--canvas-deep); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: hsl(172 65% 15%); }
.btn.sm { padding: 6px 13px; font-size: 13px; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn:focus-visible, .chip:focus-visible, .tile:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow-low); }
.badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 9px 3px 7px; font-size: 12px; font-weight: 500; line-height: 1.2; white-space: nowrap; }
.badge .ic { font-size: 12px; }
.b-ready { background: var(--success-soft); color: var(--success); }
.b-inspection { background: var(--warning-soft); color: var(--warning); }
.b-dirty { background: var(--danger-soft); color: var(--danger); }
.b-oos { background: var(--canvas-deep); color: var(--ink-muted); }
.b-occupied { background: var(--accent); color: #fff; }
.b-info { background: var(--info-soft); color: var(--info); }
.b-late { background: var(--danger); color: #fff; }

.hatch-dirty { background-image: repeating-linear-gradient(135deg, transparent 0 7px, rgba(163, 58, 53, .1) 7px 9px); }
.hatch-oos { background-image: repeating-linear-gradient(45deg, transparent 0 7px, rgba(60, 80, 76, .1) 7px 9px); }

.night { --canvas: hsl(170 40% 6%); --canvas-deep: hsl(170 25% 11%); --ink: hsl(40 35% 93%); --ink-muted: hsl(170 8% 62%);
  --surface: hsl(170 30% 9%); --line: hsl(170 18% 17%); --line-strong: hsl(170 15% 26%); --accent: hsl(152 52% 62%);
  --success: hsl(152 52% 62%); --success-soft: hsl(152 40% 16%); --warning: hsl(38 75% 66%); --warning-soft: hsl(38 40% 16%);
  --danger: hsl(6 70% 68%); --danger-soft: hsl(6 35% 17%); --info: hsl(205 55% 70%); --info-soft: hsl(205 35% 16%);
  --shadow-low: none; }
.night .btn.primary { color: hsl(170 60% 8%); }
.night .btn.primary:hover { background: hsl(152 52% 70%); }
.night .b-occupied { color: hsl(170 60% 8%); }
.night .b-late { color: hsl(170 60% 8%); }
.night .btn.danger { color: hsl(170 60% 8%); }

.hdr h1 { font-size: 34px; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
.fchip { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 12px 20px 12px 16px; text-align: start; min-width: 150px; transition: border-color .15s, background .15s; }
.fchip:hover { border-color: var(--line-strong); }
.fchip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.fchip .num { font-size: 40px; }
.fchip .t { font-size: 13px; line-height: 1.25; color: var(--ink-muted); }
.fchip .t b { display: block; color: var(--ink); font-weight: 600; font-size: 13.5px; }
.fchip .dot { width: 10px; height: 34px; border-radius: 5px; }
.main { display: grid; grid-template-columns: 1fr 380px; gap: 24px; align-items: start; }
.map { padding: 28px 28px 20px; }
.map-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
.map-head h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.map-head p { color: var(--ink-muted); font-size: 13px; }
.floor { display: grid; grid-template-columns: 64px 1fr; gap: 10px; margin-bottom: 14px; align-items: stretch; }
.floor .eyebrow { padding-top: 6px; }
.floor .rooms { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
.tile { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; min-height: 128px; padding: 10px 11px 10px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); text-align: start; transition: opacity .2s, transform .15s, box-shadow .15s; overflow: hidden; }
.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-low); }
.tile .top { display: flex; justify-content: space-between; align-items: baseline; }
.tile .rn { font-size: 22px; font-weight: 300; letter-spacing: -0.03em; }
.tile .ty { font-size: 10.5px; opacity: .65; white-space: nowrap; }
.tile .who { font-size: 13.5px; font-weight: 600; line-height: 1.2; }
.tile .st { display: flex; align-items: center; gap: 5px; font-size: 11.5px; line-height: 1.2; }
.tile .st .ic { font-size: 13px; }
.tile .mv { min-height: 20px; }
.tile.st-occupied { background: var(--accent); border-color: var(--accent); color: #fff; }
.tile.st-ready { border-color: color-mix(in srgb, var(--success) 45%, white); }
.tile.st-ready .st { color: var(--success); }
.tile.st-inspection { background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 40%, white); }
.tile.st-inspection .st { color: var(--warning); }
.tile.st-dirty { background-color: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 40%, white); background-image: repeating-linear-gradient(135deg, transparent 0 8px, rgba(163, 58, 53, .1) 8px 10px); }
.tile.st-dirty .st { color: var(--danger); }
.tile.st-oos { background-color: var(--canvas-deep); border-color: var(--line-strong); border-style: dashed; color: var(--ink-muted); background-image: repeating-linear-gradient(45deg, transparent 0 8px, rgba(60, 80, 76, .1) 8px 10px); }
.tile.overdue::after { content: ""; position: absolute; inset-inline: 0; bottom: 0; height: 5px; background: var(--danger); }
.tile.overdue .st { color: #ffd9d6; font-weight: 600; }
.tile .tag { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; font: 600 11px var(--mono); border-radius: 999px; padding: 2px 7px; background: var(--accent-soft); color: var(--accent); }
.st-occupied .tag { background: rgba(255,255,255,.18); color: #fff; }
.tile.dim { opacity: .28; }
.tile.sel { outline: 3px solid var(--ink); outline-offset: 2px; }
.tile.can { outline: 2px dashed var(--success); outline-offset: 2px; }
.tile.can .who { color: var(--success); }
.keys { display: flex; gap: 22px; padding-top: 14px; border-top: 1px solid var(--line); margin-top: 6px; color: var(--ink-muted); font-size: 12.5px; flex-wrap: wrap; }
.keys span { display: inline-flex; align-items: center; gap: 7px; }

.col { display: flex; flex-direction: column; gap: 20px; position: sticky; top: 20px; }
.detail { padding: 26px 26px 22px; }
.detail h2 { font-size: 30px; font-weight: 300; letter-spacing: -0.03em; line-height: 1.1; margin: 12px 0 4px; }
.detail h2 b { font-weight: 600; }
.detail .lead { color: var(--ink-muted); font-size: 14px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin: 20px 0; padding: 18px 0; border-block: 1px solid var(--line); }
.facts dt { font: 500 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 4px; }
.facts dd { font-size: 15px; font-weight: 500; }
.facts dd.bad { color: var(--danger); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.hint { margin-top: 12px; font-size: 12.5px; color: var(--ink-muted); }
.lists { padding: 20px 8px 8px; }
.lists h3 { padding: 0 20px 6px; display: flex; justify-content: space-between; align-items: baseline; }
.lists h3 b { font-size: 15px; font-weight: 600; }
.row { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: start; border: 0; background: transparent; padding: 9px 20px; border-radius: 14px; }
.row:hover { background: var(--canvas-deep); }
.row[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.row .t { font: 600 13px var(--mono); }
.row .n { font-size: 14px; font-weight: 500; line-height: 1.25; }
.row .n small { display: block; color: var(--ink-muted); font-weight: 400; font-size: 12.5px; }
.row.late .t { color: var(--danger); }
.gap { height: 12px; }
@media (max-width: 1180px) { .main { grid-template-columns: 1fr; } .col { position: static; } .floor .rooms { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-in" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-bed" viewBox="0 0 24 24"><path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 2.7l5.7 5.7a8 8 0 1 1-11.4 0z"/></symbol>
  <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
</svg>

<div class="wrap">
  <div class="crumbs"><span class="eyebrow">Workspace</span><span class="eyebrow">›</span><b>Today</b></div>
  <header class="hdr">
    <div>
      <div class="eyebrow">Monday · 19 October 2026</div>
      <h1>Good afternoon, <b>Demo Front Desk</b></h1>
    </div>
    <div class="right">
      <div class="clock"><span class="num" style="font-size:48px">14:32</span><span class="eyebrow">Türkiye standard time</span></div>
      <button class="btn primary"><svg class="ic"><use href="#i-plus"/></svg>New booking</button>
    </div>
  </header>

  <div class="filters" id="filters" role="group" aria-label="Filter the map"></div>

  <div class="main">
    <section class="panel map" aria-labelledby="map-h">
      <div class="map-head"><h2 id="map-h">The house</h2><p>Select a room, or a guest on the right, and the map answers.</p></div>
      <div id="map"></div>
      <div class="keys">
        <span><svg class="ic"><use href="#i-bed"/></svg>In house</span>
        <span><svg class="ic" style="color:var(--success)"><use href="#i-check"/></svg>Ready</span>
        <span><svg class="ic" style="color:var(--warning)"><use href="#i-eye"/></svg>Clean, awaiting inspection</span>
        <span><svg class="ic" style="color:var(--danger)"><use href="#i-drop"/></svg>Dirty (hatched)</span>
        <span><svg class="ic"><use href="#i-wrench"/></svg>Out of service (dashed)</span>
      </div>
    </section>
    <div class="col">
      <section class="panel detail" id="detail" aria-live="polite"></section>
      <section class="panel lists">
        <h3><b>Still to arrive</b><span class="eyebrow" id="a-count"></span></h3>
        <div id="arrivals"></div>
        <div class="gap"></div>
        <h3><b>Still to leave</b><span class="eyebrow" id="d-count"></span></h3>
        <div id="departures"></div>
      </section>
    </div>
  </div>
</div>

<script>
const NOW = 14 * 60 + 32;
const hm = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const toMin = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const lira = (n) => "₺" + n.toLocaleString("en-US");
const dur = (m) => (m >= 60 ? Math.floor(m / 60) + "h " : "") + (m % 60 ? (m % 60) + "m" : "");

const ROOMS = [
  ["101","Double","ready"],["102","Double","occupied"],["103","Double","occupied"],["104","Twin","dirty"],
  ["105","Double","ready"],["106","Twin","oos"],["107","Twin","occupied"],["108","Suite","inspection"],
  ["201","Double","inspection"],["202","Double","occupied"],["203","Twin","dirty"],["204","Double","occupied"],
  ["205","Twin","ready"],["206","Suite","occupied"],["207","Double","ready"],["208","Double","ready"],
  ["301","Suite","ready"],["302","Double","occupied"],["303","Twin","occupied"],["304","Double","dirty"],
  ["305","Twin","dirty"],["306","Double","occupied"],["307","Twin","ready"],["308","Suite","occupied"],
].map(([n, type, state]) => ({ n, type, state, floor: n[0] }));
const room = (n) => ROOMS.find((r) => r.n === n);

const STATE_LABEL = {
  occupied: "In house", ready: "Ready", inspection: "Clean, awaiting inspection",
  dirty: "Dirty", oos: "Out of service",
};
const STATE_ICON = { occupied: "i-bed", ready: "i-check", inspection: "i-eye", dirty: "i-drop", oos: "i-wrench" };

const STAYS = [
  { room: "102", guest: "Yılmaz", out: "Oct 21" },
  { room: "103", guest: "Kaya", out: "12:00", today: true, owes: 1240 },
  { room: "107", guest: "Rossi", out: "Oct 22" },
  { room: "202", guest: "Haddad", out: "Oct 20" },
  { room: "204", guest: "Novak", out: "15:00", today: true, owes: 0 },
  { room: "206", guest: "Tanaka", out: "Oct 23" },
  { room: "302", guest: "Okonkwo", out: "17:00", today: true, owes: 380 },
  { room: "303", guest: "Fischer", out: "Oct 21", arrivedAt: "13:05" },
  { room: "306", guest: "Bauer", out: "Oct 21" },
  { room: "308", guest: "Singh", out: "Oct 24" },
];
const stay = (n) => STAYS.find((s) => s.room === n);

const ARRIVALS = [
  { guest: "Fischer", room: "303", eta: "13:05", done: true, nights: 2, pax: 2, code: "KT4M9XA", type: "Twin" },
  { guest: "Costa", room: "205", eta: "14:00", nights: 3, pax: 2, code: "W2PQ7LD", type: "Twin" },
  { guest: "Lindqvist", room: "105", eta: "15:30", nights: 3, pax: 2, code: "RJY1FR2", type: "Double" },
  { guest: "Demir", room: "201", eta: "16:00", nights: 2, pax: 1, code: "H8ZC3NB", type: "Double" },
  { guest: "Hughes", room: "301", eta: "18:00", nights: 4, pax: 2, code: "Q5VD6EK", type: "Suite" },
  { guest: "Moreau", room: "305", eta: "20:30", nights: 1, pax: 1, code: "B7NX2UT", type: "Twin" },
  { guest: "Petrov", room: "208", eta: null, nights: 2, pax: 2, code: "M3GA8SW", type: "Double" },
];

const DEPARTURES = [
  { guest: "Okafor", room: "203", at: "11:00", doneAt: "09:50", done: true, owes: 0 },
  { guest: "Silva", room: "304", at: "12:00", doneAt: "11:20", done: true, owes: 0 },
  { guest: "Brandt", room: "104", at: "12:00", doneAt: "11:40", done: true, owes: 0 },
  { guest: "Kaya", room: "103", at: "12:00", owes: 1240 },
  { guest: "Novak", room: "204", at: "15:00", owes: 0 },
  { guest: "Okonkwo", room: "302", at: "17:00", owes: 380 },
];

const COUNTS = ROOMS.reduce((c, r) => ((c[r.state] = (c[r.state] || 0) + 1), c), {});
const SELLABLE = ROOMS.length - COUNTS.oos;
const TONIGHT = 13;

const $ = (s) => document.querySelector(s);
const ic = (id) => `<svg class="ic"><use href="#${id}"/></svg>`;
const pendingArr = ARRIVALS.filter((a) => !a.done);
const pendingDep = DEPARTURES.filter((d) => !d.done);
const assigned = Object.fromEntries(pendingArr.map((a) => [a.room, a]));
let filter = null, sel = { kind: "arrival", key: "205" };

const FILTERS = [
  ["occupied", COUNTS.occupied, "In house", "var(--accent)"],
  ["ready", COUNTS.ready, "Ready", "var(--success)"],
  ["inspection", COUNTS.inspection, "Awaiting inspection", "var(--warning)"],
  ["dirty", COUNTS.dirty, "Dirty", "var(--danger)"],
  ["oos", COUNTS.oos, "Out of service", "var(--line-strong)"],
  ["arriving", pendingArr.length, "Still to arrive", "var(--info)"],
  ["leaving", pendingDep.length, "Still to leave", "var(--info)"],
];

function matchesFilter(r) {
  if (!filter) return true;
  if (filter === "arriving") return !!assigned[r.n];
  if (filter === "leaving") return pendingDep.some((d) => d.room === r.n);
  return r.state === filter;
}

function eligible(a) {
  return ROOMS.filter((r) => r.state === "ready" && r.type === a.type && !assigned[r.n]).map((r) => r.n);
}

function tile(r) {
  const s = stay(r.n), a = assigned[r.n], dep = pendingDep.find((d) => d.room === r.n);
  const overdue = dep && toMin(dep.at) < NOW;
  let who = "", mv = "";
  if (s) who = s.guest; else if (a) who = a.guest; else who = "";
  if (a) mv = `<span class="tag">${ic("i-in")}${a.eta || "no time"}</span>`;
  if (dep) mv = `<span class="tag">${ic("i-out")}${dep.at}</span>`;
  const stText = overdue ? `Overdue ${dur(NOW - toMin(dep.at))}` : STATE_LABEL[r.state].replace("Clean, awaiting inspection", "Awaiting inspection");
  const cls = ["tile", "st-" + r.state, overdue ? "overdue" : "", matchesFilter(r) ? "" : "dim"];
  if (sel.kind === "room" && sel.key === r.n) cls.push("sel");
  if (sel.kind === "arrival") {
    const sa = ARRIVALS.find((x) => x.room === sel.key);
    if (r.n === sa.room) cls.push("sel");
    else if (eligible(sa).includes(r.n)) cls.push("can");
    else cls.push("dim");
  }
  if (cls.includes("can")) who = "Can take";
  if (sel.kind === "departure" && r.n !== sel.key) cls.push("dim");
  if (sel.kind === "departure" && r.n === sel.key) cls.push("sel");
  return `<button class="${cls.join(" ")}" data-room="${r.n}" aria-label="Room ${r.n}, ${STATE_LABEL[r.state]}">
    <span class="top"><span class="rn">${r.n}</span><span class="ty">${r.type}</span></span>
    <span class="mv">${mv}</span>
    <span class="who">${who || "&nbsp;"}</span>
    <span class="st">${ic(STATE_ICON[r.state])}${stText}</span></button>`;
}

function renderMap() {
  $("#map").innerHTML = ["3", "2", "1"].map((f) => `<div class="floor"><span class="eyebrow">Floor ${f}</span><div class="rooms">${ROOMS.filter((r) => r.floor === f).map(tile).join("")}</div></div>`).join("");
}

function renderFilters() {
  $("#filters").innerHTML = FILTERS.map(([k, n, t, c]) => `<button class="fchip" data-f="${k}" aria-pressed="${filter === k}"><span class="dot" style="background:${c}"></span><span class="num">${n}</span><span class="t"><b>${t}</b></span></button>`).join("");
}

function renderLists() {
  $("#a-count").textContent = pendingArr.length + " of " + ARRIVALS.length;
  $("#d-count").textContent = pendingDep.length + " of " + DEPARTURES.length;
  $("#arrivals").innerHTML = pendingArr.map((a) => {
    const late = a.eta && toMin(a.eta) < NOW;
    const s = room(a.room).state;
    const sub = s === "ready" ? "Room " + a.room + " ready" : s === "inspection" ? "Room " + a.room + " awaiting inspection" : "Room " + a.room + " dirty";
    return `<button class="row ${late ? "late" : ""}" data-arr="${a.room}" aria-pressed="${sel.kind === "arrival" && sel.key === a.room}"><span class="t">${a.eta || "—:—"}</span><span class="n">${a.guest}<small>${late ? dur(NOW - toMin(a.eta)) + " late · " : ""}${sub}</small></span>${s === "ready" ? `<span class="badge b-ready">${ic("i-check")}Ready</span>` : s === "inspection" ? `<span class="badge b-inspection">${ic("i-eye")}Inspect</span>` : `<span class="badge b-dirty">${ic("i-drop")}Dirty</span>`}</button>`;
  }).join("");
  $("#departures").innerHTML = pendingDep.map((d) => {
    const over = toMin(d.at) < NOW;
    return `<button class="row ${over ? "late" : ""}" data-dep="${d.room}" aria-pressed="${sel.kind === "departure" && sel.key === d.room}"><span class="t">${d.at}</span><span class="n">${d.guest}<small>${over ? dur(NOW - toMin(d.at)) + " overdue · " : ""}Room ${d.room}</small></span>${d.owes ? `<span class="badge ${over ? "b-late" : "b-inspection"}">${lira(d.owes)}</span>` : `<span class="badge b-ready">${ic("i-check")}Paid up</span>`}</button>`;
  }).join("");
}

function renderDetail() {
  let h = "";
  if (sel.kind === "arrival") {
    const a = ARRIVALS.find((x) => x.room === sel.key), r = room(a.room), alt = eligible(a);
    const late = a.eta && toMin(a.eta) < NOW, ok = r.state === "ready";
    h = `<span class="eyebrow">Arrival · ${a.code}</span>
      <h2><b>${a.guest}</b> to Room ${a.room}</h2>
      <p class="lead">${late ? `<span style="color:var(--danger);font-weight:600">${dur(NOW - toMin(a.eta))} late.</span> ` : ""}${a.nights} nights · ${a.pax} guest${a.pax > 1 ? "s" : ""} · booked ${a.type}</p>
      <dl class="facts"><div><dt>Expected</dt><dd>${a.eta || "No time set"}</dd></div><div><dt>Room ${a.room}</dt><dd class="${ok ? "" : "bad"}">${ok ? "Ready" : STATE_LABEL[r.state]}</dd></div></dl>
      <div class="acts"><button class="btn primary">${ic("i-in")}Check in</button>${ok ? "" : `<button class="btn">${ic("i-eye")}Open Housekeeping</button>`}<button class="btn">Change room</button></div>
      <p class="hint">${ok ? "Nothing blocks this check-in." : `Room ${a.room} is not ready. ` + (alt.length ? `Ready ${a.type.toLowerCase()} rooms on the map: ${alt.join(", ")}.` : "No other ready " + a.type.toLowerCase() + " room.")}</p>`;
  } else if (sel.kind === "departure") {
    const d = DEPARTURES.find((x) => x.room === sel.key), over = toMin(d.at) < NOW;
    h = `<span class="eyebrow">Departure · Room ${d.room}</span>
      <h2><b>${d.guest}</b> leaves ${d.at}</h2>
      <p class="lead">${over ? `<span style="color:var(--danger);font-weight:600">${dur(NOW - toMin(d.at))} overdue.</span>` : "Due in " + dur(toMin(d.at) - NOW) + "."}</p>
      <dl class="facts"><div><dt>Folio balance</dt><dd class="${d.owes ? "bad" : ""}">${d.owes ? lira(d.owes) + " owed" : "Nothing owed"}</dd></div><div><dt>Then</dt><dd>Room goes dirty</dd></div></dl>
      <div class="acts"><button class="btn primary">${ic("i-out")}${d.owes ? "Collect and check out" : "Check out"}</button><button class="btn">Open folio</button></div>`;
  } else {
    const r = room(sel.key), s = stay(r.n);
    const next = { inspection: "Mark inspected", dirty: "Mark clean", ready: "", oos: "Open maintenance", occupied: "" }[r.state];
    h = `<span class="eyebrow">Room ${r.n} · ${r.type} · Floor ${r.floor}</span>
      <h2>${s ? `<b>${s.guest}</b> in house` : STATE_LABEL[r.state]}</h2>
      <p class="lead">${s ? "Leaves " + s.out + (s.today ? " today" : "") : r.state === "ready" ? "Can be sold now." : r.state === "oos" ? "Air conditioning. Not sellable." : "Not sellable until it is ready."}</p>
      <div class="acts" style="margin-top:20px">${next ? `<button class="btn primary">${next}</button>` : ""}${s ? `<button class="btn">Open folio</button>` : `<button class="btn">New booking</button>`}</div>`;
  }
  $("#detail").innerHTML = h;
}

function render() { renderFilters(); renderMap(); renderLists(); renderDetail(); }

document.addEventListener("click", (e) => {
  const f = e.target.closest("[data-f]"); if (f) { filter = filter === f.dataset.f ? null : f.dataset.f; }
  const t = e.target.closest("[data-room]");
  if (t) { sel = assigned[t.dataset.room] ? { kind: "arrival", key: t.dataset.room } : { kind: "room", key: t.dataset.room }; }
  const a = e.target.closest("[data-arr]"); if (a) sel = { kind: "arrival", key: a.dataset.arr };
  const d = e.target.closest("[data-dep]"); if (d) sel = { kind: "departure", key: d.dataset.dep };
  if (f || t || a || d) render();
});
render();
</script>
</body>
</html>
