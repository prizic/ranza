<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Today · Next up</title>
    <style>
      :root {
        --canvas: #ffffff;
        --canvas-deep: hsl(170 10% 96%);
        --ink: hsl(170 60% 10%);
        --ink-muted: hsl(170 5% 45%);
        --accent: hsl(172 65% 20%);
        --accent-soft: hsl(38 60% 95%);
        --surface: #ffffff;
        --success: #176842;
        --success-soft: #dcefe3;
        --warning: #8a5a08;
        --warning-soft: #f7e8c8;
        --danger: #a33a35;
        --danger-soft: #f5dfdd;
        --info: #315f83;
        --info-soft: #dfeaf2;
        --line: hsl(170 10% 90%);
        --line-strong: hsl(170 10% 80%);
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
        --shadow-low: 0 4px 14px rgba(10, 41, 36, 0.04);
        --font:
          "Geist", ui-sans-serif, -apple-system, "SF Pro Display", "Segoe UI",
          system-ui, sans-serif;
        --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--canvas);
        color: var(--ink);
        font: 14px/1.45 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .ic {
        width: 1em;
        height: 1em;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .wrap {
        max-width: 1480px;
        margin: 0 auto;
        padding: 0 40px 56px;
      }
      .eyebrow {
        font: 500 11px/1 var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .num {
        font-weight: 300;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
        line-height: 0.9;
      }
      .mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }

      .crumbs {
        display: flex;
        gap: 10px;
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
        margin: 0 -40px;
        padding-inline: 40px;
      }
      .crumbs b {
        color: var(--ink);
        font-weight: 600;
      }
      .crumbs .eyebrow {
        letter-spacing: 0.1em;
      }

      .hdr {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 32px;
        padding: 36px 0 28px;
      }
      .hdr h1 {
        font-size: 40px;
        font-weight: 300;
        letter-spacing: -0.03em;
        line-height: 1.05;
        margin-top: 14px;
      }
      .hdr h1 b {
        font-weight: 600;
      }
      .hdr .right {
        display: flex;
        align-items: flex-end;
        gap: 28px;
      }
      .clock {
        text-align: right;
      }
      .clock .num {
        font-size: 60px;
        display: block;
      }
      .clock .eyebrow {
        margin-top: 8px;
        display: block;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line-strong);
        background: var(--surface);
        border-radius: 999px;
        padding: 9px 18px;
        font-weight: 500;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .btn:hover {
        background: var(--canvas-deep);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .btn.primary:hover {
        background: hsl(172 65% 15%);
      }
      .btn.sm {
        padding: 6px 13px;
        font-size: 13px;
      }
      .btn.danger {
        background: var(--danger);
        border-color: var(--danger);
        color: #fff;
      }
      .btn:focus-visible,
      .chip:focus-visible,
      .tile:focus-visible,
      .row:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow-low);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 999px;
        padding: 3px 9px 3px 7px;
        font-size: 12px;
        font-weight: 500;
        line-height: 1.2;
        white-space: nowrap;
      }
      .badge .ic {
        font-size: 12px;
      }
      .b-ready {
        background: var(--success-soft);
        color: var(--success);
      }
      .b-inspection {
        background: var(--warning-soft);
        color: var(--warning);
      }
      .b-dirty {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .b-oos {
        background: var(--canvas-deep);
        color: var(--ink-muted);
      }
      .b-occupied {
        background: var(--accent);
        color: #fff;
      }
      .b-info {
        background: var(--info-soft);
        color: var(--info);
      }
      .b-late {
        background: var(--danger);
        color: #fff;
      }

      .hatch-dirty {
        background-image: repeating-linear-gradient(
          135deg,
          transparent 0 7px,
          rgba(163, 58, 53, 0.1) 7px 9px
        );
      }
      .hatch-oos {
        background-image: repeating-linear-gradient(
          45deg,
          transparent 0 7px,
          rgba(60, 80, 76, 0.1) 7px 9px
        );
      }

      .night {
        --canvas: hsl(170 40% 6%);
        --canvas-deep: hsl(170 25% 11%);
        --ink: hsl(40 35% 93%);
        --ink-muted: hsl(170 8% 62%);
        --surface: hsl(170 30% 9%);
        --line: hsl(170 18% 17%);
        --line-strong: hsl(170 15% 26%);
        --accent: hsl(152 52% 62%);
        --success: hsl(152 52% 62%);
        --success-soft: hsl(152 40% 16%);
        --warning: hsl(38 75% 66%);
        --warning-soft: hsl(38 40% 16%);
        --danger: hsl(6 70% 68%);
        --danger-soft: hsl(6 35% 17%);
        --info: hsl(205 55% 70%);
        --info-soft: hsl(205 35% 16%);
        --shadow-low: none;
      }
      .night .btn.primary {
        color: hsl(170 60% 8%);
      }
      .night .btn.primary:hover {
        background: hsl(152 52% 70%);
      }
      .night .b-occupied {
        color: hsl(170 60% 8%);
      }
      .night .b-late {
        color: hsl(170 60% 8%);
      }
      .night .btn.danger {
        color: hsl(170 60% 8%);
      }

      .stage {
        display: grid;
        grid-template-columns: 1.25fr 1fr;
        gap: 24px;
        align-items: stretch;
      }
      .hero {
        padding: 36px 40px 32px;
        display: flex;
        flex-direction: column;
        min-height: 520px;
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
        box-shadow: var(--shadow);
      }
      .hero .eyebrow {
        color: rgba(255, 255, 255, 0.7);
      }
      .hero .when {
        display: flex;
        align-items: baseline;
        gap: 14px;
        margin: 22px 0 8px;
      }
      .hero .when .num {
        font-size: 120px;
      }
      .hero .when span {
        font-size: 18px;
        color: rgba(255, 255, 255, 0.75);
      }
      .hero h2 {
        font-size: 40px;
        font-weight: 300;
        letter-spacing: -0.03em;
        line-height: 1.08;
      }
      .hero h2 b {
        font-weight: 600;
      }
      .hero .why {
        color: rgba(255, 255, 255, 0.78);
        margin-top: 10px;
        font-size: 15px;
        max-width: 46ch;
      }
      .checks {
        margin: 26px 0 28px;
        display: grid;
        gap: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.18);
      }
      .checks li {
        list-style: none;
        display: grid;
        grid-template-columns: 28px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 11px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.18);
        font-size: 14.5px;
      }
      .checks .mk {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.16);
        font-size: 13px;
      }
      .checks .ok .mk {
        background: #fff;
        color: var(--accent);
      }
      .checks .no .mk {
        background: #ffd9d6;
        color: var(--danger);
      }
      .checks .val {
        color: rgba(255, 255, 255, 0.75);
        font-size: 13.5px;
      }
      .checks .no .val {
        color: #ffd9d6;
        font-weight: 600;
      }
      .hero .acts {
        margin-top: auto;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .hero .btn {
        border-color: rgba(255, 255, 255, 0.35);
        background: transparent;
        color: #fff;
      }
      .hero .btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .hero .btn.lead {
        background: #fff;
        color: var(--accent);
        border-color: #fff;
        font-weight: 600;
      }
      .hero .btn.lead:hover {
        background: var(--accent-soft);
      }
      .hero .step {
        margin-inline-start: auto;
        display: flex;
        gap: 8px;
      }
      .hero .step .btn {
        padding: 8px 12px;
      }

      .queue {
        padding: 28px 8px 12px;
      }
      .queue h2 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
        padding: 0 24px;
      }
      .queue > p {
        padding: 4px 24px 14px;
        color: var(--ink-muted);
        font-size: 13.5px;
      }
      .q {
        display: grid;
        grid-template-columns: 6px 36px 1fr auto;
        gap: 14px;
        align-items: center;
        width: 100%;
        border: 0;
        background: transparent;
        text-align: start;
        padding: 14px 24px 14px 18px;
        border-radius: 16px;
      }
      .q:hover {
        background: var(--canvas-deep);
      }
      .q[aria-pressed="true"] {
        background: var(--accent-soft);
        box-shadow: inset 0 0 0 1.5px var(--accent);
      }
      .q .bar {
        width: 5px;
        align-self: stretch;
        border-radius: 3px;
        background: var(--line-strong);
      }
      .q.late .bar {
        background: var(--danger);
      }
      .q.risk .bar {
        background: var(--warning);
      }
      .q .no {
        font-size: 28px;
        color: var(--ink-muted);
      }
      .q b {
        display: block;
        font-size: 15px;
        font-weight: 600;
      }
      .q span.d {
        color: var(--ink-muted);
        font-size: 13px;
      }
      .q .clk {
        font: 600 13px var(--mono);
        text-align: end;
      }
      .q.late .clk {
        color: var(--danger);
      }
      .q.risk .clk {
        color: var(--warning);
      }
      .q .clk small {
        display: block;
        font: 400 11.5px var(--font);
        color: var(--ink-muted);
      }

      .pipe {
        margin-top: 24px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }
      .lane {
        padding: 24px 26px 14px;
      }
      .lane header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 4px;
      }
      .lane h3 {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .lane h3 .ic {
        color: var(--accent);
        font-size: 18px;
      }
      .lane header .num {
        font-size: 40px;
      }
      .lane > p {
        color: var(--ink-muted);
        font-size: 13px;
        margin-bottom: 10px;
      }
      .g {
        display: grid;
        grid-template-columns: 54px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 11px 0;
        border-top: 1px solid var(--line);
        font-size: 14px;
      }
      .g .rm {
        font-size: 20px;
        font-weight: 300;
        letter-spacing: -0.02em;
      }
      .g small {
        display: block;
        color: var(--ink-muted);
        font-size: 12.5px;
      }
      .g.done {
        opacity: 0.5;
      }
      .g .badge {
        font-size: 12px;
      }
      .prog {
        height: 4px;
        border-radius: 2px;
        background: var(--line);
        margin-top: 6px;
        overflow: hidden;
      }
      .prog i {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      .more {
        padding: 12px 0 8px;
        border-top: 1px solid var(--line);
        color: var(--ink-muted);
        font-size: 13px;
      }
      @media (max-width: 1100px) {
        .stage,
        .pipe {
          grid-template-columns: 1fr;
        }
        .hdr {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>

          guest: "Okafor",
          room: "203",
          at: "11:00",
          doneAt: "09:50",
          done: true,
          owes: 0,
        },
        {
          guest: "Silva",
          room: "304",
          at: "12:00",
          doneAt: "11:20",
          done: true,
          owes: 0,
        },
        {
          guest: "Brandt",
          room: "104",
          at: "12:00",
          doneAt: "11:40",
          done: true,
          owes: 0,
        },
        { guest: "Kaya", room: "103", at: "12:00", owes: 1240 },
        { guest: "Novak", room: "204", at: "15:00", owes: 0 },
        { guest: "Okonkwo", room: "302", at: "17:00", owes: 380 },
      ];

      const COUNTS = ROOMS.reduce(
        (c, r) => ((c[r.state] = (c[r.state] || 0) + 1), c),
        {},
      );
      const SELLABLE = ROOMS.length - COUNTS.oos;
      const TONIGHT = 13;

      const $ = (s) => document.querySelector(s);
      const ic = (id) => `<svg class="ic"><use href="#${id}"/></svg>`;
      const mark = (ok) =>
        `<span class="mk">${ic(ok ? "i-check" : "i-x")}</span>`;

      const QUEUE = [
        {
          sev: "late",
          kind: "dep",
          room: "103",
          name: "Kaya",
          clk: dur(NOW - 720),
          clkS: "overdue",
          title: "Check out Kaya",
          d: "Room 103 · was due 12:00",
          eyebrow: "Overdue departure · Room 103",
          big: dur(NOW - 720),
          bigS: "past the planned 12:00",
          h: "<b>Kaya</b> has not checked out",
          why: "The room cannot be cleaned, and nobody has been told the guest is still in it.",
          checks: [
            [false, "Folio balance", lira(1240) + " owed"],
            [true, "Planned departure", "12:00 today"],
            [true, "Next arrival in this room", "None today"],
          ],
          lead: "Collect and check out",
          alt: ["Open folio", "Extend stay"],
        },
        {
          sev: "late",
          kind: "arr",
          room: "205",
          name: "Costa",
          clk: dur(NOW - 840),
          clkS: "late",
          title: "Costa has not arrived",
          d: "Room 205 · expected 14:00",
          eyebrow: "Late arrival · Room 205",
          big: dur(NOW - 840),
          bigS: "after the expected 14:00",
          h: "<b>Costa</b> is late",
          why: "Nothing is wrong yet. The room is ready and held, 3 nights booked.",
          checks: [
            [true, "Room 205 Twin", "Ready"],
            [true, "Folio", "No balance"],
            [true, "Booking W2PQ7LD", "3 nights · 2 guests"],
          ],
          lead: "Check in",
          alt: ["Open booking", "Change expected time"],
        },
        {
          sev: "risk",
          kind: "arr",
          room: "201",
          name: "Demir",
          clk: "in " + dur(960 - NOW),
          clkS: "16:00",
          title: "Room 201 for Demir",
          d: "Clean, not inspected",
          eyebrow: "Next arrival at risk · Room 201",
          big: dur(960 - NOW),
          bigS: "until the expected 16:00",
          h: "<b>Demir</b> arrives before 201 is inspected",
          why: "Housekeeping has cleaned it. One inspection makes it ready. Ready Double rooms: 101, 207.",
          checks: [
            [false, "Room 201 Double", "Clean, awaiting inspection"],
            [true, "Folio", "No balance"],
            [true, "Booking H8ZC3NB", "2 nights · 1 guest"],
          ],
          lead: "Open Housekeeping",
          alt: ["Change room", "Open booking"],
        },
        {
          sev: "risk",
          kind: "arr",
          room: "305",
          name: "Moreau",
          clk: "20:30",
          clkS: "in " + dur(1230 - NOW),
          title: "Room 305 for Moreau",
          d: "Dirty",
          eyebrow: "Arrival at risk · Room 305",
          big: dur(1230 - NOW),
          bigS: "until the expected 20:30",
          h: "<b>Moreau</b> is booked into a dirty room",
          why: "There is time. If 305 is not done by then, Twin 307 is ready.",
          checks: [
            [false, "Room 305 Twin", "Dirty"],
            [true, "Folio", "No balance"],
            [true, "Booking B7NX2UT", "1 night · 1 guest"],
          ],
          lead: "Open Housekeeping",
          alt: ["Change room", "Open booking"],
        },
        {
          sev: "",
          kind: "arr",
          room: "208",
          name: "Petrov",
          clk: "no time",
          clkS: "",
          title: "Petrov has no arrival time",
          d: "Room 208 · ready",
          eyebrow: "Arrival without a time · Room 208",
          big: "—:—",
          bigS: "no expected time on the booking",
          h: "<b>Petrov</b> has no expected time",
          why: "You cannot tell if they are late. Ask at check-in or add a time when they call.",
          checks: [
            [true, "Room 208 Double", "Ready"],
            [true, "Folio", "No balance"],
            [true, "Booking M3GA8SW", "2 nights · 2 guests"],
          ],
          lead: "Add expected time",
          alt: ["Open booking"],
        },
      ];
      let cur = 0;

      function renderHero() {
        const q = QUEUE[cur];
        $("#hero").innerHTML = `<span class="eyebrow">${q.eyebrow}</span>
    <div class="when"><span class="num">${q.big}</span><span>${q.bigS}</span></div>
    <h2>${q.h}</h2><p class="why">${q.why}</p>
    <ul class="checks">${q.checks.map(([ok, l, v]) => `<li class="${ok ? "ok" : "no"}">${mark(ok)}<span>${l}</span><span class="val">${v}</span></li>`).join("")}</ul>
    <div class="acts"><button class="btn lead">${q.lead}</button>${q.alt.map((a) => `<button class="btn">${a}</button>`).join("")}
      <span class="step"><button class="btn" id="prev" aria-label="Previous">${ic("i-arrow").replace("<svg", '<svg style="transform:scaleX(-1)"')}</button><button class="btn" id="next" aria-label="Next">${ic("i-arrow")}</button></span></div>`;
        $("#prev").onclick = () => {
          cur = (cur + QUEUE.length - 1) % QUEUE.length;
          render();
        };
        $("#next").onclick = () => {
          cur = (cur + 1) % QUEUE.length;
          render();
        };
      }

      function renderQueue() {
        $("#queue").innerHTML = QUEUE.map(
          (q, i) =>
            `<button class="q ${q.sev}" data-i="${i}" aria-pressed="${i === cur}"><span class="bar"></span><span class="num no">${i + 1}</span><span><b>${q.title}</b><span class="d">${q.d}</span></span><span class="clk">${q.clk}<small>${q.clkS}</small></span></button>`,
        ).join("");
      }

      function renderPipe() {
        const comingArr = ARRIVALS.filter((a) => !a.done);
        const arrRows = comingArr
          .slice(0, 4)
          .map((a) => {
            const s = room(a.room).state;
            const b =
              s === "ready"
                ? ["b-ready", "i-check", "Ready"]
                : s === "inspection"
                  ? ["b-inspection", "i-eye", "Inspect"]
                  : ["b-dirty", "i-drop", "Dirty"];
            return `<div class="g"><span class="rm">${a.room}</span><span>${a.guest}<small>${a.eta || "No time"} · ${a.nights} night${a.nights > 1 ? "s" : ""}</small></span><span class="badge ${b[0]}">${ic(b[1])}${b[2]}</span></div>`;
          })
          .join("");
        const stays = STAYS.filter((s) => !s.today);
        const inRows = stays
          .slice(0, 4)
          .map(
            (s) =>
              `<div class="g"><span class="rm">${s.room}</span><span>${s.guest}<small>Leaves ${s.out}</small></span><span class="mono" style="font-size:12.5px;color:var(--ink-muted)">${s.arrivedAt ? "In " + s.arrivedAt : ""}</span></div>`,
          )
          .join("");
        const dep = DEPARTURES.filter((d) => !d.done);
        const depRows = dep
          .map(
            (d) =>
              `<div class="g"><span class="rm">${d.room}</span><span>${d.guest}<small>${d.at}${toMin(d.at) < NOW ? " · " + dur(NOW - toMin(d.at)) + " overdue" : ""}</small></span><span class="badge ${d.owes ? (toMin(d.at) < NOW ? "b-late" : "b-inspection") : "b-ready"}">${d.owes ? lira(d.owes) : ic("i-check") + "Paid up"}</span></div>`,
          )
          .join("");
        const lane = (icon, t, n, sub, rows, more, pct) =>
          `<section class="panel lane"><header><h3>${ic(icon)}${t}</h3><span class="num">${n}</span></header><p>${sub}</p><div class="prog" aria-hidden="true"><i style="width:${pct}%"></i></div>${rows}${more ? `<div class="more">${more}</div>` : ""}</section>`;
        $("#pipe").innerHTML =
          lane(
            "i-in",
            "Arriving",
            comingArr.length,
            "still to come today · 1 of 7 already in",
            arrRows,
            comingArr.length > 4
              ? `+ ${comingArr.length - 4} more arrivals`
              : "",
            100 / 7,
          ) +
          lane(
            "i-bed",
            "In house",
            COUNTS.occupied,
            `${TONIGHT} expected tonight`,
            inRows,
            `+ ${stays.length - 4} more, plus ${dep.length} leaving today`,
            (COUNTS.occupied / SELLABLE) * 100,
          ) +
          lane(
            "i-out",
            "Leaving",
            dep.length,
            "still to leave today · 3 of 6 already out",
            depRows,
            "",
            50,
          );
      }

      function render() {
        renderHero();
        renderQueue();
      }
      document.addEventListener("click", (e) => {
        const q = e.target.closest(".q");
        if (q) {
          cur = +q.dataset.i;
          render();
        }
      });
      render();
      renderPipe();
    </script>
  </body>
</html>
