name: CI

on:
  pull_request:
  push:
    branches: [main, rebuild/blueprint]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Everything that needs a real PostgreSQL — now including the browser, which
  # needs the application in front of one. All of it was only ever run by hand
  # before, which for the pgTAP suites means the five gates of blueprint 3.5
  # were verified when somebody remembered to.
  #
  # `docker compose` rather than a service container, because the suites need
  # pgTAP and no official image ships it — docker/postgres is the image
  # `pnpm db:up` already builds, so CI and a developer's machine run the same
  # database rather than two that are merely similar.
  database:
    runs-on: ubuntu-latest
    env:
      # Dropped and recreated by db:drift, which refuses any host that is not
      # local. A throwaway database on a throwaway runner.
      SHADOW_DATABASE_URL: postgresql://ranza:ranza@localhost:54322/ranza_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:up
      - run: pnpm db:setup

      # Does the documented command actually serve a page?
      #
      # This job is the only place that can ask. `pnpm test:browser` cannot:
      # `playwright.config.ts` passes `env:` to the server it starts, so it
      # proves the application works when something hands it a connection
      # string, never that `pnpm dev` hands it one. That gap is exactly where a
      # real failure lived — every route answering "DATABASE_URL must be set"
      # while CI stayed green, because Turbo 2 runs in strict env mode and
      # forwarded nothing, and nothing loaded a .env for the applications
      # either.
      #
      # So this runs `pnpm dev` with no environment of its own, asks for the
      # sign-in page, and fails on a server that never answers 200 AND on one
      # that does while complaining in its log. Two checks because they are two
      # failures: a missing DATABASE_URL is a 500 on every request, and a
      # missing WORKER_DATABASE_URL ends the worker at startup.
      #
      # Prisma Client is generated rather than committed, and unlike
      # `test:browser` this does not generate it as part of starting.
      - run: pnpm --filter @ranza/db generate
      - run: pnpm dev:smoke

      # The five gates, the append-only rules, and the policies. A suite that
      # runs nowhere is a suite that is true until somebody changes it.
      - run: pnpm db:test

      # Do the migrations and schema.prisma still say the same thing? They
      # drifted once: three partial indexes lived only in migration SQL, so
      # Prisma could not see them and the next `migrate dev` would have dropped
      # all three (ADR 0001). `--from-migrations` replays every migration into
      # the shadow database, so this compares what they produce against what
      # the schema says — not two files that happen to be edited together.
      - run: pnpm db:drift

      # The workspace in a browser: sign in, press Check in, see the row say the
      # Guest arrived. Last, because it seeds a demo Organization and leaves a
      # Stay behind, and the suites above are entitled to a database nobody has
      # been working in. `pnpm test:browser` starts the application itself and
      # refuses any database that is not this runner's own.
      # Prisma Client is generated rather than committed, and `pnpm test:browser`
      # generates it as part of starting the server — so there is nothing to do
      # here but bring a browser.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
