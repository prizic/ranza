name: CI

on:
  pull_request:
  push:
    branches: [main, rebuild/blueprint]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # The migrations and schema.prisma have to say the same thing. They drifted
  # once already: three partial indexes lived only in migration SQL, so Prisma
  # could not see them and the next `migrate dev` would have dropped all three
  # (ADR 0001). A claim in a document did not catch that; this does.
  #
  # `--from-migrations` replays every migration into the shadow database, so
  # this compares what the migrations actually produce against what the schema
  # says — not two files that happen to be edited together.
  database:
    runs-on: ubuntu-latest
    services:
      # Major version pinned to the hosted database's. A predicate normalised
      # differently by another major would make this job disagree with
      # production about whether there is drift.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ranza
          POSTGRES_PASSWORD: ranza
          POSTGRES_DB: ranza_shadow
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U ranza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Dropped and recreated by the command. A throwaway database on a
      # throwaway runner, which is the only place a default like this is safe.
      SHADOW_DATABASE_URL: postgresql://ranza:ranza@localhost:54322/ranza_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:drift
