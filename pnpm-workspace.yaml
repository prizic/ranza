packages:
  - apps/*
  - packages/*
  - packages/platform/*
  - packages/ranza/*
  - packages/adapters/*

# Prisma's postinstall fetches its engines; esbuild builds its native binary.
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.103.0"
  - "@tanstack/react-query@5.103.0"
